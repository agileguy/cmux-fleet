; FIXTURE PAYLOAD — appended to the real `.git/config` by the seeder.
;
; `.git/config` is never part of a commit, so this is the shape left by a
; clone with a hostile template, a prior toolchain, or a worker with write
; access to its own mount. Every key here names a program git will execute,
; and none of them is suppressible by GIT_CONFIG_GLOBAL/SYSTEM — only the
; command line reaches the repository config.
[core]
	hooksPath = .githooks
	fsmonitor = touch __PIFLEET_MARKER_DIR__/fsmonitor-fired
[filter "harmless"]
	smudge = touch __PIFLEET_MARKER_DIR__/smudge-fired
	clean = touch __PIFLEET_MARKER_DIR__/clean-fired
[diff "harmless"]
	command = touch __PIFLEET_MARKER_DIR__/diff-driver-fired
