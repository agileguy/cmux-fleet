# Bun configuration (ISC-22).
#
# `coverage` is deliberately NOT set here. Enabling it globally would attach
# the profiler to every `bun test` invocation in the repo — including the
# narrow, fast runs (`bun test test/unit/harvest-outbox.test.ts`) that are the
# inner loop of working on this codebase — and would bury a one-line failure
# under a seventy-row table. Coverage is a report you ask for, so it lives
# behind `bun run test:coverage`; the keys below configure it for when you do.

[test]
# The `PIFLEET_*` environment guard (ISC-278). It has to be a PRELOAD and it has
# to be here rather than on a command line: the property it asserts — that no
# test file leaves a PIFLEET_* variable different at process exit from what it
# was at process load — is not observable from inside any test file, because by
# the time it can be judged no test file is running. Only an observer armed
# before the first file loads and checked after the last one finishes can see
# it, and the leak that motivated this was found by a human reading code, not by
# any command anyone runs on purpose. So it must cover a bare `bun test`.
#
# `[test] preload` IS honoured on bun 1.3.11 — probed, unlike `[test] timeout`,
# which is ignored (see test/support/budget.ts). The path is relative to this
# file. See test/support/env-hygiene.ts for what it checks and why an
# `afterAll` rather than a `process.on("exit")` handler.
preload = ["./test/support/env-hygiene-preload.ts"]

# The report answers "how much of src/ is exercised", and a test file's own
# 100% is not evidence of anything.
coverageSkipTestFiles = true

# `text` for a human reading the terminal, `lcov` for anything that ingests it
# (CI annotations, an editor gutter). `coverage/` is already gitignored.
coverageReporter = ["text", "lcov"]

# No `coverageThreshold`. A threshold turns the report into a build gate, and
# ISC-22 asks for a report that can be PRODUCED — a gate here would fail the
# build on day one and be raised to a number nobody believes by day two.
