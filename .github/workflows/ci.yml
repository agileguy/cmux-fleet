name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test test/unit
      - name: Integration tests
        run: bun test test/integration
      - name: E2E tests
        run: bun test test/e2e
      - name: Coverage lists every src/ module
        # ISC-22, and PER-PR rather than nightly by owner decision on
        # 2026-08-25, with the cost noted at the time: a profiled full-suite
        # run is ~245 s on top of a job already at ~6 minutes.
        #
        # What it buys over nightly is that a module added with no importer
        # cannot MERGE. The criterion's original defect — `tui.ts` absent
        # because nothing imported it in-process — was found by a human reading
        # a seventy-row table, which is not a control. Before this step CI ran
        # `test/unit`, `test/integration` and `test/e2e` and never
        # `test:coverage`, so the "every module" property was re-checked by
        # nothing at all.
        #
        # The script grades a report; it does not produce one, and it fails in
        # BOTH directions — an undeclared absence, and a declared exemption
        # that has become false. Its logic is unit-tested in
        # `test/unit/coverage-modules.test.ts` at unit speed, because a checker
        # whose only proof is a green CI job is indistinguishable from one that
        # returns 0 unconditionally.
        run: |
          bun run test:coverage
          bun scripts/coverage-modules.ts
      - name: The live-oMLX probes, accounted for rather than silently skipped
        # ISC-262. `test/integration/model-probe.test.ts` gates on
        # `PIFLEET_OMLX=1`; before this step, `grep -rn PIFLEET_OMLX .github/`
        # returned NOTHING, so its four probes skipped in every job and nothing
        # counted them. The step above collects the file — it is part of
        # `test/integration` — and reports its four skips inside a summary of
        # several hundred, where no human has ever noticed them.
        #
        # BE PRECISE ABOUT WHAT THIS STEP DOES AND DOES NOT ACHIEVE. It does
        # NOT make those probes run. They need a real Apple-silicon inference
        # server, which no GitHub-hosted runner has and none ever will, so on
        # this runner they still skip — every one of them. What changes is that
        # the skip is now PINNED BY NAME and ACCOUNTED FOR: if a probe is
        # renamed, deleted, added, or starts skipping for a different reason,
        # this step goes red and says which. An invisible skip became a
        # visible, enumerated one. That is a real improvement and it is not
        # coverage, and ISC-262 is graded `[~]` in ISA.md accordingly.
        #
        # The inverse case is handled by the same guard for free. Point this at
        # a self-hosted runner with `PIFLEET_OMLX=1` and the pins below must be
        # removed, at which point an empty pin list permits NO skips — so a
        # half-configured environment that asks for the live probes and gets
        # skips fails loudly instead of quietly, which is exactly what the
        # file's own header asks for.
        #
        # NO SECRET IS WIRED IN HERE, deliberately. `OMLX_API_KEY` would not
        # change a single outcome: the probes reach for `http://localhost:8000`
        # and nothing is listening, so they skip with or without a key. Putting
        # a live credential on a runner to buy nothing is a cost with no
        # benefit, and this file went to some trouble in #18 to stop that key
        # leaking through argv.
        #
        # Cheap enough to run twice: everything in it skips, so the whole step
        # is milliseconds. It is kept SEPARATE from the container job on
        # purpose — that job needs a Docker daemon and a multi-minute image
        # build, and hanging the oMLX accounting off it would make this
        # evidence unavailable on any PR where the image happens to be broken.
        env:
          LABEL: live-oMLX
          # EIGHTEEN collected, not eight, and not four.
          #
          # FOUR are the original live probes, all `test.skipIf(!LIVE)` and all
          # pinned by name below. The other FOURTEEN are deliberately plain
          # `test(...)` and NOT under this file's `it = test.skipIf(!LIVE)` —
          # they stand up their own stubs on ephemeral ports, need no oMLX and
          # no Docker, and so must run on every push. Do not move them under
          # `it`; that would make these criteria unreadable in CI.
          #
          # Where the fourteen come from:
          #   4  ISC-291's host-dial-target tests
          #   6  the host dial target carries every part of base_url — userinfo,
          #      a user:password pair, a fragment, a query (including the
          #      slash-into-a-pathless-URL case), an explicit trailing slash,
          #      and all of them at once through relay_upstream
          #   3  base_url must be http or https (file:/ftp:/gopher: refused,
          #      https: accepted)
          #   1  doctor never forwards the API key to a redirect target
          #
          # Collection, not passes: see the total check in probe-guard.sh for
          # why that is the number that catches a file falling out of the run.
          # The pinned skip NAMES below are unaffected — every one of the
          # fourteen passes rather than skips, so the skip set is still exactly
          # the four live probes.
          #
          # DERIVED, not incremented. Measured on bun 1.3.11:
          #     bun test test/integration/model-probe.test.ts
          #     -> 14 pass, 4 skip, 0 fail. Ran 18 tests across 1 file.
          TOTAL_EXPECTED: "18"
          # The exact NAMES, checked against the junit report, not merely how
          # many. A bare count cannot tell "the live probes skipped" apart from
          # "one live probe was deleted and some unrelated test started
          # skipping" — the arithmetic reads identical, and only one of those
          # is fine to ship.
          EXPECTED_LIVE_OMLX_PROBE_SKIPS: |
            a served chat model answers the tools-bearing probe with a native call
            the model list doctor prints is the list the server is serving (ISC-54)
            the completion latency doctor prints is a real measured number (ISC-55)
            the no-config fallback never picks an embedding model to chat with
        run: |
          set -eu
          JUNIT_FILE="${RUNNER_TEMP:?RUNNER_TEMP is not set by actions/runner}/pifleet-omlx-probes.junit.xml" \
          EXPECTED_SKIPS="$EXPECTED_LIVE_OMLX_PROBE_SKIPS" \
            .github/scripts/probe-guard.sh test/integration/model-probe.test.ts

  # ISC-266. The criterion says the fix "should be judged by deliberately
  # running the suite under load, not by re-running it on a quiet box until it
  # passes." A script in `.github/scripts/` that a developer must remember to
  # run is not a judgement, it is a suggestion — and a suggestion is exactly
  # what ISC-266 already had in the form of "just re-run it". This job is what
  # turns the harness into something that re-checks the criterion whether or
  # not anyone remembers to.
  #
  # WHAT IT PROVES. That the per-test budgets in test/support/budget.ts are
  # adequate for the work their tests do when the machine is contended, rather
  # than merely adequate on an idle box. If a budget is too small — or if a
  # test's spawn count grows and its `cliBudget(N)` is not updated with it —
  # this job goes red, and it goes red HERE, on a PR, instead of on a
  # developer's machine at 5pm where it gets dismissed as "the flaky one".
  # That dismissal is the actual harm ISC-266 describes.
  #
  # WHAT IT DOES NOT PROVE, stated because the difference is the whole reason
  # this criterion exists. A GitHub runner is not a developer workstation:
  # measured on run 32291463113 it reports TWO cores, against the 14 the
  # ISC-266 numbers were taken on, and it carries none of the editor, language
  # server, browser and concurrent agents that produced the load average of
  # 18.40 recorded in the criterion. This job reproduces the SHAPE of the
  # defect — CPU contention stretching subprocess spawns past a fixed ceiling —
  # at a smaller magnitude. It is a floor on the evidence, not a ceiling, and
  # ISA.md grades ISC-266 with that limitation written into the criterion
  # rather than left implied.
  #
  # IT DOES MEASURABLY APPLY LOAD, which is worth pinning down because a job
  # that is green having done nothing is the failure mode this repo has spent
  # a session eliminating. On run 32291463113, the same commit and the same
  # runner class ran `test/integration` in 124.32s in the `test` job and
  # 222.78s here — 1.79x, which is the SAME inflation factor measured locally
  # on 14 cores (167.76s -> 300.87s). Two loops against two cores is genuine
  # contention: three runnable threads competing for two CPUs.
  #
  # Do NOT read the "load average now" line the script prints as the evidence.
  # It is a one-minute average sampled two seconds after the generators start,
  # so it always reads low (0.95 on the run above) and says nothing about
  # whether load was applied. The wall-clock comparison above is the evidence.
  #
  # WHY IT IS A SEPARATE JOB. It deliberately makes the machine slow. Hanging
  # it off `test` would contaminate the clean timings that job exists to
  # produce, and would make any failure there ambiguous between "the code is
  # broken" and "the box was busy" — which is precisely the confusion ISC-266
  # was filed over. Keeping them apart means a red `test` and a red `load` say
  # different things.
  #
  # The script sizes its own load from the runner's core count, so this needs
  # no tuning per runner; it self-terminates and traps, so it cannot leave the
  # runner spinning; and it exits with the test run's own status, so this is a
  # gate rather than a report.
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: The integration suite, under deliberate CPU contention (ISC-266)
        run: .github/scripts/test-under-load.sh

  # The container suite is a separate job because it builds the worker image
  # (google-cloud-cli, kubectl, helm — many minutes) and must not gate fast
  # feedback. It is NOT optional: without it, every Group C and Group J
  # criterion reports green having never executed, because the tests self-skip
  # when PIFLEET_DOCKER is unset.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `id-token: write` is what lets this job ask GitHub for an OIDC token to
    # exchange with Google. `contents: read` is restated because naming ANY
    # permission drops every other one to none, and checkout needs it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      # ISC-41/46/47/255 — the host Google credential this job never had.
      #
      # NO KEY EXISTS. This is workload identity federation: GitHub mints a
      # short-lived OIDC token for this run, Google's STS exchanges it for
      # credentials, and the provider REFUSES the exchange unless the token's
      # `assertion.repository` is exactly `agileguy/cmux-fleet`. There is no
      # service-account JSON in this repo, in these secrets, or on this runner
      # — nothing to leak and nothing to rotate.
      #
      # WHY THIS UN-SKIPS FOUR PROBES AND CHANGES NO TEST CODE: `hostAdcFile()`
      # honours `GOOGLE_APPLICATION_CREDENTIALS` first, "because that is
      # gcloud's own ADC lookup order", and this action exports it. So
      # `HOST_ADC_PRESENT` becomes true through the PRODUCTION lookup rule
      # rather than through a test-only branch added to make CI green.
      #
      # The three secrets hold IDENTIFIERS, not credentials — a provider
      # resource path and two service-account emails. They are secrets rather
      # than variables only because this repository is public and the values
      # name a personal GCP project.
      - name: Authenticate to Google Cloud (keyless, federated)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
      # `mintArgv` shells out to `gcloud auth application-default
      # print-access-token`, so the binary has to be here. It is NOT on the
      # ubuntu-24.04 runner image by default, and its absence would surface as
      # a mint failure inside adc.test.ts rather than as a missing tool.
      #
      # ORDER IS LOAD-BEARING: this runs BEFORE the credential is relocated
      # below. `setup-gcloud` re-reads the path the AUTH step exported into its
      # own action state, not whatever `GOOGLE_APPLICATION_CREDENTIALS` says
      # now, so relocating first made it fail with `[Errno 2] No such file or
      # directory` on the workspace path. Measured, not predicted — that is
      # exactly how the first run of this job died.
      - name: Install the gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
      # THE CREDENTIAL MUST NOT SIT IN THE WORKSPACE, and this is a real
      # hazard in THIS repo rather than general hygiene.
      #
      # `google-github-actions/auth` writes its credential file into
      # `$GITHUB_WORKSPACE` — the checkout directory. Several probes here
      # bind-mount a repo directory into a container as `/workspace`, and
      # `run.repo` is operator-configurable, so a live credential parked there
      # is one mount away from being readable inside a worker. That is ISC-44's
      # exposure class, arriving through a path `classifyHostGcloudExposure`
      # does NOT flag: it asks whether a mount source contains the gcloud
      # STORE (`~/.config/gcloud`), and this file is nowhere near it.
      #
      # Moving it is safe because the file is self-contained: in federated mode
      # it is an `external_account` config whose `credential_source` is a URL —
      # GitHub's OIDC endpoint — not a second file left behind.
      #
      # BOTH stores are re-pointed, because there are two and they are read by
      # different callers. `GOOGLE_APPLICATION_CREDENTIALS` is what
      # `hostAdcFile()` and `application-default print-access-token` follow;
      # gcloud's own account store is what `setup-gcloud` populated with the
      # old path, and leaving it dangling would break any plain `gcloud`
      # call the probes make.
      - name: Move the federated credential out of the workspace
        run: |
          set -eu
          src="${GOOGLE_APPLICATION_CREDENTIALS:?the auth step did not export it}"
          dest="${RUNNER_TEMP:?RUNNER_TEMP is not set by actions/runner}/gha-creds.json"
          mv "$src" "$dest"
          # BOTH forms, and both are needed. `$GITHUB_ENV` takes effect in
          # LATER steps only, so without the export the verification at the
          # bottom of THIS step still resolves the old workspace path — which
          # is precisely how the second attempt at this job failed:
          #   ERROR: (gcloud.auth.application-default.print-access-token)
          #   File .../gha-creds-<id>.json was not found.
          export GOOGLE_APPLICATION_CREDENTIALS="$dest"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$dest" >> "$GITHUB_ENV"
          # THE ACCOUNT STORE HAS AN ENV OVERRIDE THAT BEATS `auth login`, and
          # this step used to leave it dangling. `google-github-actions/auth`
          # exports CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE (and
          # GOOGLE_GHA_CREDS_PATH) naming the WORKSPACE file; gcloud reads that
          # variable in preference to whatever `auth login --cred-file` wrote,
          # so re-pointing only the store below left every plain `gcloud <api>`
          # call resolving a path this step had just moved:
          #   ERROR: (gcloud.iam.service-accounts.describe) Failed to load
          #   credential file: [.../gha-creds-<id>.json]. File ... not found.
          # It stayed invisible because nothing in the suite made a plain
          # gcloud API call — the ADC mints follow GOOGLE_APPLICATION_CREDENTIALS
          # and were fine — until ISC-48's identity probe asked IAM for a
          # service account's uniqueId. Re-pointed by COMPARISON with `$src`,
          # so a variable naming something else is reported rather than
          # silently overwritten.
          for var in CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE GOOGLE_GHA_CREDS_PATH; do
            eval "cur=\${$var:-}"
            if [ "$cur" = "$src" ]; then
              export "$var=$dest"
              echo "$var=$dest" >> "$GITHUB_ENV"
              echo "re-pointed $var at the relocated credential"
            elif [ -n "$cur" ]; then
              echo "::warning::$var names $cur, which is not the credential this step moved"
            fi
          done
          gcloud --quiet auth login --force --cred-file "$dest"
          # Prove the workspace is clean rather than assuming the mv covered
          # every file the action may have written.
          leftovers="$(find "${GITHUB_WORKSPACE:?}" -maxdepth 1 -name 'gha-creds-*.json' -print)"
          if [ -n "$leftovers" ]; then
            echo "::error::a federated credential is still in the workspace: $leftovers"
            exit 1
          fi
          # And prove the relocation did not break minting, here rather than
          # 20 minutes later inside adc.test.ts. The token is never printed.
          gcloud auth application-default print-access-token > /dev/null
          # And the OTHER store, separately, because they fail independently:
          # the line above follows GOOGLE_APPLICATION_CREDENTIALS and passed
          # for months while every plain `gcloud` call was broken. Neither
          # token is printed.
          gcloud auth print-access-token > /dev/null
          echo "mint OK from $dest — both the ADC store and the account store"
      - name: Confirm a Docker daemon is present
        run: docker info
      - name: Build the worker image
        run: bun run src/cli/index.ts image build -c fleet.example.yaml --toolchain node
      - name: Tag it for the container suites
        run: |
          set -eux
          # `image list --json` emits a bare array, not {images: [...]}. Reading
          # the wrong shape threw before `set -e` could report which step failed,
          # so this job was red from the day it was added and no container
          # criterion had ever actually executed. Fail loudly on an empty list.
          tag="$(bun run src/cli/index.ts image list -c fleet.example.yaml --json \
                 | bun -e 'const d = JSON.parse(await Bun.stdin.text());
                           const t = Array.isArray(d) ? d[0]?.tag : undefined;
                           if (!t) { console.error("image list returned no images"); process.exit(1); }
                           console.log(t);')"
          docker tag "$tag" pifleet/pi-worker:verify
      - name: Pull the relay image the egress relay runs
        # `relay.test.ts` starts real relay containers, and the relay runs plain
        # upstream Node pinned by digest — NOT the worker image, deliberately,
        # so `up` cannot be taken down by an unrelated image problem. `docker
        # run` would pull it implicitly on first use, inside a test with a 180s
        # budget; pulling it here instead puts the download in a step of its
        # own, so a registry failure reads as a registry failure rather than as
        # a mysteriously slow relay probe.
        #
        # The digest is read FROM THE SOURCE rather than copied here. A second
        # copy of a pinned digest in a workflow is a copy that goes stale the
        # first time the real one is bumped, and this way a rename of the export
        # fails the step instead of silently pulling nothing.
        run: |
          set -eux
          relay_image="$(bun -e 'import { RELAY_IMAGE } from "./src/security/relay.ts";
                                 if (!RELAY_IMAGE) { console.error("RELAY_IMAGE is empty"); process.exit(1); }
                                 console.log(RELAY_IMAGE);')"
          docker pull "$relay_image"
      - name: Pull the bun image the ISC-126 second-uid probe runs in
        # `control-socket-uid.test.ts` runs BOTH ends of the control socket
        # inside ONE container — the server as uid 0, the probing client as uid
        # 12345 — rather than bind-mounting the socket and connecting from a
        # container. That shape cannot work on macOS at all: connect(2) to a
        # bind-mounted unix socket returns ENOTSUP even from a path the VM
        # shares, identically for a matching and a differing uid, so it could
        # never be observed green anywhere but here. The file's header carries
        # the measurement.
        #
        # The server half executes the real `serveJsonlSocket`, so the image
        # needs `bun`. The worker image only carries one under `--toolchain
        # node`, whose `npm install -g bun` layer cannot be built on the
        # maintainer's proxied network — hence a separate, digest-pinned image
        # rather than a reuse.
        #
        # Pulled in a step of its own for the same reason as the relay image
        # above: a registry failure should read as a registry failure and not as
        # a mysteriously slow security probe inside a 60 s budget.
        #
        # The digest is read FROM THE SOURCE rather than copied here, so a
        # rename of the export fails this step instead of silently pulling
        # nothing.
        run: |
          set -eux
          probe_image="$(bun -e 'import { PROBE_BUN_IMAGE } from "./test/support/probe-image.ts";
                                 if (!PROBE_BUN_IMAGE) { console.error("PROBE_BUN_IMAGE is empty"); process.exit(1); }
                                 console.log(PROBE_BUN_IMAGE);')"
          docker pull "$probe_image"
      - name: Container, verbgate, egress, relay, and ADC probes, verified rather than merely run
        env:
          PIFLEET_DOCKER: "1"
          # ISC-292's remote-daemon reproducer. Its own gate, not
          # PIFLEET_DOCKER, because it needs something the other files here do
          # not: permission to run a PRIVILEGED container, so it can stand up a
          # second Docker daemon whose filesystem differs from this runner's.
          # A separate name means a runner that refuses --privileged fails one
          # named probe rather than making ten look broken.
          PIFLEET_DIND: "1"
          LABEL: container
          # All ten PIFLEET_DOCKER-gated files, run ONCE by this step, which
          # both prints their output and grades it. This used to be two
          # separate steps — a "probes" step that ran these files for
          # their own sake, and a "guard" step below it that ran the SAME
          # files a SECOND time just to check the summary counts. That doubled
          # real Docker cost for no additional coverage: 88 tests against a
          # real daemon, several individually timed out at 60-180s (see
          # adc.test.ts's ISC-47/255/41/46 blocks), inside a 60-minute job
          # budget that also builds google-cloud-cli into the worker image
          # beforehand. It also meant the two runs could disagree — a flaky
          # probe passing in one and failing in the other — which would have
          # made either result misleading about what actually happened.
          # Capturing the one real run's output and grading THAT is strictly
          # better: same coverage, roughly half the Docker time, one truth.
          #
          # 81 -> 86 is container-launch.test.ts (the container launcher).
          # FOUR of its five tests need no daemon — they plant a recorder as
          # the launch record's argv and assert the supervisor spawned it
          # VERBATIM, which is a property of argv handling and not of Docker —
          # and they run in the fast `test` job too. The fifth needs a real
          # container: it starts one DETACHED, throws the client away, and
          # asserts `down` still removes it, which is the orphan `--rm` cannot
          # reap because `--rm` is a client-side action and the client is the
          # supervisor the kill ladder just killed. A fake there would assert
          # that a function was called, which was never in doubt.
          #
          # Listed here by the same rule that lists probe-in-network.test.ts
          # and omits relay-script.test.ts: a file with at least one
          # daemon-REQUIRING probe belongs in this job, or that probe has no
          # automated reader anywhere and becomes exactly the self-skipping
          # test this guard exists to catch. The four daemon-free ones running
          # twice is the accepted cost, and they are milliseconds.
          #
          # TOTAL_EXPECTED is 90 = 20 (image.test.ts: 15 fixed cases + 5
          # generated from the toolchain-baseline `probes` array — gcloud,
          # kubectl, helm, jq, curl) + 25 (verbgate.test.ts — up from 23 with
          # ISC-172's two container-end probes: the shim writes where the
          # collector looks, and a worker that truncates its own ledger cannot
          # erase what was already collected) + 5
          # (egress.test.ts) + 18 (adc.test.ts — up from 12 now that the
          # ISC-44/45/46 mount-shape and credential-absence blocks exist) + 8
          # (relay.test.ts: 3 bridge-denial/enumeration probes and 6 relay
          # probes, of which the TWO live-oMLX ones always skip on a runner)
          # (relay.test.ts gains a 9th with ISC-265's drift probe — see the
          # re-derivation below; it needs a daemon but NOT oMLX, so unlike the
          # two live-oMLX probes it RUNS here rather than skipping)
          # + 5 (probe-in-network.test.ts, added by ISC-260)
          # + 2 (container-env.test.ts, added by ISC-31/ISC-127)
          # + 5 (container-launch.test.ts, added by the container launcher)
          # + 2 (doctor-preflight.test.ts, added by ISC-292).
          #
          # 20 + 25 + 5 + 18 + 9 + 5 + 2 + 5 + 2 = 91. The arithmetic is written
          # out because this constant has drifted from its own prose twice, and
          # both times the prose was the half nobody re-derived.
          #
          # ISC-51's close (2026-08-23) does NOT move this number, and the
          # reason is worth writing down because it looks like it should. The
          # gateway-residual probe was INVERTED, not added to: it asserted the
          # deny-all bridge REACHED a host-namespace beacon and now asserts it
          # reaches nothing at all. A rewrite in place changes no count. It did
          # change the probe's NAME again ("...and is exactly the host-namespace
          # listeners" -> "...and is EMPTY — the bridge gateway is contained"),
          # which matters only for probes pinned by name in an EXPECTED_SKIPS
          # list; this one RUNS on the runner and is pinned in neither.
          #
          # 79 -> 81 is container-env.test.ts, which reads ISC-31 and ISC-127
          # back out of `docker inspect` on a container started from the argv
          # `renderWorker` actually produced. Both probes need ONLY a daemon
          # and the worker image — no host Google credential, no inference
          # server — so both RUN in this job and neither is pinned below. That
          # is the whole reason the file was added here rather than left to a
          # developer's machine: before it, ISC-31's `docker inspect` wording
          # and ISC-127's mount-table wording had no automated reader at all.
          #
          # 77 -> 79 comes from ISC-261 and ISC-258 adding one probe each to
          # relay.test.ts:
          #   + "the relay opens exactly its two derived ports on the bridge,
          #      and every sibling on the bridge is an expected fleet member"
          #      (ISC-261; renamed by ISC-263, which made the relay's
          #      sanctioned listener set two ports rather than one)
          #   + "a live INFERENCE round-trips through the relay, differentially
          #      against a host control" (ISC-258, skips here)
          # ISC-261 also REWROTE the gateway-residual probe in place — from
