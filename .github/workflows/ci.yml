name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test test/unit
      - name: Integration tests
        run: bun test test/integration
      - name: E2E tests
        run: bun test test/e2e
      - name: Coverage lists every src/ module
        # ISC-22, and PER-PR rather than nightly by owner decision on
        # 2026-08-25, with the cost noted at the time: a profiled full-suite
        # run is ~245 s on top of a job already at ~6 minutes.
        #
        # What it buys over nightly is that a module added with no importer
        # cannot MERGE. The criterion's original defect — `tui.ts` absent
        # because nothing imported it in-process — was found by a human reading
        # a seventy-row table, which is not a control. Before this step CI ran
        # `test/unit`, `test/integration` and `test/e2e` and never
        # `test:coverage`, so the "every module" property was re-checked by
        # nothing at all.
        #
        # The script grades a report; it does not produce one, and it fails in
        # BOTH directions — an undeclared absence, and a declared exemption
        # that has become false. Its logic is unit-tested in
        # `test/unit/coverage-modules.test.ts` at unit speed, because a checker
        # whose only proof is a green CI job is indistinguishable from one that
        # returns 0 unconditionally.
        run: |
          bun run test:coverage
          bun scripts/coverage-modules.ts
      - name: The live-oMLX probes, accounted for rather than silently skipped
        # ISC-262. `test/integration/model-probe.test.ts` gates on
        # `PIFLEET_OMLX=1`; before this step, `grep -rn PIFLEET_OMLX .github/`
        # returned NOTHING, so its four probes skipped in every job and nothing
        # counted them. The step above collects the file — it is part of
        # `test/integration` — and reports its four skips inside a summary of
        # several hundred, where no human has ever noticed them.
        #
        # BE PRECISE ABOUT WHAT THIS STEP DOES AND DOES NOT ACHIEVE. It does
        # NOT make those probes run. They need a real Apple-silicon inference
        # server, which no GitHub-hosted runner has and none ever will, so on
        # this runner they still skip — every one of them. What changes is that
        # the skip is now PINNED BY NAME and ACCOUNTED FOR: if a probe is
        # renamed, deleted, added, or starts skipping for a different reason,
        # this step goes red and says which. An invisible skip became a
        # visible, enumerated one. That is a real improvement and it is not
        # coverage, and ISC-262 is graded `[~]` in ISA.md accordingly.
        #
        # The inverse case is handled by the same guard for free. Point this at
        # a self-hosted runner with `PIFLEET_OMLX=1` and the pins below must be
        # removed, at which point an empty pin list permits NO skips — so a
        # half-configured environment that asks for the live probes and gets
        # skips fails loudly instead of quietly, which is exactly what the
        # file's own header asks for.
        #
        # NO SECRET IS WIRED IN HERE, deliberately. `OMLX_API_KEY` would not
        # change a single outcome: the probes reach for `http://localhost:8000`
        # and nothing is listening, so they skip with or without a key. Putting
        # a live credential on a runner to buy nothing is a cost with no
        # benefit, and this file went to some trouble in #18 to stop that key
        # leaking through argv.
        #
        # Cheap enough to run twice: everything in it skips, so the whole step
        # is milliseconds. It is kept SEPARATE from the container job on
        # purpose — that job needs a Docker daemon and a multi-minute image
        # build, and hanging the oMLX accounting off it would make this
        # evidence unavailable on any PR where the image happens to be broken.
        env:
          LABEL: live-oMLX
          # EIGHTEEN collected, not eight, and not four.
          #
          # FOUR are the original live probes, all `test.skipIf(!LIVE)` and all
          # pinned by name below. The other FOURTEEN are deliberately plain
          # `test(...)` and NOT under this file's `it = test.skipIf(!LIVE)` —
          # they stand up their own stubs on ephemeral ports, need no oMLX and
          # no Docker, and so must run on every push. Do not move them under
          # `it`; that would make these criteria unreadable in CI.
          #
          # Where the fourteen come from:
          #   4  ISC-291's host-dial-target tests
          #   6  the host dial target carries every part of base_url — userinfo,
          #      a user:password pair, a fragment, a query (including the
          #      slash-into-a-pathless-URL case), an explicit trailing slash,
          #      and all of them at once through relay_upstream
          #   3  base_url must be http or https (file:/ftp:/gopher: refused,
          #      https: accepted)
          #   1  doctor never forwards the API key to a redirect target
          #
          # Collection, not passes: see the total check in probe-guard.sh for
          # why that is the number that catches a file falling out of the run.
          # The pinned skip NAMES below are unaffected — every one of the
          # fourteen passes rather than skips, so the skip set is still exactly
          # the four live probes.
          #
          # DERIVED, not incremented. Measured on bun 1.3.11:
          #     bun test test/integration/model-probe.test.ts
          #     -> 14 pass, 4 skip, 0 fail. Ran 18 tests across 1 file.
          TOTAL_EXPECTED: "18"
          # The exact NAMES, checked against the junit report, not merely how
          # many. A bare count cannot tell "the live probes skipped" apart from
          # "one live probe was deleted and some unrelated test started
          # skipping" — the arithmetic reads identical, and only one of those
          # is fine to ship.
          EXPECTED_LIVE_OMLX_PROBE_SKIPS: |
            a served chat model answers the tools-bearing probe with a native call
            the model list doctor prints is the list the server is serving (ISC-54)
            the completion latency doctor prints is a real measured number (ISC-55)
            the no-config fallback never picks an embedding model to chat with
        run: |
          set -eu
          JUNIT_FILE="${RUNNER_TEMP:?RUNNER_TEMP is not set by actions/runner}/pifleet-omlx-probes.junit.xml" \
          EXPECTED_SKIPS="$EXPECTED_LIVE_OMLX_PROBE_SKIPS" \
            .github/scripts/probe-guard.sh test/integration/model-probe.test.ts

  # ISC-266. The criterion says the fix "should be judged by deliberately
  # running the suite under load, not by re-running it on a quiet box until it
  # passes." A script in `.github/scripts/` that a developer must remember to
  # run is not a judgement, it is a suggestion — and a suggestion is exactly
  # what ISC-266 already had in the form of "just re-run it". This job is what
  # turns the harness into something that re-checks the criterion whether or
  # not anyone remembers to.
  #
  # WHAT IT PROVES. That the per-test budgets in test/support/budget.ts are
  # adequate for the work their tests do when the machine is contended, rather
  # than merely adequate on an idle box. If a budget is too small — or if a
  # test's spawn count grows and its `cliBudget(N)` is not updated with it —
  # this job goes red, and it goes red HERE, on a PR, instead of on a
  # developer's machine at 5pm where it gets dismissed as "the flaky one".
  # That dismissal is the actual harm ISC-266 describes.
  #
  # WHAT IT DOES NOT PROVE, stated because the difference is the whole reason
  # this criterion exists. A GitHub runner is not a developer workstation:
  # measured on run 32291463113 it reports TWO cores, against the 14 the
  # ISC-266 numbers were taken on, and it carries none of the editor, language
  # server, browser and concurrent agents that produced the load average of
  # 18.40 recorded in the criterion. This job reproduces the SHAPE of the
  # defect — CPU contention stretching subprocess spawns past a fixed ceiling —
  # at a smaller magnitude. It is a floor on the evidence, not a ceiling, and
  # ISA.md grades ISC-266 with that limitation written into the criterion
  # rather than left implied.
  #
  # IT DOES MEASURABLY APPLY LOAD, which is worth pinning down because a job
  # that is green having done nothing is the failure mode this repo has spent
  # a session eliminating. On run 32291463113, the same commit and the same
  # runner class ran `test/integration` in 124.32s in the `test` job and
  # 222.78s here — 1.79x, which is the SAME inflation factor measured locally
  # on 14 cores (167.76s -> 300.87s). Two loops against two cores is genuine
  # contention: three runnable threads competing for two CPUs.
  #
  # Do NOT read the "load average now" line the script prints as the evidence.
  # It is a one-minute average sampled two seconds after the generators start,
  # so it always reads low (0.95 on the run above) and says nothing about
  # whether load was applied. The wall-clock comparison above is the evidence.
  #
  # WHY IT IS A SEPARATE JOB. It deliberately makes the machine slow. Hanging
  # it off `test` would contaminate the clean timings that job exists to
  # produce, and would make any failure there ambiguous between "the code is
  # broken" and "the box was busy" — which is precisely the confusion ISC-266
  # was filed over. Keeping them apart means a red `test` and a red `load` say
  # different things.
  #
  # The script sizes its own load from the runner's core count, so this needs
  # no tuning per runner; it self-terminates and traps, so it cannot leave the
  # runner spinning; and it exits with the test run's own status, so this is a
  # gate rather than a report.
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: The integration suite, under deliberate CPU contention (ISC-266)
        run: .github/scripts/test-under-load.sh

  # The container suite is a separate job because it builds the worker image
  # (google-cloud-cli, kubectl, helm — many minutes) and must not gate fast
  # feedback. It is NOT optional: without it, every Group C and Group J
  # criterion reports green having never executed, because the tests self-skip
  # when PIFLEET_DOCKER is unset.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: Confirm a Docker daemon is present
        run: docker info
      - name: Build the worker image
        run: bun run src/cli/index.ts image build -c fleet.example.yaml --toolchain node
      - name: Tag it for the container suites
        run: |
          set -eux
          # `image list --json` emits a bare array, not {images: [...]}. Reading
          # the wrong shape threw before `set -e` could report which step failed,
          # so this job was red from the day it was added and no container
          # criterion had ever actually executed. Fail loudly on an empty list.
          tag="$(bun run src/cli/index.ts image list -c fleet.example.yaml --json \
                 | bun -e 'const d = JSON.parse(await Bun.stdin.text());
                           const t = Array.isArray(d) ? d[0]?.tag : undefined;
                           if (!t) { console.error("image list returned no images"); process.exit(1); }
                           console.log(t);')"
          docker tag "$tag" pifleet/pi-worker:verify
      - name: Pull the relay image the egress relay runs
        # `relay.test.ts` starts real relay containers, and the relay runs plain
        # upstream Node pinned by digest — NOT the worker image, deliberately,
        # so `up` cannot be taken down by an unrelated image problem. `docker
        # run` would pull it implicitly on first use, inside a test with a 180s
        # budget; pulling it here instead puts the download in a step of its
        # own, so a registry failure reads as a registry failure rather than as
        # a mysteriously slow relay probe.
        #
        # The digest is read FROM THE SOURCE rather than copied here. A second
        # copy of a pinned digest in a workflow is a copy that goes stale the
        # first time the real one is bumped, and this way a rename of the export
        # fails the step instead of silently pulling nothing.
        run: |
          set -eux
          relay_image="$(bun -e 'import { RELAY_IMAGE } from "./src/security/relay.ts";
                                 if (!RELAY_IMAGE) { console.error("RELAY_IMAGE is empty"); process.exit(1); }
                                 console.log(RELAY_IMAGE);')"
          docker pull "$relay_image"
      - name: Pull the bun image the ISC-126 second-uid probe runs in
        # `control-socket-uid.test.ts` runs BOTH ends of the control socket
        # inside ONE container — the server as uid 0, the probing client as uid
        # 12345 — rather than bind-mounting the socket and connecting from a
        # container. That shape cannot work on macOS at all: connect(2) to a
        # bind-mounted unix socket returns ENOTSUP even from a path the VM
        # shares, identically for a matching and a differing uid, so it could
        # never be observed green anywhere but here. The file's header carries
        # the measurement.
        #
        # The server half executes the real `serveJsonlSocket`, so the image
        # needs `bun`. The worker image only carries one under `--toolchain
        # node`, whose `npm install -g bun` layer cannot be built on the
        # maintainer's proxied network — hence a separate, digest-pinned image
        # rather than a reuse.
        #
        # Pulled in a step of its own for the same reason as the relay image
        # above: a registry failure should read as a registry failure and not as
        # a mysteriously slow security probe inside a 60 s budget.
        #
        # The digest is read FROM THE SOURCE rather than copied here, so a
        # rename of the export fails this step instead of silently pulling
        # nothing.
        run: |
          set -eux
          probe_image="$(bun -e 'import { PROBE_BUN_IMAGE } from "./test/support/probe-image.ts";
                                 if (!PROBE_BUN_IMAGE) { console.error("PROBE_BUN_IMAGE is empty"); process.exit(1); }
                                 console.log(PROBE_BUN_IMAGE);')"
          docker pull "$probe_image"
      - name: Container, verbgate, egress, relay, and ADC probes, verified rather than merely run
        env:
          PIFLEET_DOCKER: "1"
          LABEL: container
          # All ten PIFLEET_DOCKER-gated files, run ONCE by this step, which
          # both prints their output and grades it. This used to be two
          # separate steps — a "probes" step that ran these files for
          # their own sake, and a "guard" step below it that ran the SAME
          # files a SECOND time just to check the summary counts. That doubled
          # real Docker cost for no additional coverage: 88 tests against a
          # real daemon, several individually timed out at 60-180s (see
          # adc.test.ts's ISC-47/255/41/46 blocks), inside a 60-minute job
          # budget that also builds google-cloud-cli into the worker image
          # beforehand. It also meant the two runs could disagree — a flaky
          # probe passing in one and failing in the other — which would have
          # made either result misleading about what actually happened.
          # Capturing the one real run's output and grading THAT is strictly
          # better: same coverage, roughly half the Docker time, one truth.
          #
          # 81 -> 86 is container-launch.test.ts (the container launcher).
          # FOUR of its five tests need no daemon — they plant a recorder as
          # the launch record's argv and assert the supervisor spawned it
          # VERBATIM, which is a property of argv handling and not of Docker —
          # and they run in the fast `test` job too. The fifth needs a real
          # container: it starts one DETACHED, throws the client away, and
          # asserts `down` still removes it, which is the orphan `--rm` cannot
          # reap because `--rm` is a client-side action and the client is the
          # supervisor the kill ladder just killed. A fake there would assert
          # that a function was called, which was never in doubt.
          #
          # Listed here by the same rule that lists probe-in-network.test.ts
          # and omits relay-script.test.ts: a file with at least one
          # daemon-REQUIRING probe belongs in this job, or that probe has no
          # automated reader anywhere and becomes exactly the self-skipping
          # test this guard exists to catch. The four daemon-free ones running
          # twice is the accepted cost, and they are milliseconds.
          #
          # TOTAL_EXPECTED is 90 = 20 (image.test.ts: 15 fixed cases + 5
          # generated from the toolchain-baseline `probes` array — gcloud,
          # kubectl, helm, jq, curl) + 25 (verbgate.test.ts — up from 23 with
          # ISC-172's two container-end probes: the shim writes where the
          # collector looks, and a worker that truncates its own ledger cannot
          # erase what was already collected) + 5
          # (egress.test.ts) + 18 (adc.test.ts — up from 12 now that the
          # ISC-44/45/46 mount-shape and credential-absence blocks exist) + 8
          # (relay.test.ts: 3 bridge-denial/enumeration probes and 6 relay
          # probes, of which the TWO live-oMLX ones always skip on a runner)
          # (relay.test.ts gains a 9th with ISC-265's drift probe — see the
          # re-derivation below; it needs a daemon but NOT oMLX, so unlike the
          # two live-oMLX probes it RUNS here rather than skipping)
          # + 5 (probe-in-network.test.ts, added by ISC-260)
          # + 2 (container-env.test.ts, added by ISC-31/ISC-127)
          # + 5 (container-launch.test.ts, added by the container launcher)
          # + 2 (doctor-preflight.test.ts, added by ISC-292).
          #
          # 20 + 25 + 5 + 18 + 9 + 5 + 2 + 5 + 2 = 91. The arithmetic is written
          # out because this constant has drifted from its own prose twice, and
          # both times the prose was the half nobody re-derived.
          #
          # ISC-51's close (2026-08-23) does NOT move this number, and the
          # reason is worth writing down because it looks like it should. The
          # gateway-residual probe was INVERTED, not added to: it asserted the
          # deny-all bridge REACHED a host-namespace beacon and now asserts it
          # reaches nothing at all. A rewrite in place changes no count. It did
          # change the probe's NAME again ("...and is exactly the host-namespace
          # listeners" -> "...and is EMPTY — the bridge gateway is contained"),
          # which matters only for probes pinned by name in an EXPECTED_SKIPS
          # list; this one RUNS on the runner and is pinned in neither.
          #
          # 79 -> 81 is container-env.test.ts, which reads ISC-31 and ISC-127
          # back out of `docker inspect` on a container started from the argv
          # `renderWorker` actually produced. Both probes need ONLY a daemon
          # and the worker image — no host Google credential, no inference
          # server — so both RUN in this job and neither is pinned below. That
          # is the whole reason the file was added here rather than left to a
          # developer's machine: before it, ISC-31's `docker inspect` wording
          # and ISC-127's mount-table wording had no automated reader at all.
          #
          # 77 -> 79 comes from ISC-261 and ISC-258 adding one probe each to
          # relay.test.ts:
          #   + "the relay opens exactly its two derived ports on the bridge,
          #      and every sibling on the bridge is an expected fleet member"
          #      (ISC-261; renamed by ISC-263, which made the relay's
          #      sanctioned listener set two ports rather than one)
          #   + "a live INFERENCE round-trips through the relay, differentially
          #      against a host control" (ISC-258, skips here)
          # ISC-261 also REWROTE the gateway-residual probe in place — from
          # five guessed candidate ports to a full 65535-port enumeration — but
          # a rewrite in place changes no count. It did change the probe's
          # NAME, which matters only if a probe is pinned by name; that one is
          # not, and the three that are appear below.
          #
          # DERIVED by the hand method below, NOT by adding 2 to 77. That
          # distinction is the entire reason the method is written down:
          # incrementing a total is how a miscount survives. (It is also why
          # this constant was re-derived rather than reconciled after ISC-260
          # landed and moved it 72 -> 77 underneath this branch.)
          #
          # The ISC-260 file has a different SHAPE from every other file here,
          # deliberately. Three of its five tests are `skipIf(!PIFLEET_DOCKER)`
          # and need the daemon; the other TWO are pure argv assertions that
          # run everywhere, including in the fast `test` job — they pin
          # `--network` and the flag-injection refusal, which need no daemon
          # and should not be hostage to one. So the file contributes
          # 2 pass + 3 skip with the gate CLOSED and 5 pass + 0 skip here with
          # it OPEN. Either way it contributes 5 to the collection total, which
          # is precisely why the guard counts pass+skip as one number rather
          # than counting passes.
          #
          # ISC-262 adds nothing to this number: `model-probe.test.ts` is
          # graded by its own step in the fast `test` job, because it needs no
          # Docker and should not be hostage to the image build.
          #
          # DERIVING IT BY HAND, cheaply and exactly. Run the same file list
          # with PIFLEET_DOCKER UNSET and read the collection total off the
          # summary line. Measured 2026-08-19 on bun 1.3.11:
          #     bun test test/integration/{image,verbgate,egress,adc,relay,probe-in-network,container-env,container-launch}.test.ts
          #     -> 6 pass, 80 skip, 0 fail. Ran 86 tests across 8 files.
          #     (Re-derived 2026-08-20 for container-launch.test.ts, by running
          #     the command above rather than by adding 5 to 81 — which is the
          #     method this block insists on for exactly the reason it gives.)
          # No daemon, no image. Do this before changing the number. The 6
          # passes are the daemon-free tests in two of these files: ISC-260's
          # TWO argv assertions in probe-in-network.test.ts, and FOUR of
          # container-launch.test.ts's five, which plant a recorder as the
          # launch record's argv and need no Docker. They count toward the
          # total exactly as a skip would.
          #
          # NOTE ON RUNTIME, because ISC-261's probes are not cheap. The two
          # enumeration probes each scan all 65535 ports two or three times,
          # at roughly 32s per scan on a host that RSTs closed ports: ~70s and
          # ~73s respectively, measured. A host that DROPs instead would take
          # 65535/512 x 1s ~ 128s per scan; the per-test timeouts are 600s to
          # cover that, and the job budget is 60 minutes.
          #
          # And measured two ways with the gate OPEN, because both matter:
          #   - On a host WITH a real ADC and a real oMLX, all of them run and
          #     pass: 0 fail, 0 skip.
          #   - In THIS job, the four tests that need a REAL host ADC to mint a
          #     live token cannot run, and the TWO relay probes that need a real
          #     inference server cannot either. Same total either way, because
          #     the check treats pass+skip as one number — see probe-guard.sh's
          #     total check for why that pairing, specifically, is correct.
          #
          # A "Write a synthetic ADC credential" step used to run before this
          # one, setting PIFLEET_TEST_ADC_FILE so a file-mode mount-shape probe
          # could execute here. ISC-268 removed `adc_mode: file`, so that probe
          # and its gate are gone and NOTHING reads that variable — the step
          # went with them. It is worth noting what its removal also removes:
          # CI no longer writes a refresh-token-shaped string into the runner
          # environment at all, synthetic or otherwise.
          #
          # 86 -> 88 is doctor-preflight.test.ts (ISC-292). Its two probes ask
          # the container runtime which host paths it actually shares, which
          # is a question only a real daemon can answer — a fake would assert
          # the shape of an answer we invented. Listed by the same rule as
          # container-env.test.ts: a file with at least one daemon-REQUIRING
          # probe belongs in this job, or that probe has no automated reader
          # and becomes the self-skipping test this guard exists to catch.
          #
          # DERIVED by the hand method, NOT by adding 3 to 91. Re-measured
          # 2026-08-24 on bun 1.3.11, gate UNSET, after ISC-126's second-uid
          # probe landed in control-socket-uid.test.ts:
          #     bun test test/integration/{image,verbgate,egress,adc,relay,probe-in-network,container-env,container-launch,doctor-preflight,control-socket-uid}.test.ts
          #     -> 6 pass, 88 skip, 0 fail. Ran 94 tests across 10 files.
          # The 2026-08-23 derivation this replaces read 91 with 85 skips, so
          # the delta is three tests and three skips — the shape three added
          # Docker-gated cases must have, and why the re-derivation is evidence
          # rather than ceremony. Worth noting what the PASS count does NOT do:
          # it stays at 6, because all three added probes are Docker-gated and
          # so contribute skips here and passes on the runner.
          #
          # 94 -> 95 is full-chain.test.ts (ISC-290), and it is ONE test on
          # purpose. Every SEGMENT of `up -> supervisor -> container ->
          # dispatch -> settle -> harvest` already had a probe in this list;
          # the JOIN between them had none, and `grep -rln ISC-290 test/`
          # returned nothing at all. The criterion's own close-out says why a
          # split-up file would not do: "a criterion that says 'end to end'
          # must not be closed by three probes that each cover a segment".
          #
          # Listed here by the same rule as container-env.test.ts and
          # doctor-preflight.test.ts — a file with a daemon-REQUIRING probe
          # belongs in this job, or that probe has no automated reader
          # anywhere. What it does NOT do is RUN: it needs a live inference
          # server as well as a daemon, so on this runner it skips, and it is
          # pinned by name below. See that pin for what that does and does not
          # buy, and for what it would take to make it actually execute here.
          #
          # DERIVED by the hand method, NOT by subtracting 1 from 95.
          # Re-measured 2026-08-25 on bun 1.3.11, gate UNSET, running the exact
          # file list below:
          #     -> 6 pass, 88 skip, 0 fail. Ran 94 tests across 11 files.
          # One test fewer, one skip fewer, and the pass count unmoved at 6 —
          # the shape a single REMOVED Docker-gated case must have, and the
          # reason this number went down rather than up.
          #
          # What was removed: adc.test.ts's `file`-mode mount-shape test, with
          # `adc_mode: file` itself (ISC-268). It was FORWARD-LOOKING by its own
          # header — it hand-wrote the `-v` and inspected a shape it authored,
          # because no production path mounted an ADC file. The mode is now
          # refused by the config schema, so the contract it pinned has no
          # future implementation to be a contract FOR.
          #
          # The previous entry (95) recorded the same derivation in the other
          # direction, when full-chain.test.ts was added. Both are here because
          # this number has drifted for good reasons twice, and the guard's own
          # error message asks the next reader to confirm the file list before
          # touching it — this comment is that confirmation, written down.
          #
          # 94 -> 103 is acceptance-container.test.ts (ISC-233, ISC-277). It
          # holds the acceptance exam in a real container from the real worker
          # image — the only place in the repo that does — and every probe in
          # it is built as a host-vs-container DIFFERENTIAL rather than as a
          # pass that either side would produce. Listed here by the same rule
          # as container-env.test.ts and doctor-preflight.test.ts: a file whose
          # probes REQUIRE a daemon belongs in this job, or they have no
          # automated reader anywhere and become the self-skipping tests this
          # guard exists to catch.
          #
          # DERIVED by the hand method, NOT by adding 9 to 94. Measured
          # 2026-08-25 on bun 1.3.11, gate UNSET, running the exact file list
          # below:
          #     -> 6 pass, 97 skip, 0 fail. Ran 103 tests across 12 files.
          # Nine tests more, nine skips more, pass unmoved at 6 — the shape
          # nine added Docker-gated cases must have.
          #
          # NOT PINNED as a skip, and that is the point of listing it: all nine
          # need a daemon and the worker image and NOTHING else — no host
          # Google credential, no inference server — so all nine RUN here. One
          # of them, the writable-mount probe, can ONLY discriminate here:
          # macOS squashes bind-mounted file ownership to whatever uid the
          # container runs as, so removing the recursive widen leaves it green
          # on the maintainer's machine and red on this runner. See the probe's
          # own comment for the measurement.
          TOTAL_EXPECTED: "103"
          # The exact NAMES of the only tests allowed to skip here — not
          # merely how many. A bare count (this used to be
          # MAX_HOST_ADC_SKIPS: "2", now 4 for the reason below) cannot tell
          # "the expected host-ADC tests skipped" apart from "some UNRELATED
          # probe got converted to .skip while one of these un-skipped" — the
          # arithmetic reads identical in both cases, and only one of them is
          # fine to ship. Pinning identity, checked against the junit report
          # probe-guard.sh also produces (see JUNIT_FILE below), closes that
          # gap. That the check really does close it is not taken on faith:
          # test/integration/probe-guard.test.ts mutates each case — a renamed
          # pin, a pinned test that ran, an unpinned test that skipped while
          # the count still matched — and asserts the guard goes red for that
          # specific reason.
          #
          # All four are `test.skipIf(!HOST_ADC_PRESENT)` in adc.test.ts and
          # need a REAL, already-authenticated host Google credential to mint
          # a genuine ~1h access token from — gcloud has to actually accept
          # the thing for ISC-41/46/47/255 to prove anything, and no CI
          # runner has an operator's Google login. The synthetic file the
          # previous step writes satisfies adc.test.ts's OTHER skip condition
          # (ADC_FILE_PRESENT, the file-mode mount-shape test) but was
          # deliberately built so it cannot satisfy this one — see that
          # step's comment for why a fake file must not be dressed up as a
          # real credential here.
          #
          # ISC-268 removed that second gate along with `adc_mode: file`, so
          # ADC_FILE_PRESENT and the synthetic file it read no longer exist.
          # HOST_ADC_PRESENT is the only ADC gate left, and the four names
          # below are unchanged — they were always the mint-requiring ones.
          EXPECTED_HOST_ADC_MINT_SKIPS: |
            without the production tmpfs, gcloud crashes on the read-only config dir (ISC-255)
            with cloud_access and a token, gcloud auth print-access-token succeeds (ISC-41)
            a gcloud call still succeeds after a refresh re-injection (ISC-47)
            injecting a real minted token flips the same command from exit 1 to exit 0
          # The relay suite's TWO live-oMLX probes, pinned by name for the same
          # reason and by the same mechanism (ISC-257, and now ISC-258).
          #
          # `relay.test.ts` computes `OMLX_LIVE = PIFLEET_DOCKER=1 AND
          # OMLX_API_KEY is set AND http://localhost:8000/v1/models answers`.
          # A GitHub-hosted runner fails the third condition unconditionally —
          # there is no Apple-silicon inference server behind it and there will
          # not be — so both probes skip here always. That is NOT a defect and
          # it is NOT covered elsewhere: they are the only assertions in the
          # repo that a REAL model list, and a REAL generated completion, come
          # back through the relay. They are recorded as live-only in ISC-50's
          # and ISC-258's ISA close-outs rather than papered over here.
          #
          # ISC-258's probe is the reason that criterion is graded `[~]` and
          # not `[x]`: it is a genuinely good local test — a differential
          # against a host control, with the control re-checked after any
          # relayed failure — and no CI runner can execute a line of it. Naming
          # it here is what keeps that honest rather than invisible; an
          # unpinned skip is how five self-skipping probes went unnoticed.
          #
          # NO SECRET IS WIRED IN, for the reason spelled out on the fast job's
          # live-oMLX step: a key alone would not flip this probe, because the
          # reachability check would still fail. Adding one would put a live
          # credential on a runner and buy exactly nothing. #18 moved this key
          # out of argv and into `-e OMLX_API_KEY` precisely so it stops
          # appearing in `ps`, `docker inspect`, and command-echoing logs; the
          # cheapest way to keep that fixed is not to ship the key here at all.
          #
          # The OTHER relay probes run unconditionally and are expected to
          # PASS, so they need no skip allowance and must not be given one.
          #
          # CORRECTED 2026-08-23: this used to say the gateway-residual probe
          # "can return early on a host whose gateway serves none of the
          # candidate ports — it logs `[inconclusive]` and counts as a pass".
          # ISC-261's rewrite DELETED that path by planting beacons, and the
          # test now says so in as many words: it "can never come out
          # 'inconclusive'". A reader trusting the old text would wrongly
          # conclude the CI gateway assertion might be vacuous, which is the
          # opposite of true — it is currently the strongest evidence in the
          # repo that ISC-51's containment does NOT hold.
          EXPECTED_LIVE_OMLX_RELAY_SKIPS: |
            the REAL oMLX model list comes back through the relay, from inside the bridge
            a live INFERENCE round-trips through the relay, differentially against a host control
          # ISC-290's whole-chain test, pinned for the same reason and by the
          # same mechanism — and kept in a list of its OWN, because it is
          # pinned for a DIFFERENT reason than the two relay probes above and a
          # reader deleting one should not have to disentangle it from the
          # other. Those two need an inference server. This one needs an
          # inference server AND a Docker daemon AND a built worker image, all
          # at once, which is a strictly harder environment to assemble and is
          # the only environment in which the criterion can be re-checked.
          #
          # BE PRECISE ABOUT WHAT THIS PIN ACHIEVES, because a green tick
          # beside a skipped end-to-end test is exactly the impression this
          # repo has spent a session refusing to give. It does NOT run the
          # chain. It does NOT re-check ISC-290. What it does is make the test
          # ACCOUNTED FOR: rename it, delete it, or let it start running here
          # for a reason nobody intended, and this step goes red and says
          # which. Before this line the criterion had no test at all; after it,
          # it has a test that one machine can run and CI can only count. That
          # is a real improvement and it is not coverage, and ISA.md grades
          # ISC-290 `[~]` accordingly — on the strictness rule, exactly as
          # ISC-258's live relay probe is graded.
          #
          # WHY NEITHER EXISTING JOB CAN RUN IT, stated so the gap is
          # actionable rather than folklore. The two halves this test needs are
          # split across two jobs and neither has both: THIS job has a Docker
          # daemon, a built worker image and a pulled relay image, and no
          # inference server; PR #60's `omlx-live` job has an inference server
          # — a Cloudflare-tunnelled oMLX behind
          # `.github/scripts/omlx-shim.ts` — and no Docker daemon. The chain
          # needs both AT ONCE, so a dedicated job is the fix rather than an
          # extra step bolted onto either of these.
          #
          # ONE NON-OBVIOUS REQUIREMENT for whoever builds that job, because it
          # is invisible until the relay times out and reads as a broken fleet.
          # The shim binds `127.0.0.1`, which serves the model probes perfectly
          # — they dial from the HOST. This chain's RELAY dials from a
          # CONTAINER, through `--add-host host.docker.internal:host-gateway`,
          # which resolves to the host's BRIDGE address; a loopback-only
          # listener is unreachable from there. That job needs something
          # listening on 0.0.0.0 in front of the shim, or the relay leg cannot
          # connect no matter how healthy the tunnel is.
          #
          # Until such a job exists, this pin is the honest record.
          #
          # NO SECRET IS WIRED IN, for the same reason as the relay probes
          # above: a key alone flips nothing, because the reachability check
          # would still fail. The name below is bun's junit `name` attribute,
          # which is the BARE test name — the `describe` text lands in
          # `classname` and must NOT be included here.
          EXPECTED_ISC290_CHAIN_SKIP: |
            a worker container launched by up completes a real RPC turn end to end
        run: |
          set -eu
          # The grading itself lives in .github/scripts/probe-guard.sh, which
          # is where every measured note about HOW it grades now lives too —
          # the blackhole bug behind its `set +e` / capture-`$?` / `set -e`
          # dance, why the ANSI escapes are stripped before the summary is
          # parsed, why fail and todo are checked BEFORE the total, and why a
          # filter that matches no file is invisible without the total check.
          # It moved out of this file because a second job now needs the same
          # grading with a different file list, and two copies of subtle shell
          # is how a parsing fix lands in one and not the other.
          #
          # The THREE pin lists are kept SEPARATE above, and concatenated only
          # here, because they are pinned for unrelated reasons — the first
          # needs an operator's Google login, the second an Apple-silicon
          # inference server, the third an inference server AND a daemon AND
          # an image together — and a reader deleting one should not have to
          # disentangle it from the others. Blank lines from the block scalars
          # are ignored by the guard; that is asserted in probe-guard.test.ts
          # rather than assumed, because a miscount there would fail a CLEAN
          # run.
          JUNIT_FILE="${RUNNER_TEMP:?RUNNER_TEMP is not set by actions/runner}/pifleet-container-probes.junit.xml" \
          EXPECTED_SKIPS="$(printf '%s\n%s\n%s\n' "$EXPECTED_HOST_ADC_MINT_SKIPS" "$EXPECTED_LIVE_OMLX_RELAY_SKIPS" "$EXPECTED_ISC290_CHAIN_SKIP")" \
            .github/scripts/probe-guard.sh \
              test/integration/image.test.ts \
              test/integration/verbgate.test.ts \
              test/integration/egress.test.ts \
              test/integration/adc.test.ts \
              test/integration/relay.test.ts \
              test/integration/probe-in-network.test.ts \
              test/integration/container-env.test.ts \
              test/integration/container-launch.test.ts \
              test/integration/doctor-preflight.test.ts \
              test/integration/control-socket-uid.test.ts \
              test/integration/full-chain.test.ts \
              test/integration/acceptance-container.test.ts
          # NOT LISTED, deliberately: test/integration/relay-script.test.ts.
          # It exercises the relay script against real sockets with no Docker
          # and no gate, so it already runs in the fast `test` job on every
          # push. Adding it here would buy no coverage and cost a second run
          # inside the expensive job — the same doubling this step was
          # collapsed to avoid.

  # ISC-262 / ISC-290. The four live-inference probes have never run on a
  # runner, and `ci.yml` explained why in terms that were true when written:
  # "they need a real Apple-silicon inference server, which no GitHub-hosted
  # runner has and none ever will."
  #
  # The premise was right and the conclusion no longer follows. The runner does
  # not need to HAVE an Apple-silicon server; it needs to REACH one. The
  # maintainer's oMLX is now published through a Cloudflare tunnel, so what was
  # missing is transport, not hardware.
  #
  # WHAT THIS JOB IS AND IS NOT. It is a real witness for the model-side claims
  # — a real model on real hardware, answering a real tools-bearing probe. It is
  # NOT yet a witness for ISC-290, which names the whole chain `up` -> supervisor
  # -> container -> dispatch -> settle -> harvest. No test in this repo asserts
  # that chain (`grep -rln 'ISC-290' test/` is empty), so there is nothing here
  # for a runner to re-check yet. This job removes the ENVIRONMENTAL blocker
  # that made writing one pointless; the test itself is still owed, and ISC-290
  # stays `[~]` until it exists.
  #
  # THE SKIP LIST IS EMPTY ON PURPOSE. `probe-guard.sh` permits exactly the
  # names in EXPECTED_SKIPS and no others, so an empty list means ANY skip is a
  # failure. That is the inverse case the guard's own header anticipated: "point
  # this at a self-hosted runner with PIFLEET_OMLX=1 and the pins below must be
  # removed, at which point an empty pin list permits NO skips — so a
  # half-configured environment that asks for the live probes and gets skips
  # fails loudly instead of quietly." This job is that environment. A green
  # result here cannot mean "everything skipped".
  #
  # IT CAN GO RED FOR A REASON NO CONTRIBUTOR CAUSED. The far side is one
  # person's machine; asleep, offline, or with oMLX stopped, this job fails.
  # That is deliberate and it is the honest trade — the alternative is a job
  # that skips when the witness is absent, which is precisely the silent-green
  # failure the guard exists to prevent. The reachability check below runs
  # FIRST so that case says "the upstream is unreachable" instead of surfacing
  # as a confusing test failure. Keep this job OUT of required status checks.
  omlx-live:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets, so this would fail for something a contributor
    # cannot fix and did not break. Skipping the whole job is honest there in a
    # way that skipping individual probes inside it would not be: nothing here
    # claims to have run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: Refuse a half-configured environment
        # Both secrets or neither. One without the other is the state that
        # produces the most confusing failure: a shim pointing nowhere, or a
        # live endpoint every request 401s against.
        env:
          OMLX_HOST: ${{ secrets.OMLX_HOST }}
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
        run: |
          set -eu
          missing=""
          [ -n "${OMLX_HOST:-}" ]    || missing="$missing OMLX_HOST"
          [ -n "${OMLX_API_KEY:-}" ] || missing="$missing OMLX_API_KEY"
          if [ -n "$missing" ]; then
            echo "omlx-live: missing repo secret(s):$missing" >&2
            echo "Set them with: gh secret set <NAME> --repo <owner>/<repo>" >&2
            exit 1
          fi
      - name: Stand up a localhost that behaves like the operator's oMLX
        # Backgrounded with its log on disk. `bun ... &` inside `run:` dies with
        # the step's shell unless disowned; nohup + setsid is what keeps it up
        # for the steps that follow.
        env:
          OMLX_HOST: ${{ secrets.OMLX_HOST }}
        run: |
          set -eu
          nohup setsid bun .github/scripts/omlx-shim.ts \
            > "${RUNNER_TEMP:?}/omlx-shim.log" 2>&1 &
          echo "shim_pid=$!" >> "$GITHUB_ENV"
      - name: Confirm the upstream is actually reachable before grading anything
        # FIRST, and separate, so an asleep laptop reports as an asleep laptop.
        # 401 counts as reachable for the same reason `relay.test.ts` counts it:
        # it proves the TCP path and the HTTP server, and says only that no key
        # was sent — which this probe deliberately does not send.
        run: |
          set -eu
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     http://127.0.0.1:8000/v1/models || true)
            case "$code" in
              200|401) echo "upstream reachable after ${i}s (HTTP $code)"; exit 0 ;;
            esac
            sleep 1
          done
          echo "omlx-live: upstream never answered on 127.0.0.1:8000" >&2
          echo "--- shim log ---" >&2
          cat "${RUNNER_TEMP:?}/omlx-shim.log" >&2 || true
          exit 1
      - name: Warm the model before anything is graded on its latency
        # MEASURED, not precautionary. The first CI run with the secrets in
        # place failed exactly one probe:
        #
        #   ISC-53 live: GLM-4.5-Air-MLX-4bit -> ok=false (oMLX returned
        #   HTTP 200 with an unreadable body: The operation timed out.)
        #   ... [60299.68ms]
        #
        # 60299ms against `model-probe.ts`'s 60s budget. The far side had been
        # idle for hours, so that time is a COLD WEIGHT LOAD, not generation —
        # the same load measured at 19.4s locally on a warm-ish host, and the
        # allowlist also contains an 8-bit 35B for which it is far worse.
        #
        # WHY WARM RATHER THAN RAISE THE BUDGET. The 60s budget is production
        # behaviour: it is what `up` gives the probe before refusing to launch a
        # fleet, and an operator SHOULD hear about a model that cannot answer in
        # a minute. Raising it to accommodate CI would weaken a real gate to
        # make a test convenient. What these probes actually ask is whether a
        # model emits a NATIVE TOOL CALL — a property of its chat template, not
        # of how long its weights take to page in. Warming separates the two.
        #
        # It also matches the operator's own conditions, which is the whole
        # point of this job: their oMLX is warm because they use it, and the
        # local run that passed 18/18 was warm for that reason.
        #
        # UNGRADED ON PURPOSE. `|| true` — this step must never be what fails
        # the job. If the warmup cannot reach the server the probes below will
        # say so with a real diagnosis, and a red warmup step would just be a
        # second, worse-worded copy of that message.
        env:
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
        run: |
          set -u
          echo "warming GLM-4.5-Air-MLX-4bit (untimed, ungraded)"
          start=$(date +%s)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 \
            http://127.0.0.1:8000/v1/chat/completions \
            -H "Authorization: Bearer $OMLX_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"GLM-4.5-Air-MLX-4bit","messages":[{"role":"user","content":"hi"}],"max_tokens":1}' \
            || true)
          echo "warmup HTTP $code after $(( $(date +%s) - start ))s"
      - name: The live-oMLX probes, RUN rather than accounted for
        env:
          LABEL: live-oMLX
          PIFLEET_OMLX: "1"
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
          # NAMED, not inferred, and the suite refuses to run without it.
          # `probeModel`'s docstring records why: auto-selecting the first
          # served chat model once cold-loaded a 35B into a 24GB cap and
          # SIGABRT'd the maintainer's oMLX, taking every other tenant's warm
          # model with it. "A test suite must not pick its own GPU workload."
          #
          # WHY THIS MODEL. It has to emit NATIVE tool calls to prove anything,
          # and the candidates are not equal at that. ISA.md records
          # `Qwen3-Coder-30B-A3B-Instruct-4bit` as unreliable on exactly this
          # probe — that unreliability is what wedged the agent chain during the
          # ISC-290 diagnosis — while `GLM-4.5-Air-MLX-4bit` answered it 3/3.
          # It is also on `fleet.example.yaml`'s allowlist and measured a 19.4s
          # cold load, so it is the cheapest honest choice, not the biggest
          # available one.
          #
          # This costs the maintainer's GPU roughly half a minute per push.
          # That is the price of the witness; a cheaper model that cannot emit a
          # tool call would buy a green tick and no evidence.
          PIFLEET_OMLX_MODEL: GLM-4.5-Air-MLX-4bit
          # Same eighteen the `test` job collects. Unchanged here on purpose:
          # if this number and that one ever disagree, one of the two jobs has
          # stopped seeing the file.
          TOTAL_EXPECTED: "18"
          # EMPTY. See the job header — this is the whole point.
          EXPECTED_LIVE_OMLX_PROBE_SKIPS: ""
        run: |
          set -eu
          JUNIT_FILE="${RUNNER_TEMP:?}/pifleet-omlx-live.junit.xml" \
          EXPECTED_SKIPS="$EXPECTED_LIVE_OMLX_PROBE_SKIPS" \
            .github/scripts/probe-guard.sh test/integration/model-probe.test.ts
      - name: Shim log
        if: always()
        run: cat "${RUNNER_TEMP:?}/omlx-shim.log" || true

  # Phase C's oMLX cluster — ISC-50, 57, 258, 259 — plus ISC-290's whole chain.
  #
  # `SRD-COMPLETION.md` called provisioning this "the single highest-value
  # non-code action ... because nine criteria are already-working mechanisms
  # with no witness, and no amount of engineering closes them." This job is that
  # witness for the subset that needs a live inference server.
  #
  # WHY A SEPARATE JOB AND NOT THE `container` JOB. Three probes in `container`
  # are pinned skips today for want of an inference server, and unpinning them
  # there would make an otherwise hermetic job depend on one person's laptop
  # being awake. `container` must stay hermetic and requireable. This job is the
  # one that is allowed to be laptop-dependent, and like `omlx-live` it must
  # stay OUT of required status checks.
  #
  # It costs a second image build. That is the price of not contaminating the
  # hermetic job, and it is worth paying.
  #
  # THE SKIP LIST IS EMPTY, for the same reason it is empty in `omlx-live`:
  # `probe-guard.sh` permits exactly the names in EXPECTED_SKIPS and no others,
  # so an empty list permits none at all. A green result here cannot mean the
  # probes skipped — which is the whole failure mode this job exists to end.
  container-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: Refuse a half-configured environment
        env:
          OMLX_HOST: ${{ secrets.OMLX_HOST }}
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
        run: |
          set -eu
          missing=""
          [ -n "${OMLX_HOST:-}" ]    || missing="$missing OMLX_HOST"
          [ -n "${OMLX_API_KEY:-}" ] || missing="$missing OMLX_API_KEY"
          if [ -n "$missing" ]; then
            echo "container-live: missing repo secret(s):$missing" >&2
            exit 1
          fi
      - name: Confirm a Docker daemon is present
        run: docker info
      - name: Build the worker image
        run: bun run src/cli/index.ts image build -c fleet.example.yaml --toolchain node
      - name: Tag it for the container suites
        # Same derivation as the `container` job, and deliberately not factored
        # out: `image list --json` emits a bare array, and the one time that
        # shape was read wrong this job was red for days with no criterion
        # having executed. Fail loudly on an empty list.
        run: |
          set -eux
          tag="$(bun run src/cli/index.ts image list -c fleet.example.yaml --json \
                 | bun -e 'const d = JSON.parse(await Bun.stdin.text());
                           const t = Array.isArray(d) ? d[0]?.tag : undefined;
                           if (!t) { console.error("image list returned no images"); process.exit(1); }
                           console.log(t);')"
          docker tag "$tag" pifleet/pi-worker:verify
      - name: Pull the relay image the egress relay runs
        run: |
          set -eux
          relay_image="$(bun -e 'import { RELAY_IMAGE } from "./src/security/relay.ts";
                                 if (!RELAY_IMAGE) { console.error("RELAY_IMAGE is empty"); process.exit(1); }
                                 console.log(RELAY_IMAGE);')"
          docker pull "$relay_image"
      - name: Pull the curl image the container-vantage reachability check runs in
        # Its own step, by the same rule as the relay image above: `docker run`
        # would pull it implicitly inside the check, and a registry failure
        # would then read as "the container cannot reach the shim" — the exact
        # diagnosis that check exists to make trustworthy.
        run: docker pull curlimages/curl:8.11.1
      - name: Stand up the shim where a CONTAINER can reach it
        # OMLX_SHIM_BIND=0.0.0.0, and the difference from `omlx-live` is the
        # entire reason this job needs its own step rather than reusing that
        # one. `omlx-live`'s callers dial from the HOST, so loopback serves
        # them. These callers do not: the egress relay dials from inside a
        # container through `--add-host host.docker.internal:host-gateway`,
        # which resolves to the BRIDGE GATEWAY address. A loopback-only
        # listener is unreachable from there, and the symptom is the relay
        # reporting its upstream as down — a diagnosis that points at the fleet,
        # which is not where the problem would be.
        env:
          OMLX_HOST: ${{ secrets.OMLX_HOST }}
          OMLX_SHIM_BIND: "0.0.0.0"
        run: |
          set -eu
          nohup setsid bun .github/scripts/omlx-shim.ts \
            > "${RUNNER_TEMP:?}/omlx-shim.log" 2>&1 &
          echo "started shim pid $!"
      - name: Prove the shim is reachable from the host AND from a container
        # BOTH vantages, checked separately and before anything is graded.
        # The host check alone would pass with a loopback-only bind and leave
        # the container-side failure to surface later as a confusing relay
        # error. 401 counts as reachable — it proves the TCP path and the HTTP
        # server, and says only that no key was sent, which is deliberate here.
        run: |
          set -eu
          echo "--- from the host ---"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     http://127.0.0.1:8000/v1/models || true)
            case "$code" in 200|401) echo "host: reachable after ${i}s (HTTP $code)"; break ;; esac
            [ "$i" = 30 ] && { echo "host: never answered" >&2; cat "${RUNNER_TEMP:?}/omlx-shim.log" >&2; exit 1; }
            sleep 1
          done
          echo "--- from inside a container, via host-gateway ---"
          code=$(docker run --rm --add-host host.docker.internal:host-gateway \
                   curlimages/curl:8.11.1 \
                   -s -o /dev/null -w '%{http_code}' --max-time 20 \
                   http://host.docker.internal:8000/v1/models || true)
          case "$code" in
            200|401) echo "container: reachable (HTTP $code)" ;;
            *) echo "container: UNREACHABLE (HTTP '$code') — the relay would report its upstream as down" >&2
               cat "${RUNNER_TEMP:?}/omlx-shim.log" >&2; exit 1 ;;
          esac
      - name: Warm the model before anything is graded on its latency
        # Same reasoning as `omlx-live`: `up`'s native-tool-call probe has a 60s
        # budget that is PRODUCTION behaviour, a cold load blows through it
        # (measured 60299.68ms), and raising a real gate to suit a test is the
        # wrong trade. Ungraded — the probes below give the real diagnosis.
        env:
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
        run: |
          set -u
          start=$(date +%s)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 \
            http://127.0.0.1:8000/v1/chat/completions \
            -H "Authorization: Bearer $OMLX_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"GLM-4.5-Air-MLX-4bit","messages":[{"role":"user","content":"hi"}],"max_tokens":1}' \
            || true)
          echo "warmup HTTP $code after $(( $(date +%s) - start ))s"
      - name: The relay probes, RUN rather than pinned
        env:
          LABEL: container-live
          PIFLEET_DOCKER: "1"
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
          # GLM-4.5-Air-MLX-4bit, not the 8-bit 35B. full-chain.test.ts's own
          # header records both as 3/3 on the tools-bearing probe while
          # Qwen3-Coder-30B-A3B-Instruct-4bit leaked a tool call as raw text in
          # 1 of 3 — so either is correct and this is the cheaper one. It is
          # also the model the warmup above loads, so the two agree by
          # construction rather than by coincidence.
          PIFLEET_OMLX_MODEL: GLM-4.5-Air-MLX-4bit
          # DERIVED by the hand method, not incremented. Re-derived 2026-08-25
          # when full-chain.test.ts was re-added, on bun 1.3.11 with
          # PIFLEET_DOCKER unset and no listener on :8000:
          #     bun test test/integration/relay.test.ts \
          #              test/integration/full-chain.test.ts
          #     -> 0 pass, 10 skip, 0 fail. Ran 10 tests across 2 files.
          # The previous entry's own comment predicted "back to 10"; that
          # prediction is not the evidence, the run above is.
          TOTAL_EXPECTED: "10"
          # EMPTY. All ten must RUN. The two names pinned as skips in the
          # `container` job -- both live-oMLX relay probes -- are exactly the
          # ones this job exists to execute.
          EXPECTED_CONTAINER_LIVE_SKIPS: ""
        run: |
          set -eu
          JUNIT_FILE="${RUNNER_TEMP:?}/pifleet-container-live.junit.xml" \
          EXPECTED_SKIPS="$EXPECTED_CONTAINER_LIVE_SKIPS" \
            .github/scripts/probe-guard.sh \
              test/integration/relay.test.ts \
              test/integration/full-chain.test.ts
      # full-chain.test.ts (ISC-290) is BACK in the list above as of 2026-08-25,
      # and the history is kept because the shape of the failure is the reusable
      # part.
      #
      # It was pulled out after this job's first two runs, which found a real
      # product defect rather than a flaky probe. The chain ran -- the model
      # reached oMLX through the relay, took its turn, and emitted 17 native
      # tool calls, of which 11 failed, every one on the same thing:
      #
      #     EACCES: permission denied, open '/workspace/add.js'
      #     chmod: changing permissions of '/workspace/add.js': Operation not permitted
      #     sed: couldn't open temporary file /workspace/sedXXXXXX: Permission denied
      #
      # The worker image runs as uid 10001, the worktree was mounted from
      # `<repo>/.worktrees/<run-id>/<worker>`, and a Linux bind mount passes
      # host ownership straight through -- so the tree belonged to the runner's
      # uid and 10001 could read it and nothing else. macOS hides this
      # completely (the VM's shared filesystem squashes ownership to the
      # container user), which is why the identical run was green on Colima and
      # why it took the chain running somewhere that was not the operator's
      # laptop to surface it.
      #
      # ISC-298 fixed it in production, not here: worker checkouts moved under
      # the run dir, `prepareWorktreePermissions` widens the finished clone
      # recursively, and `buildWorkerEnv` names /workspace in safe.directory --
      # because git refuses on OWNERSHIP and ignores mode, so the widening
      # alone left every commit failing. TOTAL_EXPECTED was re-derived rather
      # than incremented back.
      #
      # If this file leaves the list again, say which of those three it is.
      - name: Shim log
        if: always()
        run: cat "${RUNNER_TEMP:?}/omlx-shim.log" || true
