          # candidate ports — it logs `[inconclusive]` and counts as a pass".
          # ISC-261's rewrite DELETED that path by planting beacons, and the
          # test now says so in as many words: it "can never come out
          # 'inconclusive'". A reader trusting the old text would wrongly
          # conclude the CI gateway assertion might be vacuous, which is the
          # opposite of true — it is currently the strongest evidence in the
          # repo that ISC-51's containment does NOT hold.
          EXPECTED_LIVE_OMLX_RELAY_SKIPS: |
            the REAL oMLX model list comes back through the relay, from inside the bridge
            a live INFERENCE round-trips through the relay, differentially against a host control
          # ISC-290's whole-chain test, pinned for the same reason and by the
          # same mechanism — and kept in a list of its OWN, because it is
          # pinned for a DIFFERENT reason than the two relay probes above and a
          # reader deleting one should not have to disentangle it from the
          # other. Those two need an inference server. This one needs an
          # inference server AND a Docker daemon AND a built worker image, all
          # at once, which is a strictly harder environment to assemble and is
          # the only environment in which the criterion can be re-checked.
          #
          # BE PRECISE ABOUT WHAT THIS PIN ACHIEVES, because a green tick
          # beside a skipped end-to-end test is exactly the impression this
          # repo has spent a session refusing to give. It does NOT run the
          # chain. It does NOT re-check ISC-290. What it does is make the test
          # ACCOUNTED FOR: rename it, delete it, or let it start running here
          # for a reason nobody intended, and this step goes red and says
          # which. Before this line the criterion had no test at all; after it,
          # it has a test that one machine can run and CI can only count.
          #
          # [UPDATED 2026-08-26.] The paragraph above ended "and ISA.md grades
          # ISC-290 `[~]` accordingly", and the long section that followed it
          # specified a job that did not yet exist — "WHY NEITHER EXISTING JOB
          # CAN RUN IT ... Until such a job exists, this pin is the honest
          # record." That job now exists: `container-live` below has a Docker
          # daemon AND a tunnelled oMLX AND the 0.0.0.0-bound shim the old note
          # warned would be needed, and it RUNS this test with an empty skip
          # list. ISA.md grades ISC-290 `[x]` on that job, not on this pin.
          #
          # THIS PIN IS STILL CORRECT, for this job only: it has Docker and no
          # inference server, so the test skips here and must stay accounted
          # for. What changed is that the skip is no longer the best evidence
          # the repo has — it is the weaker of two, and the other one runs.
          #
          # NO SECRET IS WIRED IN, for the same reason as the relay probes
          # above: a key alone flips nothing, because the reachability check
          # would still fail. The name below is bun's junit `name` attribute,
          # which is the BARE test name — the `describe` text lands in
          # `classname` and must NOT be included here.
          EXPECTED_ISC290_CHAIN_SKIP: |
            a worker container launched by up completes a real RPC turn end to end
        run: |
          set -eu
          # The grading itself lives in .github/scripts/probe-guard.sh, which
          # is where every measured note about HOW it grades now lives too —
          # the blackhole bug behind its `set +e` / capture-`$?` / `set -e`
          # dance, why the ANSI escapes are stripped before the summary is
          # parsed, why fail and todo are checked BEFORE the total, and why a
          # filter that matches no file is invisible without the total check.
          # It moved out of this file because a second job now needs the same
          # grading with a different file list, and two copies of subtle shell
          # is how a parsing fix lands in one and not the other.
          #
          # The THREE pin lists are kept SEPARATE above, and concatenated only
          # here, because they are pinned for unrelated reasons — the first
          # needs an operator's Google login, the second an Apple-silicon
          # inference server, the third an inference server AND a daemon AND
          # an image together — and a reader deleting one should not have to
          # disentangle it from the others. Blank lines from the block scalars
          # are ignored by the guard; that is asserted in probe-guard.test.ts
          # rather than assumed, because a miscount there would fail a CLEAN
          # run.
          JUNIT_FILE="${RUNNER_TEMP:?RUNNER_TEMP is not set by actions/runner}/pifleet-container-probes.junit.xml" \
          EXPECTED_SKIPS="$(printf '%s\n%s\n%s\n' "$EXPECTED_HOST_ADC_MINT_SKIPS" "$EXPECTED_LIVE_OMLX_RELAY_SKIPS" "$EXPECTED_ISC290_CHAIN_SKIP")" \
            .github/scripts/probe-guard.sh \
              test/integration/image.test.ts \
              test/integration/verbgate.test.ts \
              test/integration/egress.test.ts \
              test/integration/adc.test.ts \
              test/integration/relay.test.ts \
              test/integration/probe-in-network.test.ts \
              test/integration/container-env.test.ts \
              test/integration/container-launch.test.ts \
              test/integration/doctor-preflight.test.ts \
              test/integration/control-socket-uid.test.ts \
              test/integration/full-chain.test.ts \
              test/integration/acceptance-container.test.ts \
              test/integration/honeypot.test.ts \
              test/integration/hostile-pi.test.ts \
              test/integration/mount-preflight-remote.test.ts
          # NOT LISTED, deliberately: test/integration/relay-script.test.ts.
          # It exercises the relay script against real sockets with no Docker
          # and no gate, so it already runs in the fast `test` job on every
          # push. Adding it here would buy no coverage and cost a second run
          # inside the expensive job — the same doubling this step was
          # collapsed to avoid.

  # ISC-262 / ISC-290. The four live-inference probes have never run on a
  # runner, and `ci.yml` explained why in terms that were true when written:
  # "they need a real Apple-silicon inference server, which no GitHub-hosted
  # runner has and none ever will."
  #
  # The premise was right and the conclusion no longer follows. The runner does
  # not need to HAVE an Apple-silicon server; it needs to REACH one. The
  # maintainer's oMLX is now published through a Cloudflare tunnel, so what was
  # missing is transport, not hardware.
  #
  # WHAT THIS JOB IS AND IS NOT. It is a real witness for the model-side claims
  # — a real model on real hardware, answering a real tools-bearing probe. It is
  # NOT a witness for ISC-290, which names the whole chain `up` -> supervisor
  # -> container -> dispatch -> settle -> harvest. This job sends ONE call; the
  # chain needs a Docker daemon this runner does not have.
  #
  # [SUPERSEDED 2026-08-26.] This paragraph used to end "No test in this repo
  # asserts that chain (`grep -rln 'ISC-290' test/` is empty) ... the test
  # itself is still owed, and ISC-290 stays `[~]` until it exists." That grep
  # now returns `test/integration/full-chain.test.ts`, and the
  # `container-live` job below RUNS it rather than pinning it as a skip. The
  # sentence was true when written and became false without anything
  # re-reading it — which is the stale-grounds failure mode, in a comment
  # rather than in ISA.md. The scope limit above still holds; only the "no
  # such test exists" claim was stale.
  #
  # THE SKIP LIST IS EMPTY ON PURPOSE. `probe-guard.sh` permits exactly the
  # names in EXPECTED_SKIPS and no others, so an empty list means ANY skip is a
  # failure. That is the inverse case the guard's own header anticipated: "point
  # this at a self-hosted runner with PIFLEET_OMLX=1 and the pins below must be
  # removed, at which point an empty pin list permits NO skips — so a
  # half-configured environment that asks for the live probes and gets skips
  # fails loudly instead of quietly." This job is that environment. A green
  # result here cannot mean "everything skipped".
  #
  # IT CAN GO RED FOR A REASON NO CONTRIBUTOR CAUSED. The far side is one
  # person's machine; asleep, offline, or with oMLX stopped, this job fails.
  # That is deliberate and it is the honest trade — the alternative is a job
  # that skips when the witness is absent, which is precisely the silent-green
  # failure the guard exists to prevent. The reachability check below runs
  # FIRST so that case says "the upstream is unreachable" instead of surfacing
  # as a confusing test failure. Keep this job OUT of required status checks.
  omlx-live:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets, so this would fail for something a contributor
    # cannot fix and did not break. Skipping the whole job is honest there in a
    # way that skipping individual probes inside it would not be: nothing here
    # claims to have run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: Refuse a half-configured environment
        # Both secrets or neither. One without the other is the state that
        # produces the most confusing failure: a shim pointing nowhere, or a
        # live endpoint every request 401s against.
        env:
          OMLX_HOST: ${{ secrets.OMLX_HOST }}
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
        run: |
          set -eu
          missing=""
          [ -n "${OMLX_HOST:-}" ]    || missing="$missing OMLX_HOST"
          [ -n "${OMLX_API_KEY:-}" ] || missing="$missing OMLX_API_KEY"
          if [ -n "$missing" ]; then
            echo "omlx-live: missing repo secret(s):$missing" >&2
            echo "Set them with: gh secret set <NAME> --repo <owner>/<repo>" >&2
            exit 1
          fi
      - name: Stand up a localhost that behaves like the operator's oMLX
        # Backgrounded with its log on disk. `bun ... &` inside `run:` dies with
        # the step's shell unless disowned; nohup + setsid is what keeps it up
        # for the steps that follow.
        env:
          OMLX_HOST: ${{ secrets.OMLX_HOST }}
        run: |
          set -eu
          nohup setsid bun .github/scripts/omlx-shim.ts \
            > "${RUNNER_TEMP:?}/omlx-shim.log" 2>&1 &
          echo "shim_pid=$!" >> "$GITHUB_ENV"
      - name: Confirm the upstream is actually reachable before grading anything
        # FIRST, and separate, so an asleep laptop reports as an asleep laptop.
        # 401 counts as reachable for the same reason `relay.test.ts` counts it:
        # it proves the TCP path and the HTTP server, and says only that no key
        # was sent — which this probe deliberately does not send.
        run: |
          set -eu
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     http://127.0.0.1:8000/v1/models || true)
            case "$code" in
              200|401) echo "upstream reachable after ${i}s (HTTP $code)"; exit 0 ;;
            esac
            sleep 1
          done
          echo "omlx-live: upstream never answered on 127.0.0.1:8000" >&2
          echo "--- shim log ---" >&2
          cat "${RUNNER_TEMP:?}/omlx-shim.log" >&2 || true
          exit 1
      - name: Warm the model before anything is graded on its latency
        # MEASURED, not precautionary. The first CI run with the secrets in
        # place failed exactly one probe:
        #
        #   ISC-53 live: GLM-4.5-Air-MLX-4bit -> ok=false (oMLX returned
        #   HTTP 200 with an unreadable body: The operation timed out.)
        #   ... [60299.68ms]
        #
        # 60299ms against `model-probe.ts`'s 60s budget. The far side had been
        # idle for hours, so that time is a COLD WEIGHT LOAD, not generation —
        # the same load measured at 19.4s locally on a warm-ish host, and the
        # allowlist also contains an 8-bit 35B for which it is far worse.
        #
        # WHY WARM RATHER THAN RAISE THE BUDGET. The 60s budget is production
        # behaviour: it is what `up` gives the probe before refusing to launch a
        # fleet, and an operator SHOULD hear about a model that cannot answer in
        # a minute. Raising it to accommodate CI would weaken a real gate to
        # make a test convenient. What these probes actually ask is whether a
        # model emits a NATIVE TOOL CALL — a property of its chat template, not
        # of how long its weights take to page in. Warming separates the two.
        #
        # It also matches the operator's own conditions, which is the whole
        # point of this job: their oMLX is warm because they use it, and the
        # local run that passed 18/18 was warm for that reason.
        #
        # UNGRADED ON PURPOSE. `|| true` — this step must never be what fails
        # the job. If the warmup cannot reach the server the probes below will
        # say so with a real diagnosis, and a red warmup step would just be a
        # second, worse-worded copy of that message.
        env:
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
        run: |
          set -u
          echo "warming GLM-4.5-Air-MLX-4bit (untimed, ungraded)"
          start=$(date +%s)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 \
            http://127.0.0.1:8000/v1/chat/completions \
            -H "Authorization: Bearer $OMLX_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"GLM-4.5-Air-MLX-4bit","messages":[{"role":"user","content":"hi"}],"max_tokens":1}' \
            || true)
          echo "warmup HTTP $code after $(( $(date +%s) - start ))s"
      - name: The live-oMLX probes, RUN rather than accounted for
        env:
          LABEL: live-oMLX
          PIFLEET_OMLX: "1"
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
          # NAMED, not inferred, and the suite refuses to run without it.
          # `probeModel`'s docstring records why: auto-selecting the first
          # served chat model once cold-loaded a 35B into a 24GB cap and
          # SIGABRT'd the maintainer's oMLX, taking every other tenant's warm
          # model with it. "A test suite must not pick its own GPU workload."
          #
          # WHY THIS MODEL. It has to emit NATIVE tool calls to prove anything,
          # and the candidates are not equal at that. ISA.md records
          # `Qwen3-Coder-30B-A3B-Instruct-4bit` as unreliable on exactly this
          # probe — that unreliability is what wedged the agent chain during the
          # ISC-290 diagnosis — while `GLM-4.5-Air-MLX-4bit` answered it 3/3.
          # It is also on `fleet.example.yaml`'s allowlist and measured a 19.4s
          # cold load, so it is the cheapest honest choice, not the biggest
          # available one.
          #
          # This costs the maintainer's GPU roughly half a minute per push.
          # That is the price of the witness; a cheaper model that cannot emit a
          # tool call would buy a green tick and no evidence.
          #
          # [RE-MEASURED 2026-08-29] `GLM-4.5-Air-MLX-4bit` no longer answers
          # this probe and the 3/3 above is stale. It is a REASONING model: it
          # streams its chain of thought as `reasoning_content` deltas and, on
          # this probe's shape, never reaches `content` or `tool_calls` at all.
          # The probe sees HTTP 200 with a body it cannot parse, which is why
          # the failure reads as "unreadable body" rather than "wrong answer".
          # Measured over five consecutive runs against the same server:
          #
          #   GLM-4.5-Air-MLX-4bit               0/5   unparseable every time
          #   Qwen3-Coder-30B-A3B-Instruct-4bit  5/5   native tool_calls
          #   Qwen3.5-35B-A3B-8bit               5/5   native tool_calls
          #
          # Three CI runs failed on this before it was diagnosed, and each was
          # re-run as a suspected flake — which is what an intermittent-looking
          # deterministic failure costs when nobody reads the body.
          #
          # `Qwen3.5-35B-A3B-8bit` is chosen over the other passing candidate
          # because the `container-live` job below already names it, so the two
          # jobs share one cold load instead of paying for two. The GPU cost in
          # the paragraph above is the reason that tie-breaker matters.
          #
          # This does NOT mean the fleet cannot use reasoning models. It means
          # the probe cannot currently READ one, which is a real limitation of
          # `model-probe.ts` and is filed separately rather than papered over
          # by this line.
          PIFLEET_OMLX_MODEL: Qwen3.5-35B-A3B-8bit
          # Same eighteen the `test` job collects. Unchanged here on purpose:
          # if this number and that one ever disagree, one of the two jobs has
          # stopped seeing the file.
          TOTAL_EXPECTED: "18"
          # EMPTY. See the job header — this is the whole point.
          EXPECTED_LIVE_OMLX_PROBE_SKIPS: ""
        run: |
          set -eu
          JUNIT_FILE="${RUNNER_TEMP:?}/pifleet-omlx-live.junit.xml" \
          EXPECTED_SKIPS="$EXPECTED_LIVE_OMLX_PROBE_SKIPS" \
            .github/scripts/probe-guard.sh test/integration/model-probe.test.ts
      - name: Shim log
        if: always()
        run: cat "${RUNNER_TEMP:?}/omlx-shim.log" || true

  # Phase C's oMLX cluster — ISC-50, 57, 258, 259 — plus ISC-290's whole chain.
  #
  # `SRD-COMPLETION.md` called provisioning this "the single highest-value
  # non-code action ... because nine criteria are already-working mechanisms
  # with no witness, and no amount of engineering closes them." This job is that
  # witness for the subset that needs a live inference server.
  #
  # WHY A SEPARATE JOB AND NOT THE `container` JOB. Three probes in `container`
  # are pinned skips today for want of an inference server, and unpinning them
  # there would make an otherwise hermetic job depend on one person's laptop
  # being awake. `container` must stay hermetic and requireable. This job is the
  # one that is allowed to be laptop-dependent, and like `omlx-live` it must
  # stay OUT of required status checks.
  #
  # It costs a second image build. That is the price of not contaminating the
  # hermetic job, and it is worth paying.
  #
  # THE SKIP LIST IS EMPTY, for the same reason it is empty in `omlx-live`:
  # `probe-guard.sh` permits exactly the names in EXPECTED_SKIPS and no others,
  # so an empty list permits none at all. A green result here cannot mean the
  # probes skipped — which is the whole failure mode this job exists to end.
  container-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # ONE name, read by both the warmup step and the probe step below, so the
      # model that gets LOADED and the model that gets GRADED cannot drift
      # apart. They used to be two separate hardcoded literals, and the comment
      # on the second one claimed they agreed "by construction rather than by
      # coincidence" — but typing the same text twice is exactly coincidence.
      #
      # WHY THE 8-BIT 35B, and not the cheaper GLM-4.5-Air-MLX-4bit that the
      # `omlx-live` job pins. Those two jobs ask a model different questions.
      # `omlx-live` sends ONE call and wants one native tool call back; GLM
      # answers that 3/3, cold-loads in 19.4s, and is the cheapest honest
      # choice for it. This job runs `full-chain.test.ts`, which hands a model
      # a multi-turn agentic task and grades whether the tree actually changed.
      #
      # `full-chain.test.ts`'s own header answered that second question before
      # this job overrode it: Qwen3.5-35B-A3B-8bit "is the one that has
      # actually been measured completing THIS chain (run 3: settled `success`
      # in 13 seconds, 4 turns, 3 tool calls, 0 tool errors)", and naming a
      # model "that has only been measured on a single-call probe would be a
      # weaker claim than it looks". This job named GLM anyway, and the chain
      # then failed intermittently — twice locally on 2026-08-26, in two
      # DIFFERENT ways, which is what a model-capability problem looks like
      # from the outside:
      #
      #   - one run made its `read` call, then the server returned
      #     stopReason=error on the follow-up generation and the turn ended
      #     having edited nothing;
      #   - the next made zero tool calls at all — `tool_calls >= 1` got 0,
      #     the ISC-108 `no_tool_calls` shape.
      #
      # Against Qwen3.5-35B-A3B-8bit, on the same host, same shim, same
      # container, the chain settled `success` 7 runs out of 7, 12.3s to 15.8s
      # each, 42 assertions every time. The probe was never flaky; it was being
      # pointed at a model that could not do the task.
      PIFLEET_OMLX_MODEL: Qwen3.5-35B-A3B-8bit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: Refuse a half-configured environment
        env:
          OMLX_HOST: ${{ secrets.OMLX_HOST }}
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
        run: |
          set -eu
          missing=""
          [ -n "${OMLX_HOST:-}" ]    || missing="$missing OMLX_HOST"
          [ -n "${OMLX_API_KEY:-}" ] || missing="$missing OMLX_API_KEY"
          if [ -n "$missing" ]; then
            echo "container-live: missing repo secret(s):$missing" >&2
            exit 1
          fi
      - name: Confirm a Docker daemon is present
        run: docker info
      - name: Build the worker image
        run: bun run src/cli/index.ts image build -c fleet.example.yaml --toolchain node
      - name: Tag it for the container suites
        # Same derivation as the `container` job, and deliberately not factored
        # out: `image list --json` emits a bare array, and the one time that
        # shape was read wrong this job was red for days with no criterion
        # having executed. Fail loudly on an empty list.
        run: |
          set -eux
          tag="$(bun run src/cli/index.ts image list -c fleet.example.yaml --json \
                 | bun -e 'const d = JSON.parse(await Bun.stdin.text());
                           const t = Array.isArray(d) ? d[0]?.tag : undefined;
                           if (!t) { console.error("image list returned no images"); process.exit(1); }
                           console.log(t);')"
          docker tag "$tag" pifleet/pi-worker:verify
      - name: Pull the relay image the egress relay runs
        run: |
          set -eux
          relay_image="$(bun -e 'import { RELAY_IMAGE } from "./src/security/relay.ts";
                                 if (!RELAY_IMAGE) { console.error("RELAY_IMAGE is empty"); process.exit(1); }
                                 console.log(RELAY_IMAGE);')"
          docker pull "$relay_image"
      - name: Pull the curl image the container-vantage reachability check runs in
        # Its own step, by the same rule as the relay image above: `docker run`
        # would pull it implicitly inside the check, and a registry failure
        # would then read as "the container cannot reach the shim" — the exact
        # diagnosis that check exists to make trustworthy.
        run: docker pull curlimages/curl:8.11.1
      - name: Stand up the shim where a CONTAINER can reach it
        # OMLX_SHIM_BIND=0.0.0.0, and the difference from `omlx-live` is the
        # entire reason this job needs its own step rather than reusing that
        # one. `omlx-live`'s callers dial from the HOST, so loopback serves
        # them. These callers do not: the egress relay dials from inside a
        # container through `--add-host host.docker.internal:host-gateway`,
        # which resolves to the BRIDGE GATEWAY address. A loopback-only
        # listener is unreachable from there, and the symptom is the relay
        # reporting its upstream as down — a diagnosis that points at the fleet,
        # which is not where the problem would be.
        env:
          OMLX_HOST: ${{ secrets.OMLX_HOST }}
          OMLX_SHIM_BIND: "0.0.0.0"
        run: |
          set -eu
          nohup setsid bun .github/scripts/omlx-shim.ts \
            > "${RUNNER_TEMP:?}/omlx-shim.log" 2>&1 &
          echo "started shim pid $!"
      - name: Prove the shim is reachable from the host AND from a container
        # BOTH vantages, checked separately and before anything is graded.
        # The host check alone would pass with a loopback-only bind and leave
        # the container-side failure to surface later as a confusing relay
        # error. 401 counts as reachable — it proves the TCP path and the HTTP
        # server, and says only that no key was sent, which is deliberate here.
        run: |
          set -eu
          echo "--- from the host ---"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     http://127.0.0.1:8000/v1/models || true)
            case "$code" in 200|401) echo "host: reachable after ${i}s (HTTP $code)"; break ;; esac
            [ "$i" = 30 ] && { echo "host: never answered" >&2; cat "${RUNNER_TEMP:?}/omlx-shim.log" >&2; exit 1; }
            sleep 1
          done
          echo "--- from inside a container, via host-gateway ---"
          code=$(docker run --rm --add-host host.docker.internal:host-gateway \
                   curlimages/curl:8.11.1 \
                   -s -o /dev/null -w '%{http_code}' --max-time 20 \
                   http://host.docker.internal:8000/v1/models || true)
          case "$code" in
            200|401) echo "container: reachable (HTTP $code)" ;;
            *) echo "container: UNREACHABLE (HTTP '$code') — the relay would report its upstream as down" >&2
               cat "${RUNNER_TEMP:?}/omlx-shim.log" >&2; exit 1 ;;
          esac
      - name: Warm the model before anything is graded on its latency
        # Same reasoning as `omlx-live`: `up`'s native-tool-call probe has a 60s
        # budget that is PRODUCTION behaviour, a cold load blows through it
        # (measured 60299.68ms), and raising a real gate to suit a test is the
        # wrong trade. Ungraded — the probes below give the real diagnosis.
        #
        # STILL NOT MEASURED: how long Qwen3.5-35B-A3B-8bit takes to COLD load
        # on the operator's server. The 60299.68ms above is GLM's, and an 8-bit
        # 35B is the larger weight set. The 300s bound below is a guess with
        # headroom, not a measurement.
        #
        # AND THE FIRST READING DOES NOT SETTLE IT, which is the trap worth
        # naming. Run 33012704567 printed "warmup HTTP 200 for
        # Qwen3.5-35B-A3B-8bit after 2s" — that is a WARM hit, not a cold load.
        # The model was already resident because the same operator had just run
        # this chain seven times locally against the same server while changing
        # this pin. Reading 2s as the cold-load cost would be reading the
        # warmup's own effect as its input.
        #
        # So the number this note wants comes from a run against a server that
        # has NOT served this model recently. If that run ever prints a warmup
        # approaching 300s, replace this note with it. A run where warmup gives
        # up shows as `up` failing its 60s native-tool-call probe, not as
        # anything wrong with the chain.
        env:
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
        run: |
          set -u
          start=$(date +%s)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 \
            http://127.0.0.1:8000/v1/chat/completions \
            -H "Authorization: Bearer $OMLX_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"${PIFLEET_OMLX_MODEL:?}\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}" \
            || true)
          echo "warmup HTTP $code for $PIFLEET_OMLX_MODEL after $(( $(date +%s) - start ))s"
      - name: The relay probes, RUN rather than pinned
        env:
          LABEL: container-live
          PIFLEET_DOCKER: "1"
          OMLX_API_KEY: ${{ secrets.OMLX_API_KEY }}
          # PIFLEET_OMLX_MODEL is NOT set here. It is set once at the job level
          # and inherited by both this step and the warmup above, which is what
          # actually makes them agree — see the rationale on the job's `env`.
          # DERIVED by the hand method, not incremented. Re-derived 2026-08-26
          # when ISC-263's CONNECT-proxy probe landed in relay.test.ts, on bun
          # 1.3.11 with PIFLEET_DOCKER unset and no listener on :8000:
          #     bun test test/integration/relay.test.ts \
          #              test/integration/full-chain.test.ts
          #     -> 0 pass, 11 skip, 0 fail. Ran 11 tests across 2 files.
          # One added Docker-gated case, one more skip, pass unmoved at 0. This
          # supersedes the 2026-08-25 entry, which read 10 with 10 skips when
          # full-chain.test.ts was re-added; the delta against it is exactly
          # the one probe ISC-263 adds. The CI run that rejected 10 parsed
          # `total=11 fail=0` on its own, which is the corroboration.
          #
          # 11 -> 12: ISC-263's CLOSING probe, added the same day the proxy
          # landed. Re-derived rather than incremented, same conditions:
          #     -> 0 pass, 12 skip, 0 fail. Ran 12 tests across 2 files.
          TOTAL_EXPECTED: "12"
          # EMPTY. All twelve must RUN. The two names pinned as skips in the
          # `container` job -- both live-oMLX relay probes -- are exactly the
          # ones this job exists to execute.
          EXPECTED_CONTAINER_LIVE_SKIPS: ""
        run: |
          set -eu
          JUNIT_FILE="${RUNNER_TEMP:?}/pifleet-container-live.junit.xml" \
          EXPECTED_SKIPS="$EXPECTED_CONTAINER_LIVE_SKIPS" \
            .github/scripts/probe-guard.sh \
              test/integration/relay.test.ts \
              test/integration/full-chain.test.ts
      # full-chain.test.ts (ISC-290) is BACK in the list above as of 2026-08-25,
      # and the history is kept because the shape of the failure is the reusable
      # part.
      #
      # It was pulled out after this job's first two runs, which found a real
      # product defect rather than a flaky probe. The chain ran -- the model
      # reached oMLX through the relay, took its turn, and emitted 17 native
      # tool calls, of which 11 failed, every one on the same thing:
      #
      #     EACCES: permission denied, open '/workspace/add.js'
      #     chmod: changing permissions of '/workspace/add.js': Operation not permitted
      #     sed: couldn't open temporary file /workspace/sedXXXXXX: Permission denied
      #
      # The worker image runs as uid 10001, the worktree was mounted from
      # `<repo>/.worktrees/<run-id>/<worker>`, and a Linux bind mount passes
      # host ownership straight through -- so the tree belonged to the runner's
      # uid and 10001 could read it and nothing else. macOS hides this
      # completely (the VM's shared filesystem squashes ownership to the
      # container user), which is why the identical run was green on Colima and
      # why it took the chain running somewhere that was not the operator's
      # laptop to surface it.
      #
      # ISC-298 fixed it in production, not here: worker checkouts moved under
      # the run dir, `prepareWorktreePermissions` widens the finished clone
      # recursively, and `buildWorkerEnv` names /workspace in safe.directory --
      # because git refuses on OWNERSHIP and ignores mode, so the widening
      # alone left every commit failing. TOTAL_EXPECTED was re-derived rather
      # than incremented back.
      #
      # If this file leaves the list again, say which of those three it is.
      - name: Shim log
        if: always()
        run: cat "${RUNNER_TEMP:?}/omlx-shim.log" || true
