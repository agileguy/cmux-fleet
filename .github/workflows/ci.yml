name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test test/unit
      - name: Integration tests
        run: bun test test/integration
      - name: E2E tests
        run: bun test test/e2e

  # The container suite is a separate job because it builds the worker image
  # (google-cloud-cli, kubectl, helm — many minutes) and must not gate fast
  # feedback. It is NOT optional: without it, every Group C and Group J
  # criterion reports green having never executed, because the tests self-skip
  # when PIFLEET_DOCKER is unset.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile || bun install
      - name: Confirm a Docker daemon is present
        run: docker info
      - name: Build the worker image
        run: bun run src/cli/index.ts image build -c fleet.example.yaml --toolchain node
      - name: Tag it for the container suites
        run: |
          set -eux
          # `image list --json` emits a bare array, not {images: [...]}. Reading
          # the wrong shape threw before `set -e` could report which step failed,
          # so this job was red from the day it was added and no container
          # criterion had ever actually executed. Fail loudly on an empty list.
          tag="$(bun run src/cli/index.ts image list -c fleet.example.yaml --json \
                 | bun -e 'const d = JSON.parse(await Bun.stdin.text());
                           const t = Array.isArray(d) ? d[0]?.tag : undefined;
                           if (!t) { console.error("image list returned no images"); process.exit(1); }
                           console.log(t);')"
          docker tag "$tag" pifleet/pi-worker:verify
      - name: Write a synthetic ADC credential for the file-mode mount-shape probe
        # adc.test.ts's "file mode mounts the one ADC file, never its parent
        # directory" test is `test.skipIf(!ADC_FILE_PRESENT)`, where
        # ADC_FILE_PRESENT checks for a file at
        # `PIFLEET_TEST_ADC_FILE ?? hostAdcFile()`. Until this step existed,
        # PIFLEET_TEST_ADC_FILE was never set anywhere in CI, so the test fell
        # back to the OPERATOR's real
        # `~/.config/gcloud/application_default_credentials.json` — which no CI
        # runner has — and so it ran in NO CI job at all, despite being fully
        # capable of running here. The test only asserts a MOUNT SHAPE: it
        # inspects the resulting container's `docker inspect` mount table and
        # checks that exactly one file lands at the right destination,
        # read-only, and that the host gcloud config directory is never a
        # mount source. Docker does not care whether the bytes it mounts are a
        # usable Google credential, so any file at some path satisfies it.
        #
        # This is NOT a substitute for a real credential. The other adc.test.ts
        # skip condition, HOST_ADC_PRESENT, gates the four tests that mint a
        # genuine ~1h access token from an already-authenticated host ADC and
        # check that real `gcloud` accepts it (ISC-41/46/47/255) — those need
        # Google to actually honor the thing, which nothing synthetic can do,
        # and they correctly keep skipping in this job. See
        # EXPECTED_HOST_ADC_MINT_SKIPS on the next step for exactly which four
        # and why pinning them by name, not just by count, matters.
        #
        # The JSON below is a SYNTHETIC `authorized_user` ADC: a made-up
        # account, a made-up OAuth client, and a refresh-token-shaped string
        # that mints nothing because it corresponds to no OAuth grant Google
        # has ever issued. It is not a credential, grants nothing, and is safe
        # to print in a log.
        #
        # It is written under $RUNNER_TEMP, not under the runner's own
        # `~/.config/gcloud` — deliberately. The mount-table helper
        # adc.test.ts uses (`classifyHostGcloudExposure`, via
        # `expectNoHostGcloudConfigMount`) has an `allowAdcFile` escape hatch
        # for the ADC file itself, but every OTHER mount is still required to
        # read as clean relative to the host gcloud store. Planting the
        # synthetic file inside that same store would make every "nothing else
        # from the gcloud store is mounted" assertion in this file depend on
        # the escape hatch correctly excluding the one file we just put there
        # — a confusing thing to have to reason about, for no benefit: the test
        # only needs *a* file at *some* path, never specifically that one.
        run: |
          set -eu
          adc_file="${RUNNER_TEMP:?RUNNER_TEMP is not set by actions/runner}/pifleet-ci-synthetic-adc.json"
          printf '%s\n' '{"type":"authorized_user","account":"ci-synthetic@example.test","client_id":"ci.apps.googleusercontent.com","client_secret":"ci-not-a-real-secret","refresh_token":"1//ci-synthetic-not-a-real-token"}' > "$adc_file"
          echo "PIFLEET_TEST_ADC_FILE=$adc_file" >> "$GITHUB_ENV"
      - name: Container, verbgate, egress, and ADC probes, verified rather than merely run
        env:
          PIFLEET_DOCKER: "1"
          # All four PIFLEET_DOCKER-gated files, run ONCE by this step, which
          # both prints their output and grades it. This used to be two
          # separate steps — a "probes" step that ran these four files for
          # their own sake, and a "guard" step below it that ran the SAME four
          # files a SECOND time just to check the summary counts. That doubled
          # real Docker cost for no additional coverage: 65 tests against a
          # real daemon, several individually timed out at 60-180s (see
          # adc.test.ts's ISC-47/255/41/46 blocks), inside a 60-minute job
          # budget that also builds google-cloud-cli into the worker image
          # beforehand. It also meant the two runs could disagree — a flaky
          # probe passing in one and failing in the other — which would have
          # made either result misleading about what actually happened.
          # Capturing the one real run's output and grading THAT is strictly
          # better: same coverage, roughly half the Docker time, one truth.
          #
          # TOTAL_EXPECTED is 66 = 20 (image.test.ts: 15 fixed cases + 5
          # generated from the toolchain-baseline `probes` array — gcloud,
          # kubectl, helm, jq, curl) + 23 (verbgate.test.ts) + 5
          # (egress.test.ts) + 18 (adc.test.ts — up from 12 now that the
          # ISC-44/45/46 mount-shape and credential-absence blocks exist).
          # Measured two ways, and both matter:
          #   - On a host WITH a real ADC file, all 66 run and pass: 66 pass,
          #     0 fail, 0 skip. That is the number to trust when re-deriving
          #     this constant by hand after adding or removing a probe.
          #   - In THIS job, with no real host ADC but PIFLEET_TEST_ADC_FILE
          #     set by the step above, the file-mode mount-shape test RUNS
          #     (that is the whole point of that step) while the four tests
          #     that need a REAL host ADC to mint a live token cannot, and
          #     skip: 62 pass, 4 skip. Same total either way, because the
          #     check below treats pass+skip as one number — see that check's
          #     own comment for why that pairing, specifically, is correct.
          TOTAL_EXPECTED: "66"
          # The exact NAMES of the only tests allowed to skip here — not
          # merely how many. A bare count (this used to be
          # MAX_HOST_ADC_SKIPS: "2", now 4 for the reason below) cannot tell
          # "the expected host-ADC tests skipped" apart from "some UNRELATED
          # probe got converted to .skip while one of these un-skipped" — the
          # arithmetic reads identical in both cases, and only one of them is
          # fine to ship. Pinning identity, checked against the junit report
          # this step also produces (see JUNIT_FILE in the script below),
          # closes that gap.
          #
          # All four are `test.skipIf(!HOST_ADC_PRESENT)` in adc.test.ts and
          # need a REAL, already-authenticated host Google credential to mint
          # a genuine ~1h access token from — gcloud has to actually accept
          # the thing for ISC-41/46/47/255 to prove anything, and no CI
          # runner has an operator's Google login. The synthetic file the
          # previous step writes satisfies adc.test.ts's OTHER skip condition
          # (ADC_FILE_PRESENT, the file-mode mount-shape test) but was
          # deliberately built so it cannot satisfy this one — see that
          # step's comment for why a fake file must not be dressed up as a
          # real credential here.
          EXPECTED_HOST_ADC_MINT_SKIPS: |
            without the production tmpfs, gcloud crashes on the read-only config dir (ISC-255)
            with cloud_access and a token, gcloud auth print-access-token succeeds (ISC-41)
            a gcloud call still succeeds after a refresh re-injection (ISC-47)
            injecting a real minted token flips the same command from exit 1 to exit 0
        run: |
          set -eu
          # A skip prints an announcement and still exits 0, and the four
          # files below self-skip EVERY test whenever PIFLEET_DOCKER is
          # unset, so a green step here has never, on its own, been evidence
          # that a single probe actually ran. Arithmetic on the parsed
          # summary is what turns "the command succeeded" into "the probes
          # ran and passed" — everything below exists to make that arithmetic
          # trustworthy, which the previous version of this check was not:
          # see the fail/todo comment and the total-check comment further
          # down for the two concrete ways it used to lie.
          #
          # bun's own console reporter never prints individual skipped test
          # names (only the aggregate "N skip" summary line) — measured, not
          # assumed: a `test.skip`/`test.skipIf` case produces no per-test
          # line at all in the default reporter, unlike a failure, which
          # prints its name and stack trace. Pinning skip IDENTITY (see
          # EXPECTED_HOST_ADC_MINT_SKIPS above) therefore can't be done by
          # grepping the console text no matter how it's parsed; it needs a
          # machine-readable side artifact. `--reporter=junit` is the
          # cheapest one bun ships for that — verified it does not change
          # what runs or what the console prints (identical output with and
          # without the flag in every case tried), it only writes a second,
          # structured report alongside the console text this step still
          # captures and prints exactly as before.
          JUNIT_FILE="${RUNNER_TEMP:?RUNNER_TEMP is not set by actions/runner}/pifleet-container-probes.junit.xml"

          # THE BLACKHOLE BUG, and why this is `set +e` / capture-`$?` /
          # `set -e`, rather than the previous `set -eu` wrapping the
          # assignment directly. Under `set -eu`, `out="$(bun test ... 2>&1)"`
          # aborts the WHOLE script the instant the command substitution
          # returns non-zero: bash treats a failing command on the right-hand
          # side of an assignment as a command failure like any other, and
          # `set -e` kills the script at that statement — before `echo "$out"`
          # on the next line ever ran. Reproduced directly: a failing
          # container probe under the old script produced a RED step with
          # ZERO output. Not a truncated stack trace — nothing. No test
          # names, no `::error::` lines, not even bun's own summary, because
          # the only place that output existed was the `$out` variable the
          # aborted script never reached the `echo` for. Disabling `-e`
          # around exactly the assignment, capturing `$?` immediately after,
          # and re-enabling `-e` afterward is what lets the diagnostics
          # survive long enough to be printed.
          set +e
          out="$(bun test \
            test/integration/image.test.ts \
            test/integration/verbgate.test.ts \
            test/integration/egress.test.ts \
            test/integration/adc.test.ts \
            --reporter=junit --reporter-outfile="$JUNIT_FILE" \
            2>&1)"
          rc=$?
          set -e
          echo "$out"

          # `sed`'s `$` end-of-line anchor below matches a literal end of
          # line — but bun colors its summary lines with ANSI escape codes
          # when it believes its output is going to a color-capable
          # terminal, and a colored line ends in a reset sequence
          # (`\x1b[0m`), not bare digits. This fails SAFE today: GitHub
          # Actions runners do not set FORCE_COLOR, and bun's own isatty
          # check sees a pipe rather than a terminal when this script
          # captures its output via `$(...)`, so the anchors have always
          # matched here in practice — verified both ways: with
          # FORCE_COLOR=1 forced on, every anchored pattern below comes back
          # empty, the parsed counts default to 0, and the total check at the
          # bottom fails loudly on the resulting mismatch rather than
          # reporting a false pass. Still worth closing cheaply, since
          # "fails safe" is not the same as "parses correctly": stripping
          # ANSI CSI sequences first is one extra `sed` pass, and it makes
          # the counts actually right instead of merely non-lying, in case a
          # future change to this job (a different shell, a `script -q`
          # wrapper, anything that makes bun believe it has a tty) ever
          # turns color on by accident.
          clean="$(printf '%s\n' "$out" | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g')"
          pass="$(printf '%s\n' "$clean" | sed -n 's/^ *\([0-9][0-9]*\) pass$/\1/p' | tail -1)"
          fail="$(printf '%s\n' "$clean" | sed -n 's/^ *\([0-9][0-9]*\) fail$/\1/p' | tail -1)"
          skip="$(printf '%s\n' "$clean" | sed -n 's/^ *\([0-9][0-9]*\) skip$/\1/p' | tail -1)"
          todo="$(printf '%s\n' "$clean" | sed -n 's/^ *\([0-9][0-9]*\) todo$/\1/p' | tail -1)"
          : "${pass:=0}" "${fail:=0}" "${skip:=0}" "${todo:=0}"
          total=$(( pass + skip ))
          echo "parsed: pass=$pass fail=$fail skip=$skip todo=$todo total=$total expected=$TOTAL_EXPECTED rc=$rc"

          # `fail` and `todo` used to go unparsed entirely, and that was worse
          # than merely incomplete. `total` above is pass+skip, so a FAILING
          # test doesn't produce a "wrong" total by itself — it just makes
          # `total` come up SHORT, indistinguishable, arithmetically, from a
          # probe that was never added or one whose file silently dropped out
          # of collection (see the bun-filter note on the total check below).
          # The guard's own message used to read "expected N container
          # probes, N-3 were collected — update TOTAL_EXPECTED if probes were
          # added", which is actively wrong advice when the real cause is
          # three failures: it tells the reader to RAISE the constant to
          # match the failure, papering over exactly the regression this job
          # exists to catch. Checking fail and todo FIRST, before total is
          # ever consulted, is what makes a failure get reported as a
          # failure instead of as arithmetic drift.
          if [ "$fail" -gt 0 ]; then
            echo "::error::$fail container probe(s) FAILED — see the bun output printed above for which ones and why. This is a real test failure, not a total-count drift: do not raise TOTAL_EXPECTED to make this message go away."
            exit 1
          fi
          if [ "$todo" -gt 0 ]; then
            echo "::error::$todo container probe(s) are test.todo() — a written-but-not-implemented test. None of the four files this step runs use test.todo() today, so this firing means one was just added; treat it as a real gap, not an accepted skip, and either finish the test or remove test.todo()."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::bun test exited $rc for a reason the fail/todo checks above did not explain (both parsed as 0). Treat this as a real failure — see the full output above for what bun actually reported."
            exit 1
          fi

          # Identity, not arithmetic: confirm every name in
          # EXPECTED_HOST_ADC_MINT_SKIPS appears in the junit report as a
          # skip, by looking each one up directly, rather than trusting the
          # aggregate skip COUNT to mean the right tests produced it. A probe
          # elsewhere in these four files converting to `.skip`, paired with
          # one of these four un-skipping (for instance because a runner
          # somehow does have a host ADC), would leave `skip` at the same
          # number while meaning something completely different — exactly
          # the case a ceiling on count alone (the previous
          # MAX_HOST_ADC_SKIPS: "2") could not detect.
          missing=0
          expected_skip_count=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            expected_skip_count=$((expected_skip_count + 1))
            block="$(grep -A1 -F "name=\"$name\"" "$JUNIT_FILE" 2>/dev/null || true)"
            if [ -z "$block" ]; then
              echo "::error::expected host-ADC skip \"$name\" does not appear in the junit report at all. It may have been renamed or removed from adc.test.ts — confirm that before touching EXPECTED_HOST_ADC_MINT_SKIPS."
              missing=1
              continue
            fi
            if ! printf '%s' "$block" | grep -q '<skipped'; then
              echo "::error::expected host-ADC skip \"$name\" RAN instead of skipping. That most likely means HOST_ADC_PRESENT is somehow true on this runner (a real host ADC file, which should not exist in CI), or its skipIf condition changed."
              missing=1
            fi
          done <<< "$EXPECTED_HOST_ADC_MINT_SKIPS"
          [ "$missing" -eq 0 ] || exit 1

          if [ "$skip" -ne "$expected_skip_count" ]; then
            echo "::error::$skip container probes skipped, but exactly $expected_skip_count host-ADC probes are pinned by name above, and all $expected_skip_count were individually confirmed present and skipped. The mismatch means an UNPINNED probe skipped too — find it in the output above; a skip ceiling on count alone would have let this through as long as the count still matched."
            exit 1
          fi

          # The total check, last and on purpose: fail, todo, and the skip
          # IDENTITY have all already been confirmed clean above, so if
          # `total` still doesn't match TOTAL_EXPECTED, none of those explain
          # it — a test dropped out of COLLECTION entirely, before it could
          # even be counted as passing, failing, or skipping. The likely
          # mechanism, measured directly against this job's own invocation
          # shape: `bun test fileA fileB fileC fileD` treats each argument as
          # an independent filter, and a filter that matches ZERO test files
          # is silently dropped as long as at least one OTHER filter still
          # matches something — no warning, exit code 0. Rename or delete any
          # one of the four files this step lists and the other three still
          # run fine; the only visible symptom is a lower `total` here. That
          # is the entire reason this check exists, and it is the last thing
          # standing between "the job is green" and "a whole file's worth of
          # criteria silently stopped being tested".
          if [ "$total" -ne "$TOTAL_EXPECTED" ]; then
            echo "::error::expected $TOTAL_EXPECTED container probes (pass+skip), $total were collected. fail=0, todo=0, and the skip set matches the pinned host-ADC names exactly, so this is not a failure or an identity problem: a test dropped out of collection entirely, most likely because one of the four files above was renamed or deleted and its filter silently matched nothing (see the comment above this check). Confirm all four files still exist under these exact names before raising TOTAL_EXPECTED to match a lower number."
            exit 1
          fi

          echo "ok: $total container probes accounted for (pass=$pass skip=$skip), fail=0, todo=0, and the skip set matches all $expected_skip_count pinned host-ADC names exactly."
