  - {id: rev-arch-1, role: reviewer, pane_mode: tui, theme: gruvbox-dark,
     model: ollama-cloud/deepseek-v4-pro:0813,
     append_system_prompt_file: ./roles/review/architecture-security.md}
  # CROSS-FILE CONTEXT on qwen3.5:397b — also the seat's original model, and
  # back by the same 2026-09-04 revision. It is the LARGEST model available at
  # 397B, and "hold the whole change and its neighbourhood in mind at once" is
  # literally this angle's job. The size is the assignment, not a preference.
  #
  # ITS WINDOW IS THE SMALLEST OF THE THREE at 262,144, against 1,048,576 for
  # the other two, and that is worth knowing at this seat rather than any other:
  # this is the reviewer that reads WIDEST, and the console has been measured
  # passing 262,144's neighbourhood — rev-arch-1 auto-compacted at 152,447
