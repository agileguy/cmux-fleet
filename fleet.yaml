  # window is a defensible trade here and it is a trade, not a free choice.
  # MOVED OFF qwen3.5:397b TO gemma4:31b, owner decision 2026-09-08, after that
  # model lost this seat's lens on two consecutive review cycles (T-rv-152 and
  # T-rv-153). Both times the seat did the work and lost it at the very end:
