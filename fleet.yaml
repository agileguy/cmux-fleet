  # that a roster line does not show.
  - {id: tst-2,  role: tester,    pane_mode: tui, theme: nord}
  # ---- the `review` console's four seats ----
  #
  # A collator top-left and three reviewers, each on a DIFFERENT vendor. That
  # diversity is the console's whole product: three seats on one model is one
  # reviewer with three transcripts, and a shared training blind spot is then
