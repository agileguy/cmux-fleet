  # rather than a log tail. scripts/operations reads this and passes
  # up --attach-here. The override is on the WORKER, not the role: on
  # the role it would put every observer on tui, and tui allocates no
  # epoch, so a re-dispatched watch pass would run the same task twice.
  # obs-1 is the seat a human occupies; obs-2 takes dispatched passes.
  # Different palettes so the two attended panes are tellable apart at a
  # glance (src/config/themes.ts). Pi ships only dark/light, and light paints
  # light-mode ink onto a dark terminal — it sets no page background.
  # obs-1 ON omlx bf16, 2026-09-13 by operator. A per-seat override: the observer
  # role (and so obs-2) stays on gabe.
  - {id: obs-1,  role: observer-k8s, model: omlx/gemma-4-26b-a4b-it-bf16, pane_mode: tui, theme: catppuccin-mocha}
  - {id: obs-2,  role: observer-k8s}
