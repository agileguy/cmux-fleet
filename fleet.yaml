  # ---- The triage console (SRD-TRIAGE-CONSOLE §6.1) — four tui seats, one run ----
  #
  # WHAT THIS FILE SAYS TODAY, each claim checkable against a line it names.
  # All four seats set `model: gabe/gemma-4-26b-a4b-it` and `pane_mode: tui` on
  # their own lines: `tri-1` and `obs-t1` below, and the `obs-t2`/`obs-t3` pair
  # that closes this list. Both roles name that same model (`roles.triage.model`,
  # `roles.observer-k8s.model`) and both are `pane_mode: rpc`. So on each seat the
  # `model:` repeats its role's value and is still the line that binds, because a
  # worker's own `model:` wins over its role's (`pick` in `src/config/load.ts`),
  # while the `pane_mode:` is a real override of the role.
  #
  # The tracked `fleet.example.yaml` differs on both counts. Its `triage` and
  # `observer-k8s` roles name `gemma-4-26b-a4b-it-bf16` and are `pane_mode: rpc`,
  # and its four triage seats carry no `model:` or `pane_mode:` of their own, so
  # they take both from their roles.
  #
  # [SUPERSEDED 2026-09-13] The lines between this paragraph and HISTORY below
  # are this block's earlier account of the console, kept as history. The Phase 1
  # rename re-stamped `observer` to `observer-k8s` in them and changed nothing
  # else. These claims in them are false today: that the three observers carry
  # no `model:` override (each does); that this file's `observer-k8s` role is
  # `gpt-oss-20b-MXFP4-Q8` and the example's is `Qwen3.5-35B-A3B-8bit` (both
  # roles are the models named above); that the example's seats carry an override
  # (they carry none); that the seats are rpc (they are tui, the reversal the
  # `recycle_after_sweeps: 0` paragraph below records); and that the triage seats
  # are on `gemma-4-26b-a4b-it-bf16` (they are on gabe).
  #
  # NO `model:` OVERRIDE ON THE THREE OBSERVERS HERE, and the tracked
  # `fleet.example.yaml` DOES carry one. That difference is deliberate and it is
  # the whole of §6.11's correction: this file's `observer-k8s` role already IS
  # `gpt-oss-20b-MXFP4-Q8` by the 2026-09-03 decision, so inheriting it delivers
  # the owner's 2026-09-06 arm-3 ruling exactly. The example's `observer-k8s` is
  # `Qwen3.5-35B-A3B-8bit`, so there the override is what pins the ruling. Same
  # decision, two spellings, because the two files disagree about the role.
  # rpc, NOT tui — the actor recycles this console itself (§6.6 layer 4) and a
  # recycle is a headless `up`, which cannot recreate a pane. tui + recycle
  # tears the seats down and cannot bring them back; measured 2026-09-07.
  # BOTH seats on gemma-4-26b-a4b-it-bf16, and the second one is not scope creep.
  # oMLX holds ~24GiB of weights; gemma is 15G and gpt-oss-20b is 11G, so the two
  # cannot both stay resident. A console that alternates collator and observer
  # every sweep would then swap a 15G model in and out on every dispatch. One
  # model for both seats keeps it resident — and 26B instruction-tuned is the
  # stronger of the two for the collator as well.
  # Set per SEAT, not on the role: obs-1 on the operations console shares the
  # observer role and is deliberately left on its own model.
  # HISTORY, and it is kept because the conclusion it records was WRONG in a way
