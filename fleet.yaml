  # independently is what caught the attribution guard's fail-open the same day.
  # So DeepSeek, Zhipu and Google, and the pin stays green.
  #
  # THE RISK THIS TAKES ON, named because it is the worst failure shape in §11
  # and nothing downstream detects it. Q8 measured `gemma-4-26b-a4b-it-bf16`
  # SILENTLY TRUNCATING a tool argument: 3219 bytes of 8192 arrived, `isError`
