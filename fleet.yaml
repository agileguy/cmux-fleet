  # This is not a rename and it is not free: `tester` is a `worktree` seat with
  # `bash` and `egress_access`, where `reviewer` was `shared-ro` with neither.
  # The console goes from three bash seats to four and from one egress seat to
  # two, and that widening is the cost of the change rather than a side effect
  # of it. What buys it back is that review moves to the `review` console,
  # where three seats on three vendors read the integrated result instead of
  # one seat reading a diff — so the console that writes code no longer grades
  # its own work.
  #
  # The development console loses its in-loop review step as a consequence. A
  # defect introduced in task 3 of a phase is not read by any reviewer until
