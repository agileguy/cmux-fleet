# The triage console's service registry — `pifleet.triagetargets/v1`.
#
# SRD-TRIAGE-CONSOLE §6.2 and §7.1. Tracked, diffable, and schema-validated by
# `pifleet config validate` in the same pass as `fleet.yaml` and
# `triage/console.yaml`. It is deliberately NOT in `fleet.yaml`: that schema is
# `.strict()` over the FLEET's contract, it changes on a different clock than
# roles and models, and it is gitignored — so a service list there is untracked,
# undiffable, and undispatchable.
#
# ADDING AN ENVIRONMENT OR A SERVICE IS AN EDIT TO THIS FILE AND NOTHING ELSE.
# That is §6.2 property 1 and it is the whole reason this file exists.
#
# ------------------------------------------------------------------------------
# TWO VALUES HERE ARE PLACEHOLDERS AND MUST BE SET BEFORE THE FIRST LIVE SWEEP.
#
# `kube_context` and `namespace` are the operator's, and they are not written out
# here on purpose: §0.3 fixes this design's disclosure boundary as "no cloud
# project, no cluster endpoint, no namespace, no credential value", and this file
# is tracked in a repository that boundary applies to just as much as the SRD.
#
#   - `kube_context` is a LOGICAL token — `cni-dev`, not GKE's generated
#     `gke_<project>_<region>_<cluster>`. §6.2 property 3 and SRD-OBSERVER-001
#     §7.1 both say so: the filtered kubeconfig carries the environment token the
#     envelope carries. If your filtered copy still has the vendor's generated
#     name, rename it there — `kubectl --kubeconfig <filtered copy> config
#     rename-context <generated> cni-dev` — rather than pasting the generated
#     name here, which would put a cloud project id in a tracked file.
#   - `namespace` is DECLARED, never derived (§6.2 rule 2). Nothing infers it
#     from the service name or from a branch.
#
# `pifleet config validate` refuses this file the moment either is wrong in a way
# it can see: a `kube_context` the fleet's `cloud.kubeconfig` does not carry is
# refused at load and the console refuses to start (D11, §6.10). A `namespace`
# it cannot check is checked by the first sweep instead.
# ------------------------------------------------------------------------------

version: 1

environments:
  # The commission's own example: `mia`, `authorization` and `authentication` in
  # `cni-dev`. The key is the logical environment token, and it must match
  # `SESSION_ID_RE` because it becomes a path segment under `~/.pifleet/triage/`.
  # DISABLED, not deleted. `soleEnvironment` refuses a targets file that declares
  # anything other than exactly ONE environment — "one sweep is ONE environment,
  # and that is a limit rather than a law" (§12) — so a second environment is a
  # refusal at load rather than a second sweep. cni-dev is the one commented out
  # because its control plane is reachable only over the corporate VPN; swap the
  # comment markers to put it back.
  # cni-dev:
  #   kube_context: cni-dev

  #   # 5m, matching the default cadence — NOT something generous. §6.10 rule 1:
  #   # a six-hour window re-read every five minutes is 72x the necessary read
  #   # volume against a live logging API, and it is the obvious default a person
  #   # would write. A window wider than `cadence_s` in triage/console.yaml is
  #   # refused, naming both files.
  #   default_window: 5m

  #   # `checks` is a CLOSED enum — [rollout, logs, sink, endpoint]. No free
  #   # strings, so this file selects among the observers' procedures and cannot
  #   # extend them (§6.2 property 4). Every entry is a read against a live
  #   # control plane on every sweep, 288 times a day, so the list is the ones
  #   # that earn their place rather than all four by default.
  #   services:
  #     # `workload` is deliberately OMITTED on all three. Each of these namespaces
  #     # holds more than one deployment, and naming one here would be the host
  #     # deciding what the observer is for. The observer identifies the workload
  #     # behind the service and names what it found; a service it cannot resolve to
  #     # exactly one comes back indeterminate, which is the honest answer.
  #     - {name: alert-notifier, namespace: aodapnc-alerts-notifier-dev, checks: [rollout, logs]}
  #     - {name: prometheus,     namespace: aodapnc-prometheus-dev,      checks: [rollout, logs]}
  #     - {name: grafana,        namespace: aodapnc-grafana-dev,         checks: [rollout, logs]}

  # A second environment, and the reason it is here is that it does not need the
  # corporate VPN: `cni-dev`'s control plane is reachable only over the tunnel,
  # so a sweep scheduled while the tunnel is down costs a full child deadline per
  # service and publishes `coverage` about an environment nobody asked about.
  # This one answers from the open internet.
  do-cluster:
    kube_context: do-cluster
    default_window: 5m

    # `workload` IS OMITTED, and it was declared here for one sweep before being
    # taken back out. The reasoning for declaring it was sound and the result was
    # not: `monitoring` does hold five workloads, so naming them looked like
    # sparing the observer an ambiguous resolution.
    #
    # MEASURED ON T-sweep-33: the observer names its rows after the workload it
    # was handed, so a declared `workload` becomes the row's `name` — it reported
    # `prometheus-kps-prometheus` and `kps-grafana` where the host had declared
    # `prometheus` and `grafana`. Two of three rows then reconciled against
    # nothing, both services were recorded UNOBSERVED, and their
    # `consecutive_indeterminate` climbed while a complete and correct
    # observation sat in the artifact. `ntfy` matched only by the accident of its
    # workload sharing its service's name.
    #
    # So the cni-dev rule holds here for a second reason beyond the one it
    # states: the host declaring a workload does not only decide what the
    # observer is for, it renames the thing being reported on.
    services:
      - {name: ntfy,       namespace: ntfy,       checks: [rollout, logs]}
      - {name: prometheus, namespace: monitoring, checks: [rollout, logs]}
      - {name: grafana,    namespace: monitoring, checks: [rollout, logs]}
