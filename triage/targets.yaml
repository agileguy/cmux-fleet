# The triage console's service registry — `pifleet.triagetargets/v1`.
#
# SRD-TRIAGE-CONSOLE §6.2 and §7.1. Tracked, diffable, and schema-validated by
# `pifleet config validate` in the same pass as `fleet.yaml` and
# `triage/console.yaml`. It is deliberately NOT in `fleet.yaml`: that schema is
# `.strict()` over the FLEET's contract, it changes on a different clock than
# roles and models, and it is gitignored — so a service list there is untracked,
# undiffable, and undispatchable.
#
# ADDING AN ENVIRONMENT OR A SERVICE IS AN EDIT TO THIS FILE AND NOTHING ELSE.
# That is §6.2 property 1 and it is the whole reason this file exists.
#
# ------------------------------------------------------------------------------
# TWO VALUES HERE ARE PLACEHOLDERS AND MUST BE SET BEFORE THE FIRST LIVE SWEEP.
#
# `kube_context` and `namespace` are the operator's, and they are not written out
# here on purpose: §0.3 fixes this design's disclosure boundary as "no cloud
# project, no cluster endpoint, no namespace, no credential value", and this file
# is tracked in a repository that boundary applies to just as much as the SRD.
#
#   - `kube_context` is a LOGICAL token — `do-cluster`, not a vendor's generated
#     `gke_<project>_<region>_<cluster>`. §6.2 property 3 and SRD-OBSERVER-001
#     §7.1 both say so: the filtered kubeconfig carries the environment token the
#     envelope carries. If your filtered copy still has the vendor's generated
#     name, rename it there — `kubectl --kubeconfig <filtered copy> config
#     rename-context <generated> <env-token>` — rather than pasting the generated
#     name here, which would put a cloud project id in a tracked file.
#   - `namespace` is DECLARED, never derived (§6.2 rule 2). Nothing infers it
#     from the service name or from a branch.
#
# `pifleet config validate` refuses this file the moment either is wrong in a way
# it can see: a `kube_context` the fleet's `cloud.kubeconfig` does not carry is
# refused at load and the console refuses to start (D11, §6.10). A `namespace`
# it cannot check is checked by the first sweep instead.
# ------------------------------------------------------------------------------

version: 1

environments:
  # One environment per kind, validated by `environmentsByKind`: exactly one
  # k8s, at most one docker, at most one vm (SRD-TRIAGE-MIXED-OBSERVERS §6.1).
  # Each key is the logical environment token, and it must match
  # `SESSION_ID_RE` because it becomes a path segment under
  # `~/.pifleet/triage/`.
  #
  # This environment answers from the open internet and needs no corporate VPN.
  # An environment whose control plane is reachable only over a tunnel costs a
  # full child deadline per service on every sweep scheduled while that tunnel is
  # down, and publishes `coverage` about an environment nobody asked about — so
  # the one declared here is deliberately the one that is always reachable.
  do-cluster:
    kube_context: do-cluster
    default_window: 5m

    # `workload` IS OMITTED, and it was declared here for one sweep before being
    # taken back out. The reasoning for declaring it was sound and the result was
    # not: `monitoring` does hold five workloads, so naming them looked like
    # sparing the observer an ambiguous resolution.
    #
    # MEASURED ON T-sweep-33: the observer names its rows after the workload it
    # was handed, so a declared `workload` becomes the row's `name` — it reported
    # `prometheus-kps-prometheus` and `kps-grafana` where the host had declared
    # `prometheus` and `grafana`. Two of three rows then reconciled against
    # nothing, both services were recorded UNOBSERVED, and their
    # `consecutive_indeterminate` climbed while a complete and correct
    # observation sat in the artifact. `ntfy` matched only by the accident of its
    # workload sharing its service's name.
    #
    # So the rule holds for two reasons rather than one: a host declaring a
    # workload does not only decide what the observer is for, it renames the
    # thing being reported on.
    #
    # EXPANDED to the whole `monitoring` namespace on 2026-09-12, from three
    # services to nine. `kubectl -n monitoring get deploy,sts,ds` returns exactly
    # eight workloads and this list names all of them, plus `ntfy` in its own
    # namespace. Nine is inside `MAX_SERVICES_PER_ENVIRONMENT` (16, doubled the
    # same day).
    #
    # THAT SAME 16 ALSO CAPS THE WHOLE FILE, ACROSS ALL THREE ENVIRONMENTS: the
    # console has a single collator (`tri-1`), which writes ONE `triage.json` per
    # sweep, holding a row for every declared service — k8s, docker and vm alike,
    # not just this environment's own. Today the total is 15: nine here, five on
    # `docker-host`, one on `vm-host` — one short of the 16 cap.
    #
    # THE SIZE IS MEASURED rather than projected from the schema: across the 103
    # collations on disk that parse with rows (109 files in all), a row costs 415
    # bytes on average and 621 at worst (largest document 1 863 bytes, 3 rows,
    # T-sweep-4). Neither figure was measured on a 15-row document at the time
    # they were taken, 2026-09-12, before one collator wrote every row — the
    # honest arithmetic from those per-row figures projected 15 rows at the
    # worst observed cost at ~9.3 KB, which would EXCEED the 8 192-byte cap
    # that stood then.
    #
    # THE PROJECTION WAS RIGHT, AND IT IS NO LONGER A PROJECTION: T-sweep-148
    # (2026-09-15) ran this exact fifteen-row list through the single collator
    # and wrote 9 277 bytes to disk. The 8 192-byte cap refused it whole — every
    # service on this page recorded unobserved for that sweep — which is why
    # `TRIAGE_DOCUMENT_MAX_BYTES` is 16 384 now, not 8 192. See its docblock in
    # `triage-document.ts` for the full account and `triage-document.test.ts`
    # for the test that keeps this margin from closing silently again.
    #
    # NOT ONE ROW DECLARES A `workload`, for the reason recorded above, and the
    # live workload names are why it matters: `grafana` is `kps-grafana`,
    # `prometheus` is `prometheus-kps-prometheus`, `kube-state-metrics` is
    # `kube-prometheus-stack-kube-state-metrics`. Declaring any of those renames
    # the observer's row and costs that service its reconciliation.
    services:
      - {name: ntfy,                namespace: ntfy,       checks: [rollout, logs]}
      - {name: prometheus,          namespace: monitoring, checks: [rollout, logs]}
      - {name: grafana,             namespace: monitoring, checks: [rollout, logs]}
      - {name: alertmanager,        namespace: monitoring, checks: [rollout, logs]}
      - {name: loki,                namespace: monitoring, checks: [rollout, logs]}
      - {name: alloy,               namespace: monitoring, checks: [rollout, logs]}
      - {name: kube-state-metrics,  namespace: monitoring, checks: [rollout, logs]}
      - {name: node-exporter,       namespace: monitoring, checks: [rollout, logs]}
      - {name: prometheus-operator, namespace: monitoring, checks: [rollout, logs]}

  # The token is the enrolled `OBSERVER_DOCKER_TARGETS` token; every row's
  # `namespace` carries that same token (§6), matching what the observer's own
  # artifact echoes back. The five containers are the host's monitoring stack
  # (owner decision 4), split between `obs-td1` and `obs-td2`.
  docker-host:
    kind: docker
    target: docker
    default_window: 5m
    services:
      - {name: grafana,          namespace: docker, checks: [state, health, logs]}
      - {name: grafana-renderer, namespace: docker, checks: [state, health, logs]}
      - {name: prometheus,       namespace: docker, checks: [state, health, logs]}
      - {name: cadvisor,         namespace: docker, checks: [state, health, logs]}
      - {name: node_exporter,    namespace: docker, checks: [state, health, logs]}

  # The token is the enrolled `OBSERVER_VM_TARGETS` token; `obs-tv1` alone
  # sweeps it, no split. `[system, units, resources]` covers the whole-system
  # verbs (`uptime`, `system`, `failed`, `disk`, `memory`) plus the three named
  # units (owner decision 5, D17).
  vm-host:
    kind: vm
    target: vm
    default_window: 5m
    services:
      - {name: vm-1, namespace: vm, checks: [system, units, resources],
         units: [docker.service, ssh.service, systemd-journald.service]}
