# pifleet configuration — the SRD §6.2 worked example.
#
# Merge is `defaults ← roles ← per-worker overrides`, shallow, with three
# exceptions (SRD §6.1): arrays replace (but `pifleet-worker` is re-injected
# into skills post-merge), a `:thinking` model suffix outranks any `thinking:`
# key, and relative paths resolve against THIS FILE's directory.

version: 2
name: paisley-feature-fleet

backend:
  # kind: cmux               # cmux | tmux | headless — COMMENTED OUT ON PURPOSE
  #
  # An omitted `kind` means the CLI's own default applies, which is `headless`
  # (`up.ts`'s DEFAULT_BACKEND): a backend that needs no terminal multiplexer
  # and therefore runs on any host. Uncomment the line, or write `kind:
  # headless` explicitly, only once you have decided which of the three this
  # machine can actually present.
  #
  # WHY THIS LINE IS NOT SHIPPED LIVE, which is a compatibility fact and not a
  # preference. `backend.kind` used to be parsed and read by NOTHING — `up`
  # hardcoded its config term to null — so every operator who started from this
  # file has been running headless no matter what this line said. The field is
  # now binding, and a `fleet.yaml` derived from a shipped `kind: cmux` would
  # therefore change meaning UNDER AN OPERATOR WHO CHANGED NOTHING: on a host
  # with no cmux, `pifleet up` refuses with exit 3 and no fleet where it used
  # to give a working headless run. Shipping the default commented out is what
  # keeps a copy of this file behaving on the new build the way it behaved on
  # the old one.
  #
  # The domain is still documented above, because that is the value this line
  # always had. What it must not do is silently BIND one of the three.
  workspace: pifleet         # matched on custom_title; recorded by id in registry.json
  split: alternate           # alternate | columns | rows  (pifleet-side split sequence)
  focus_on_dispatch: false

docker:
  image_prefix: pifleet/pi-worker
  pi_version: "0.79.6"       # pinned; must match SRD §4.2's protocol contract
  network: pifleet-egress
  memory: 4g
  cpus: 2
  pids_limit: 512
  read_only_root: true

run:
  root: ~/.pifleet/runs
  repo: ~/repos/paisley
  isolation: worktree        # worktree | shared-ro | none
  branch_prefix: fleet
  # UNSET, and it must stay unset in this file. `sensitive-repo.ts` refuses to
  # start a run whose repository's `origin` is under `github.gwd.broadcom.net`,
  # `github.com/appneta/` or `github.com/dan-elliott-appneta/` while ANY worker
  # resolves to a `hosted: true` provider — before any clone or container.
  #
  # To send such a repository anyway, echo its remote back here, exactly:
  #   hosted_repo_consent: https://github.com/your-org/your-repo.git
  #
  # A URL and not a boolean, because the launch directory overrides `run.repo`:
  # one `fleet.yaml` sends whichever repository you `cd` into, so a blanket yes
  # written for a repository you thought about would cover every one you did
  # not. An echoed URL cannot transfer, and a wrong echo refuses and prints both.
  #
  # It lives in `fleet.yaml`, never here. The reason printed here used to be
  # that `fleet.yaml` was kept out of git; since 2026-09-12 it is TRACKED, so
  # that reason is gone and the real one has to carry the weight on its own. It
  # does: this file is the shared annotated reference, copied by people who do
  # not run this fleet, and a consent committed HERE is a consent nobody
  # chose — it would arrive pre-echoed in every copy, naming a repository the
  # copier never looked at. `fleet.yaml` is one machine's live definition,
  # where the echo is an act by the operator who owns that machine. Whether
  # the file is committed was never the point; who chose the consent is.
  # hosted_repo_consent: <the exact remote you mean to send>
  # RAISED to 4 for the triage console (SRD-TRIAGE-CONSOLE Q3/task 0.4). It
  # bounds each RUN, not the host, and until the triage console existed every
  # console in this fleet gave each worker its OWN run --- `agentPaneCommand`
  # builds `up --workers <one worker>` and `operations-plan.ts:310` says it in
  # as many words: "Each pane creates its own run". So this key had nothing to
  # bind on, at any value. The triage console is the first run holding MORE
  # THAN ONE seat, which is what finally gave this key something to bind on.
  #
  # THE ARGUMENT THAT RAISED IT IS LIVE AGAIN AND THE VALUE FITS EXACTLY. That
  # argument was a three-wide fan-out needing at least 3. It went stale on
  # 2026-09-11 when the console shrank to `tri-1` + `obs-t1` and the fan-out
  # became one observer wide, and it is true again as of 2026-09-13: the console
  # is FOUR seats — `tri-1` over `obs-t1`, `obs-t2` and `obs-t3`
  # (`DEFAULT_TRIAGE_WORKERS`, `src/backends/cmux/operations-plan.ts`) — and the
  # fan-out really is three observers wide. An admission budget of four is spent
  # by four, with nothing spare. Do not lower this key by reading the paragraph
  # that called it slack; that paragraph described a console that no longer runs.
  # `operations-plan.ts:1027-1035` reaches the same reading and names this
  # block as the stale one.
  #
  # DO NOT LOWER IT BY READING THAT. This bounds a RUN rather than the host,
  # and a hand-run `up` over a wider worker set is the same run — the slack is
  # the margin a widened roster spends instead of serialising.
  #
  # THE COST, which is the reason this is 4 and not higher: the bound that
  # actually matters is oMLX throughput, and both triage seats are LOCAL
  # (D1 arm 3). Four concurrent local requests from this run is the ceiling
  # this number sets --- a larger value would not make the sweep faster and
  # would let some future multi-worker run outrun the server it shares.
  max_concurrent: 4          # bounded by oMLX throughput, not pane count (§5.9)
  # The F39 RUNTIME detector (§5.9 detector 2). A worker completing this many
  # consecutive turns with ZERO tool calls is failed `no_tool_calls` rather than
  # settling "successfully" — the startup probe catches a model that cannot emit
  # native tool_calls, this catches one that could and then stopped under a long
  # context. 0 disables it, and so does `llm.require_native_tool_calls: false`,
  # which §5.9 says disables BOTH detectors.
  prose_turns_before_fail: 3
  budget:
    tokens_ceiling: 6000000  # THE ceiling — local models have no price table
    # Held up front per admission and reconciled at settle. NOTE the shape this
    # gives a run: admission refuses once spent + reserve would overrun, so the
    # last `per_task_reserve_tokens` of the ceiling is unreachable and a run
    # that uses its whole budget ends on that refusal (exit 5, "budget refused
    # admission"), not on a crossed ceiling.
    per_task_reserve_tokens: 400000
    per_task_timeout: 25m
    run_timeout: 2h
  timers:
    ui_request_timeout: 5s
    # A CEILING on the per-worker stall rungs, not the window that runs.
    # Both are narrowed against the shortest deadline_s in the task list
    # (ISC-297): with the 30m default deadline the kill rung fires at 15m,
    # not the 25m below. Left at 25m deliberately — the number is what an
    # operator may not exceed, and lowering it here would only tighten the
    # one case the derivation already handles.
    event_stall_warn: 3m
    event_stall_kill: 25m
    heartbeat_interval: 5s

llm:                         # ALWAYS self-hosted oMLX, never a provider — see §5.9
  provider: omlx
  # What a WORKER dials, from inside the egress bridge. The host must be
  # `omlx.pifleet.internal` — that is the relay's listen-side alias on that
  # bridge, so a base_url naming anything else is a listener no worker can
  # resolve. It does NOT say where the model server runs; relay_upstream does.
  #
  # Renamed from `host.docker.internal` by ISC-264: that name claimed the relay
  # was the Docker host, which stopped being true once relay_upstream could name
  # a LAN peer. The old spelling still resolves, and `up` still accepts it with a
  # deprecation warning — but this file is what a new fleet is copied FROM, so
  # shipping the old one here meant every fresh config started life emitting that
  # warning, which is exactly how a transition becomes permanent.
  #
  # Note the DIAL side below keeps `host.docker.internal` deliberately. The two
  # used to be one string and are now two different things: this line is a name
  # inside the bridge, that one is the real Docker host.
  base_url: http://omlx.pifleet.internal:8000/v1
  #
  # What the RELAY dials — host:port, explicit port required (§5.9).
  #
  # Unset (the default) means `host.docker.internal:<port from base_url>`: oMLX
  # on the Docker host, exactly as it behaved before this key existed.
  #
  # To use an oMLX on a trusted LAN peer, set it to that machine's ADDRESS. A
  # hostname is refused: the relay resolves through Docker's embedded DNS, which
  # forwards to the host resolver, and that resolver was measured NOT to answer
  # mDNS/.local names here — a name would give you a relay that starts cleanly
  # and then fails every connection.
  #
  # A value other than the Docker host ALSO requires a matching `egress.allow`
  # entry (see `egress:` below). That second edit is the security decision, and
  # it is deliberately not derivable from this one: the relay is the single hole
  # in a deny-all bridge carrying untrusted model output, and one YAML string
  # should not be enough to point it at an arbitrary machine on your LAN.
  #
  # relay_upstream: 192.168.86.49:8000
  #
  # …paired with this, at TOP LEVEL (not nested here):
  #
  #   egress:
  #     allow:
  #       - {host: 192.168.86.49, port: 8000}
  api_key_env: OMLX_API_KEY  # self-hosted server credential, injected by the supervisor
  model: gemma-4-26b-a4b-it-bf16
  thinking: medium
  models_allowlist:          # checked against GET /v1/models at `up`
    # The `triage` console's two seats, both LOCAL — see the role below.
    #
    # THIS LINE IS NOT HYGIENE, IT IS THE DIFFERENCE BETWEEN A CONFIG THAT
    # STARTS AND ONE THAT DOES NOT. The allowlist gates the ROLE, not the
    # server, and `config validate` never reads it — that command stops at
    # `resolveAllWorkers` and does not call `assertModelAllowed`. Omit this
    # entry and the example validates clean, then `up` refuses tri-1 and obs-t1
    # with ModelNotAllowedError: the operator has been told
    # the file is fine and then had it rejected, which is precisely the failure
    # `src/cli/commands/config.ts` argues against in its own words.
    # [SUPERSEDED 2026-09-09] `gemma-4-26b-a4b-it-bf16` — the model the triage
    # seats moved to, and the whole reason this comment block exists: the
    # allowlist gates the ROLE, `config validate` does not read it, so a seat
    # model changed WITHOUT its entry validates clean and is then refused at
    # `up` with ModelNotAllowedError. That is exactly what happened while making
    # this change: `config validate CLI (ISC-58) > exits 0 on the shipped
    # example` went red the moment the seats moved and this line had not. The
    # guard did its job; the note above predicted the shape precisely.
    - gemma-4-26b-a4b-it-bf16
  require_native_tool_calls: true   # `up` probes each model — see §5.9
  #
  # PER-MODEL CONTEXT WINDOWS live on a PROVIDER block, so they appear under
  # `llm.providers.<name>.context_windows` rather than out here. Without them the
  # Pi agent registers every model at its own default of 128,000 — which for a
  # while meant two 1,048,576-token models on this fleet ran at 12% of capacity,
  # auto-compacted, and in one case could not resume at all.
  #
  # The value is the PROVIDER's, not yours. Read it from the endpoint:
  #   curl -s https://<host>/api/show -H "Authorization: Bearer $KEY" \
  #     -d '{"model":"<id>"}' | jq '.model_info | to_entries[]
  #       | select(.key | endswith(".context_length"))'
  #
  #   providers:
  #     vendor:
  #       hosted: true
  #       base_url: https://vendor.example/v1
  #       api_key_env: VENDOR_API_KEY
  #       models_allowlist: [big-model]
  #       context_windows:
  #         big-model: 1048576
  #
  # A model with no entry keeps the agent's default, which is deliberate: too
  # small wastes the model, and too large makes the provider reject whole
  # requests once the history passes the real limit. Say nothing rather than
  # guess.

cloud:
  adc: true                  # inherit the launching Claude instance's Google identity
  adc_mode: token            # token (1h, default) | file (refresh token — opt-in)
  # An OBVIOUS EXAMPLE VALUE, on the same rule `egress.allow` states below:
  # a copy of this file that is never edited must fail closed rather than
  # bill or scope against someone else's project. Your real project id
  # belongs in `fleet.yaml` — not because that file is kept out of git (it has
  # been TRACKED since 2026-09-12), but because it is one machine's live
  # definition, while this is the reference copy everyone else starts from and
  # every value in it has to fail closed for a copier who never edits it.
  #
  # It must also belong to the ADC identity the fleet inherits — the two move
  # together, and a quota project from a different account is refused at the
  # first API call rather than at launch.
  quota_project: example-project-000000
  impersonate_service_account: null    # strongly preferred where one exists
  # A FILTERED kubeconfig; never the host default.
  #
  # THREE THINGS HAVE TO BE TRUE FOR kubectl TO WORK FROM A WORKER, and the
  # first two are not obvious enough to leave undocumented — each fails in a way
  # that reads as one of the others.
  #
  # 1. THE EXEC PLUGIN CANNOT BE THE VENDOR'S DEFAULT. A managed-Kubernetes
  #    kubeconfig authenticates through an exec plugin that shells out to the
  #    cloud CLI to mint a token — and that call is a CREDENTIAL-PRINTING verb,
  #    which `docker/verbgate` classifies as MUTATING on purpose. So the plugin
  #    exits non-zero and kubectl reports a plugin failure, which looks like a
  #    broken image and is actually the gate working. Point the kubeconfig's
  #    `user.exec` at the token the supervisor ALREADY injects instead:
  #
  #      command: /bin/sh
  #      args: ["-c", "printf '{\"apiVersion\":\"client.authentication.k8s.io/v1\",
  #             \"kind\":\"ExecCredential\",\"status\":{\"token\":\"%s\"}}'
  #             \"$(cat \"$CLOUDSDK_AUTH_ACCESS_TOKEN_FILE\")\""]
  #
  #    No new verb, no second credential path, and nothing to widen: that token
  #    is in the container already because `cloud_access: true` put it there.
  #    Note the copy is taken at `up` time, so editing this file needs a relaunch.
  #
  # 2. THE CONTROL PLANE MUST BE IN `egress.allow`. The bridge is deny-all and
  #    kubectl dials the master through the CONNECT proxy, so an unlisted master
  #    comes back `Forbidden` — the PROXY's 403, not the cluster's, and
  #    indistinguishable from an RBAC denial unless you know to look. List the
  #    ADDRESS, because the address is what the CONNECT names.
  #
  # 3. THE ADC IDENTITY MUST BE ONE THE CLUSTER KNOWS. The fleet inherits the
  #    HOST's application-default credential — which is not necessarily the
  #    account `gcloud auth list` shows as active. When it is the wrong one the
  #    error finally names it, and that error is the good outcome: it means the
  #    other two are already right.
  kubeconfig: null
  token_refresh: 45m

secrets:
  # The CEILING, not a grant. A worker draws against this list with its own
  # `secrets: [NAME]`, and a variable is delivered only when it is in BOTH — so
  # a role file copied in from another fleet can ASK for a variable without
  # being able to widen what this fleet permits.
  #
  # These two are what the `ticketing` role draws against. Listing a name here
  # permits it; it does not deliver it. A worker that never asks for
  # TICKET_API_TOKEN never receives it, and a worker that asks for a name absent
  # from this list is refused at launch rather than started without it.
  #
  # HOW A GRANTED NAME IS DELIVERED: as a FILE, never as its value. The value
  # is written to a 0444 file under the worker's run directory and mounted
  # read-only at /secrets, and the worker's environment gets `<NAME>_FILE`
  # holding that path. So `echo $TICKET_API_TOKEN` inside a worker prints an
  # empty line — the value is not an environment variable, which is what stops
  # `env`, `set` and a stray expansion sweeping it into a transcript. A worker
  # can still read the file deliberately; this narrows the accident, not the
  # capability.
  #
  # NEVER provider keys — see §12.4. That is enforced, not merely asked: names
  # the fleet assigns itself are reserved, so allowlisting a credential variable
  # cannot be used to route ADC into a `cloud_access: false` worker.
  env_allowlist:
    - TICKET_API_TOKEN       # the ticket system's write credential
    # NOT a secret, and it is here only because `secrets:` is the one per-worker
    # delivery channel that exists. It rides the same file path as the
    # credential — `TICKET_BASE_URL_FILE` names a file the worker `cat`s.
    #
    # `credential: false` was NOT cosmetic. The harvester sweeps every granted
    # VALUE through `findCredentialLeaks`, and a ticket worker's artifacts
    # legitimately contain the endpoint they were pointed at — so every
    # `ticket-ops.json` was refused as carrying a credential and every verdict
    # clamped. A detector that fires on every honest run carries as little
    # information as one that never fires, and additionally teaches an operator
    # to disbelieve it when it catches the real thing.
    #
    # It says ONE thing: do not use this value as a needle. Delivery is
    # unchanged — still granted, still a 0444 file, still a `<NAME>_FILE`
    # pointer, still subject to every reserved-name and allowlist check. It
    # buys no privilege; it forfeits a check. The default is `true`, and a bare
    # string above means `true`.
    - name: TICKET_BASE_URL
      credential: false
    # The ticket CLI's two SCOPING values — which workspace, which project.
    # Not credentials either, and here for the same reason `TICKET_BASE_URL` is:
    # `secrets:` is the only per-worker delivery channel there is.
    #
    # They exist because the image now carries a ticket CLI (§5.3), and a query
    # that names no project is not a narrower query — it is a WORKSPACE-WIDE
    # one. Measured 2026-09-01: an iteration summary asked without a project
    # returned 49 projects and roughly 180 people, and read as a plausible
    # answer to the question that was asked. An unscoped query does not fail; it
    # succeeds at something else, which is the failure mode worth spending a
    # delivery slot on.
    #
    # `credential: false` for the same reason as the base URL, and it matters
    # MORE here: a ticket artifact legitimately names the project it queried, so
    # sweeping the project name as a needle would refuse every honest run.
    - name: TICKET_WORKSPACE
      credential: false
    - name: TICKET_PROJECT
      credential: false
    #
    # `observer-k8s`'s own three pairs, added for the same delivery reason and
    # carrying the SAME trap one order of magnitude wider — three base URLs
    # instead of one. THE FAILURE THIS RECORDS: before the `credential: false`
    # erratum above existed, every `TICKET_BASE_URL` was granted as a bare
    # string, so it swept as a credential — and a ticket worker's artifacts
    # legitimately NAME the endpoint they queried. Every `ticket-ops.json`
    # that did its job honestly was refused as leaking a credential, every
    # refusal was recorded as a discrepancy nothing caused, and every verdict
    # clamped on evidence that was never a leak. `observer-k8s`'s reports are
    # WORSE hit if this is not learned here: a build URL or a dashboard link
    # is close to the single most useful line in a deploy report, and this
    # role carries three base URLs rather than one. So the tokens are bare
    # strings (swept, as a credential must be) and the base URLs say up front
    # that they are not needles.
    - CI_CD_TOKEN
    - CI_BUILD_TOKEN
    - GRAFANA_TOKEN
    - name: CI_CD_BASE_URL
      credential: false
    - name: CI_BUILD_BASE_URL
      credential: false
    - name: GRAFANA_BASE_URL
      credential: false

# Extra holes in the deny-all bridge. Empty by default, and every entry here is
# a decision rather than a detail.
#
# READ THIS BEFORE ADDING ONE: `egress.allow` is FLEET-WIDE. There is one
# bridge and one policy on it, so the rule below does not open the ticket system
# "for the ticketing worker" — it opens it for EVERY worker in this file,
# including the ones running untrusted model output with a bash tool. That is a
# real cost and it is not recoverable by scoping something else; the per-worker
# `egress_access` key decides who gets a route to the proxy AT ALL, not which
# destinations they may reach through it.
#
# The narrowest thing available is therefore the rule itself: one exact host,
# one port. Prefer that to a `*.` wildcard every time.
egress:
  allow:
    # An OBVIOUS EXAMPLE VALUE, and it must stay one. `tickets.example.com` is
    # reserved for documentation and resolves nowhere, so a copy of this file
    # that is never edited fails closed instead of reaching a real host.
    #
    # Your real hostname belongs in `fleet.yaml` rather than here, but READ WHY,
    # because the reason this comment gave until 2026-09-12 was wrong and is
    # corrected rather than quietly trimmed. It said `fleet.yaml` was an ignored
    # file, which implied the hostname stayed out of git altogether. It does not.
    # `fleet.yaml` is TRACKED now, by the operator decision recorded in
    # `.gitignore`, so a hostname written there is committed to this repository
    # exactly as this line is. The ignore is not buying secrecy any more and
    # nothing here should be read as if it were.
    #
    # What still separates the two files is scope and audience, and that alone
    # decides where the value goes. This file is the shared annotated reference,
    # read and copied by people who do not run this fleet, so every value in it
    # must be one that fails closed for a copier who never edits it, and an
    # internal hostname sitting here is an infrastructure disclosure to an
    # audience that no amount of later editing takes back. `fleet.yaml` is one
    # machine's live definition, read by the people already running it. A
    # hostname that is merely internal belongs in the live definition for that
    # reason. A hostname that is genuinely secret belongs in NEITHER — since
    # 2026-09-12 there is no ignored file left to hide it in, and that is a
    # repository-visibility problem to solve somewhere other than a comment.
    #
    # A placeholder like `<TICKET_HOST>` is NOT an option — `egressRuleHost`
    # validates every rule at load time with the same predicate the matcher
    # uses, and refuses that string as "not a valid hostname or IP literal".
    # That refusal is correct and deliberate: a rule the matcher can never
    # match silently denies the destination it was written for.
    - {host: tickets.example.com, port: 443}
    #
    # `observer-k8s`'s destination classes (§6.4) — one exact host, one port,
    # exactly like the rule above; a host with any port is a tunnel, not an
    # allowance. FOUR new rules, not five: the fifth class in §6.4's table is
    # Google's own API endpoints (container/logging/monitoring/auth), and
    # `egress.google_hosts` already grants `*.googleapis.com` plus the two
    # auth hosts by default (below) — a fifth entry here would be the same
    # destination twice, not a narrower one.
    - {host: ci-cd.example.com, port: 443}        # the CD pipeline API — §5.1
    - {host: ci-build.example.com, port: 443}     # image-build server, D4 — build-failure logs
    - {host: k8s-control.example.com, port: 443}  # a control-plane endpoint — kubectl, helm
    - {host: grafana.example.com, port: 443}      # dashboard + datasource checks

# Which changed files count as the EXAM rather than the answer (§6.5, §8.2a). A
# diff touching one caps the verdict at `unknown`: a worker that can rewrite the
# suite cannot be certified by it. Omit the key — as this example does — to get
# the harvester's 91 built-in globs (test trees, package.json, Makefile,
# bunfig.toml, CI definitions, lockfiles, …); set it only for a repo those miss.
#
# `patterns` EXTENDS the defaults. `replace: true` makes it the WHOLE surface
# instead. The default changed on 2026-08-25 (ISC-243) and this comment block
# described the OLD behaviour until 2026-08-30 — replacement used to be the only
# option, which made the obvious first edit, `patterns: [ci/**]`, silently drop
# `test/**` along with the other 90 defaults and switch the cap off for every
# diff that did not touch `ci/`. The over-cap replacement answers is a LOUD
# failure (a run capped to `unknown`); the under-cap it caused was a SILENT one
# (a red suite certified `success`).
#
# `patterns: []` is rejected rather than treated as "match nothing" — under
# `replace: true` an empty list would switch the cap off and look like it said
# nothing. To mean "no opinion", omit the key.
#
# A narrowed surface — which now requires `replace: true` — can quietly stop the
# cap firing on files the defaults would have caught. That is allowed; it may be
# exactly right for your repo. The harvest records what the narrowing cost in
# `harness.defaults_missed` and raises it as a discrepancy, so it cannot happen
# without anyone noticing.
#
# This value is read when `pifleet up` CREATES a run and is stored in that
# run's `run.json`. Editing it later does not change how an existing run is
# graded, and `artifacts`/`report` never read this file from the current
# directory — pass `--config` to grade against something other than what the
# run recorded.
#
# harness:
#   patterns: [ci/**, scripts/verify.sh]   # EXTENDS the 91 defaults
#   replace: false                         # true = these globs are the WHOLE surface

defaults:
  pane_mode: rpc
  toolchain: base
  cloud_access: false        # ADC is NOT granted unless a role opts in
  skills: [pifleet-worker]
  exclude_tools: []
  no_context_files: true     # repo AGENTS.md/CLAUDE.md is untrusted input

# Every name in a `skills:` list is a BUNDLE NAME, copied at `up` from
# <repo>/skills/<name>/ into the host directory mounted read-only at /skills.
# A name with no directory there is a refusal, not a silently shorter bundle —
# so this example lists only `pifleet-worker`, which is the one bundle that
# exists. `sre`, `tdd` and `diagnose` were listed below before anything read
# these lists; they are not authored yet, and inventing their content to make
# the example parse would be worse than naming the gap.
roles:
  # ---- SRE / cloud-ops: the primary role set ----
  sre:                                    # diagnoses AND remediates
    model: gemma-4-26b-a4b-it-bf16
    toolchain: base                       # gcloud/kubectl/helm are in every image
    tools: [read, write, edit, bash, grep, find, ls, submit_report]
    skills: [pifleet-worker]
    cloud_access: true                    # ADC grant — §5.8; verbs gated by §5.10
    isolation: worktree                   # manifest/IaC edits land on a branch
    append_system_prompt_file: ./roles/sre.md
  observer-k8s:                           # read-only diagnostic role — replaces
                                           # `investigator` in this same change (D2);
                                           # deploy watches AND ad-hoc service inquiries,
                                           # one skill bundle, `mode` picks the shape
    model: gemma-4-26b-a4b-it-bf16
    thinking: high                        # reconciling four disagreeing channels is the job
    toolchain: base                       # gcloud, kubectl, helm, curl, jq already in the image
    tools: [read, write, bash, grep, find, ls, submit_report]   # write is for the outbox artifact only
    skills: [pifleet-worker, observer-ops]
    cloud_access: true                    # ADC, read verbs only — §5.10 refuses every mutation
    egress_access: true                   # a ROUTE to the proxy; destinations are egress.allow
    secrets:                              # two CI dialects, one dashboard — §6.4/§6.5
      - CI_CD_TOKEN
      - CI_CD_BASE_URL
      - CI_BUILD_TOKEN
      - CI_BUILD_BASE_URL
      - GRAFANA_TOKEN
      - GRAFANA_BASE_URL
    isolation: none                       # no repository; the outbox artifact is the whole output
    pane_mode: rpc                        # tui allocates no epoch — a re-dispatched watch
                                           # pass would run twice; see the schema-level warning
                                           # this config would otherwise trip (SRD §6.2, §7.5)
    append_system_prompt_file: ./roles/observer-k8s.md
  verifier:                               # confirms a remediation actually worked
    model: gemma-4-26b-a4b-it-bf16
    toolchain: base
    tools: [read, bash, grep, find, ls, submit_report]
    skills: [pifleet-worker]
    cloud_access: true
    isolation: none
    append_system_prompt_file: ./roles/verifier.md

  # ---- code roles: available, secondary ----
  engineer:
    model: gemma-4-26b-a4b-it-bf16
    toolchain: node
    tools: [read, write, edit, bash, grep, find, ls, submit_report]
    skills: [pifleet-worker]
    append_system_prompt_file: ./roles/engineer.md
  reviewer:
    model: gemma-4-26b-a4b-it-bf16
    thinking: high
    toolchain: base
    # READ PLUS `submit_report`, and NO write, NO bash, NO edit.
    #
    # `write` WAS HELD HERE AND IS NOW WITHDRAWN — SRD-WORKER-DISPATCH-EXTENSION
    # task 7.1, Phase B. The argument that bought it is kept rather than deleted,
    # because a role with no member of the writer set looks like an oversight,
    # and this one was: the grant was missing once, cost a whole console, and was
    # added deliberately. It comes out for a reason, not by tidying.
    #
    # WHAT THE GRANT WAS FOR. `config/schema.ts` makes {write, edit, bash} the
    # writer set, and `reviewer` once held none of them. Nothing host-side writes
    # `result.json` — `harvest/outbox.ts` only reads it — so a reviewer could not
    # write its envelope at all: `outbox.kind` is `missing`, `claimed` is null,
    # every lens reports nothing, `relay.ts` answers `not_collated`, and NO
    # COLLATION IS EVER DISPATCHED, while the fan-out task settles `success` and
    # `report` shows the review green. The console could not have worked, so
    # `write` was granted, outbox-only.
    #
    # WHY THAT REASON IS RETIRED. `submit_report`
    # (`docker/pi-extensions/report-tools.ts`) writes
    # `/outbox/<task-id>/result.json` itself, and its `report` parameter writes
    # the long review into `/outbox/<task-id>/files/` beside it and appends the
    # matching `artifacts` entry. Both writes are the EXTENSION's file access,
    # not the model's tool grant, and `schema`, `task_id`, `epoch` and `worker`
    # are composed from host-written state rather than copied by the model. Every
    # byte `write` used to carry has a route that does not depend on the model
    # spelling a path or an id correctly. Phase A opened that route beside
    # `write`; this is Phase B closing the old one.
    #
    # AND CLOSING IT BUYS SOMETHING, which is why the tool is removed rather than
    # left as a harmless duplicate. `submit_report` refuses a bad `status` in
    # typebox BEFORE `execute` — in front of the model, with `isError: true`,
    # while it still has turn budget — and a `status` enum violation is exactly
    # what cost `rev-lang-1` its lens. A hand-written `result.json` meets no
    # schema until the harvester parses it on the host minutes later, and it
    # leaves no trace in the extension at all: `report-tools.ts` has to stat the
    # envelope on disk at `agent_end` precisely because a `write` past the tool
    # is invisible to it. While the role holds `write`, the refusal is advice.
    # Without it, it is the only way through.
    #
    # SIZE WAS THE GATE, AND IT IS CLEARED FOR THIS ROLE ONLY. Passing a review
    # as a tool ARGUMENT is only safe if the model carries it intact: SRD §11
    # measured all three reviewer models passing 16 384 bytes byte-exact, and a
    # census of 56 harvested reviewer envelopes puts the real maximum at 13 965 —
    # inside, but by 15% rather than by half, which is the margin and not a
    # comfort. `observer-k8s` is NOT cleared on the same evidence (n = 1) and
    # keeps its `write`.
    #
    # NO `bash`, and this refusal is untouched by any of the above. §12.1's
    # argument was never about writing: a shell is what turns a "read-only"
    # reviewer into a worker that can `cd /`, reach a socket, or `git push`.
    # §6.8 turns it the other way round, too — it is the ABSENCE of bash here
    # that makes withdrawing `write` mean anything, because a role holding a
    # shell can `cat > /outbox/...` and the removal would take a tool without
    # taking a capability.
    #
    # NO `edit`, deliberately and for its own reason. `edit` changes files that
    # already exist, and the only files a reviewer can see besides its own outbox
    # are the operator's checkout at /workspace — mounted `:ro`, so the grant
    # would buy nothing it could use and would widen the writer set for no
    # capability.
    # AND THE WITHDRAWAL IS NOW AN INVARIANT, NOT A VALUE. Everything above
    # argues why this role holds no writer; `read_only: true` is what makes the
    # argument enforceable. `effectiveToolGrant` resolves an OMITTED `tools:` to
    # every Pi builtin, so deleting the line below would silently hand back
    # `write`, `edit` and `bash` at once and reverse task 7.1 by an edit that
    # looks like tidying. With this flag set, that deletion is a parse error
    # naming the three tools it would have restored, and so is adding any one of
    # them back by hand. The flag has no runtime effect of its own -- nothing
    # reads it at `up` -- which is the point: it is a declaration of intent whose
    # only job is to arm ISC-59's check in `config/schema.ts`.
    read_only: true
    tools: [read, grep, find, ls, submit_report]
    skills: [pifleet-worker]
    append_system_prompt_file: ./roles/reviewer.md
    isolation: shared-ro
  tester:
    model: gemma-4-26b-a4b-it-bf16
    toolchain: python
    tools: [read, bash, grep, find, ls, submit_report]
    skills: [pifleet-worker]
    append_system_prompt_file: ./roles/tester.md

  # ---- ticketing: holds a write credential for a system OUTSIDE the fleet ----
  ticketing:
    model: gemma-4-26b-a4b-it-bf16
    # `base` is deliberate and sufficient. The worker talks to the ticket API as
    # plain REST with `curl` and parses with `jq`, both of which are in every
    # image (`docker/Dockerfile:25`). There is NO vendor CLI and there is not
    # going to be one: baking one would put a vendor's name into the image hash
    # of a public repository and pin the fleet to that CLI's release cadence.
    toolchain: base
    # `write` for the outbox artifact, `bash` for curl/jq. Note what this
    # combination actually is — a shell and a live write credential for a system
    # of record — and see `roles/ticketing.md` on why scope discipline, not the
    # container boundary, is the control that binds here.
    tools: [read, write, edit, bash, grep, find, ls, submit_report]
    skills: [pifleet-worker, ticket-ops]
    # NO Google identity. This role has no reason to hold one, and `egress`
    # below is a separate decision from `cloud_access` precisely so that
    # "reach one external host" does not have to be bought with ADC.
    cloud_access: false
    # Nothing it does lands in the repo, so it gets no worktree: its whole
    # output is the artifact in its outbox.
    isolation: none
    append_system_prompt_file: ./roles/ticketing.md
    # A REQUEST drawn against `secrets.env_allowlist`, never a grant. A name the
    # fleet allowlist does not carry is refused at launch, loudly, rather than
    # quietly omitted — a credential that fails to arrive otherwise surfaces as
    # a timeout deep inside an HTTP call. So is a name that is set nowhere in
    # the operator's environment, and so is a file that cannot be written.
    #
    # This worker therefore receives TICKET_API_TOKEN_FILE, TICKET_BASE_URL_FILE,
    # TICKET_WORKSPACE_FILE and TICKET_PROJECT_FILE, each naming a path under
    # /secrets. It receives none of the VALUES in its environment.
    # `skills/ticket-ops/SKILL.md` documents the `.env` form that turns the
    # first of those files into the CLI's configuration without the value
    # passing through a shell variable — the same construction the `curl
    # --config` block used before the image carried a CLI, for the same reason.
    #
    # All four are requested TOGETHER because three of them are useless alone: a
    # credential with no endpoint cannot dial, and an endpoint with no project
    # answers a workspace-wide question instead of the one asked.
    secrets: [TICKET_API_TOKEN, TICKET_BASE_URL, TICKET_WORKSPACE, TICKET_PROJECT]
    # Sets HTTPS_PROXY so this worker has a ROUTE to the bridge proxy. It grants
    # no destination by itself — `egress.allow` above decides those, fleet-wide —
    # and it grants no Google identity. That separation is the whole point of the
    # key: reaching one external host does not have to be bought with ADC.
    egress_access: true

  # ---- triage: the console with no keyboard ----
  triage:
    # LOCAL 20b, BY OWNER DECISION 2026-09-06 — SRD-TRIAGE-CONSOLE §0.2 arm 3,
    # recorded as D1. The commission that opened that document asked for
    # `ollama-cloud/gpt-oss:120b` on every one of this console's seats, which
    # would have reversed the 2026-09-03 decision that put `observer` on this
    # model. It was refused, and this line is the refusal.
    #
    # WHAT THE ARGUMENT TURNED ON, since a reader who finds only the outcome
    # will read this as a performance choice: it is not about a model name, it
    # is about whether an observer's context may leave the machine. This role
    # reconciles the observer's report, and an observer's report carries
    # namespaces, workload names, pod names, restart counts, log excerpts and
    # cluster endpoints from a LIVE environment — 96 sweeps a day at the cadence
    # the tracked `triage/console.yaml` ships (`cadence_s: 900`); 288 at the
    # schema default of 300, which is the number this file used to quote — so it
    # is the most sensitive context this fleet produces and the one least worth
    # sending to a third party. There is no ceiling, timeout or scope that
    # reduces a transcript after it has been sent.
    #
    # THE COST, stated rather than waved at (D1). Reconciliation is the one task
    # here that most wants a bigger model, and a 20B will be worse at it than a
    # 120B. The failure will not look like a model failure — it will look like a
    # noisy console. If that is what a day-long run shows, THIS is the first
    # decision to re-examine, not the last.
    #
    # [SUPERSEDED 2026-09-09] `gemma-4-26b-a4b-it-bf16`, and the paragraph above
    # is kept because its reasoning still holds — this is a change of model, not
    # a change of mind about size. Two things forced it:
    #
    #   1. The operator's own `fleet.yaml` moved every oMLX worker to bf16 on
    #      2026-09-07, so the live triage seats have been on gemma since, and
    #      this file was describing a fleet that no longer existed (ISC-1110).
    #   2. SRD §11 Q8's tool-argument ceilings were MEASURED on this model. The
    #      caps this repository ships for that wire came from it, and naming a
    #      different one here made those bounds unattributable.
    #
    # It is also the model CI now probes, and that is not a coincidence — see
    # `ci.yml`'s `PIFLEET_OMLX_MODEL` and ISC-1116: a CI job that cold-loads a
    # model the fleet is NOT running adds a second resident model to a capped
    # oMLX and starves the live seats. This line is the anchor that guard reads.
    model: gemma-4-26b-a4b-it-bf16
    thinking: high                        # collating one observer's report into one document IS the job
    toolchain: base                       # it reads artifacts; there is nothing to build
    # `reviewer`'s grant above, copied deliberately — the same set the `review`
    # console's `collator` carries in the operator's own `fleet.yaml`, which is
    # where the shape was argued. Note what is NOT here.
    #
    # `write` WAS HELD HERE AND IS NOW WITHDRAWN — SRD-WORKER-DISPATCH-EXTENSION
    # task 7.3, Phase B, one console behind `reviewer`'s 7.1. The argument that
    # bought it is kept rather than deleted, for 7.1's reason: a role with no
    # member of the writer set looks like an oversight, and this one is not.
    #
    # WHAT THE GRANT WAS FOR. `write` was the outbox artifact and nothing else:
    # /outbox is a worker-scoped bind mount, only the harvester reads it, and it
    # is already the untrusted-content boundary. `submit_report` now writes
    # `/outbox/<task-id>/result.json` itself and its `report` parameter writes
    # the collation into `files/` beside it, so every byte `write` carried has a
    # route that does not depend on the model spelling a path correctly.
    #
    # WHY THIS ROLE WAITED, AND WHAT CLEARED IT. §11's Q8 measured a local model
    # delivering 39% of an 8 KB tool argument with `isError` false and a GREEN
    # epoch — the worst shape in the document, because nothing downstream can
    # detect it. Passing the collation as an ARGUMENT is only safe if the model
    # carries it intact, so this role kept `write` while `reviewer` lost it. The
    # gate is now closed from the other side: `TRIAGE_DOCUMENT_MAX_BYTES` bounds
    # the document at 4 096 bytes and REFUSES above it, and
    # `MAX_SERVICES_PER_ENVIRONMENT` and `TRIAGE_NOTE_MAX_BYTES` came down to 8
    # and 1 024 so that bound is reachable rather than nominal. An observed
    # maximum is not a bound; that cap is.
    #
    # NO `bash`, and here that is the load-bearing omission rather than an
    # inherited habit. This role's entire output is a request for something ELSE
    # to act on — a fan-out to the observer seat, and a notification that wakes
    # a human. A shell is exactly what turns a request-WRITING worker into a
    # DISPATCHING one, and an agent may not dispatch. It is also what makes the
    # withdrawal above mean anything: §6.8 is explicit that a role holding a
    # shell can `cat > /outbox/...`, so removing `write` there would take a tool
    # without taking a capability.
    #
    # NO `edit`, for `reviewer`'s reason: nothing it can see is writable except
    # its own outbox, so the grant would widen the writer set and buy nothing.
    #
    # AND THEN IT WAS PUT BACK, 2026-09-09, the same day — because task 7.3 was
    # WRONG about this role and the console proved it within three sweeps.
    #
    # THIS ROLE WRITES TWO FILES AND `submit_report` CARRIES ONE. The envelope
    # is `result.json` and the tool writes it. The FAN-OUT is
    # `/outbox/<task-id>/dispatch-request.json` — this role's actual product,
    # the thing the host reads to dispatch the observers, instructed at
    # `roles/triage.md:129` — and `submit_report` has no route for it whatever.
    # Narrowed, `tri-1` composed a correct fan-out naming obs-t1 and three
    # services, called `write`, and got `Tool write not found`. Three times, on
    # one sweep. The console dispatched nothing for three consecutive sweeps.
    #
    # AND THE FAILURE WAS NOT EVEN LOUD. Sweeps 5 and 6 settled
    # `status: success` carrying the summary "Dispatched sweep to obs-t1", with
    # no request file written anywhere. Only sweep 7 reported `failed` and named
    # the tool. A narrowing whose observable is a green sweep that did nothing
    # is worse than the grant it removed.
    #
    # WHAT §6.8 GOT RIGHT AND WHAT IT MISSED. Its argument — that a bash-less
    # role's only writing verb should be `submit_report` — holds wherever the
    # role's whole output IS its envelope, which is `reviewer` (task 7.1, three
    # lens reports through the tool across two console cycles). It does not hold
    # here, and 7.3's own text walked past the reason while stating it: "this
    # role's entire output is a request for something ELSE to act on". That
    # request is a FILE, and the model has to write it.
    #
    # `read_only:` therefore cannot be set on this role, and that is the honest
    # state rather than an oversight. What restores the invariant is a
    # `dispatch_request` extension tool that carries the fan-out the way
    # `submit_report` carries the envelope — host-composed ids, schema refused
    # in front of the model. Until that exists, this line is the console.
    #
    # TRIAGE_DOCUMENT_MAX_BYTES survives all of this: it bounds the collation
    # document and never depended on which tool wrote it.
    tools: [read, grep, find, ls, submit_report, dispatch_request]
    # `pifleet-worker` alone. There is deliberately NO `triage` bundle: a name
    # with no directory under skills/ is a refusal at `up`, not a silently
    # shorter bundle, and inventing one to make this line look complete is the
    # thing the note above `roles:` refuses. The role's own instructions live in
    # the briefing file at the bottom of this block.
    skills: [pifleet-worker]
    # NO `cloud_access` and NO `egress_access`, both left at the `defaults:`
    # value of off, and that is a design property rather than an omission. The
    # observers hold the cluster identity and reach the network; this seat reads
    # what they wrote. Keeping the two apart is why the console can be given a
    # clock without also being given a way to touch anything.
    isolation: none                       # no repository; the outbox artifact is the whole output
    # THE CONSOLE'S DEFINING PROPERTY IN THIS FILE, restated here rather than
    # inherited from `defaults:` so that a future edit has to argue with a
    # comment. `tui` allocates no epoch, and this console dispatches 96 times a
    # day at the cadence `triage/console.yaml` ships: with no
    # `already_completed` fence a re-dispatched sweep runs a second time. It is
    # the first console in this fleet with no keyboard, which is the point — it
    # is the first one that runs when nobody is watching.
    #
    # THE TWO TRACKED FILES DISAGREE ABOUT THIS, and the disagreement is
    # RECORDED here rather than settled. THIS file declares `rpc` on both
    # `triage` and `observer-k8s` and neither seat overrides it, so in the
    # example the console is unattended. The tracked `triage/console.yaml`
    # describes seats that are `pane_mode: tui` and pays the stated price for
    # it — `recycle_after_sweeps: 0`, because §6.6's recycle is a headless `up`,
    # which takes a tui seat down and cannot bring it back. The operator's
    # `fleet.yaml` — TRACKED since 2026-09-12, so the split is three files wide
    # and diffable now rather than two files and one report of a third —
    # overrides both seats to `tui` and agrees with `console.yaml`, not with
    # this line. `operations-plan.ts:1006-1017` records the same split and says
    # in as many words not to reconcile the plan against the live file. Which
    # console this repository means to ship is a config decision for whoever
    # owns these files; a comment cannot make it.
    pane_mode: rpc
    append_system_prompt_file: ./roles/triage.md

workers:
  # 8 panes, 2 generating at a time (§9.3) — panes stay warm and visible,
  # admission control does the queuing against the single oMLX server.
  - {id: sre-1,  role: sre}
  - {id: sre-2,  role: sre}
  # obs-1 overrides the role's `pane_mode: rpc` because it is the OPERATIONS
  # CONSOLE's worker: `scripts/operations` resolves pane 1 by reading this
  # worker's resolved pane_mode, and only `tui` makes that pane Pi's own
  # interface rather than a rendered tail of its log.
  #
  # The override is on the WORKER and must stay there. Moving it up to the
  # role would put every observer on tui, and tui allocates no epoch: with
  # no `already_completed` fence a re-dispatched pass runs the same task
  # twice, which an observer watch — built on repeated dispatch of
  # near-identical tasks (§7.5) — is the least able role to afford.
  # obs-1 is the one a human watches; obs-2 takes the dispatched passes.
  # `up` permits exactly one tui worker in a fleet, and this is it.
  # THEMES: the two attended panes sit side by side in one window, so they are
  # given different palettes — an operator glancing at the console should not
  # have to read a title bar to know which agent they are typing at. Pi ships
  # only `dark` and `light`, and `light` is not a usable second choice: a Pi
  # theme sets no page background, so it paints light-mode ink onto a dark
  # terminal. Both names below come from the bundle baked into the image
  # (src/config/themes.ts); `catppuccin` alone is NOT a name, the bundle
  # distinguishes -mocha from -latte.
  #
  # -latte is one of the bundle's four LIGHT themes and is an operator's
  # deliberate choice here, not an oversight: it tunes its ink for a light
  # background, and a Pi theme sets no background of its own, so it only reads
  # well in a pane whose terminal is light. Chosen anyway.
  - {id: obs-1,  role: observer-k8s, pane_mode: tui, theme: catppuccin-mocha}
  - {id: obs-2,  role: observer-k8s}
  # Two, not one: observer is read-only, so a watch on one target can proceed
  # while an inquiry about another is answered (§6.2).
  - {id: ver-1,  role: verifier}
  # ---- the `development` console's four seats ----
  #
  # All four are pane_mode: tui, because that console is FOUR KEYBOARDS. Each
  # attended pane runs its own `up` (--attach-here hands over the terminal of
  # the process that runs it, and one process has one terminal), so this is
  # four runs — `status --all` reports them together, `--recreate` tears them
  # down, and `dispatch` refuses all four in favour of typing into the pane.
  #
  # A DISTINCT THEME EACH, and with four panes that is no longer decoration:
  # two engineers running the same role differ in nothing else on screen, so
  # the palette is the only thing that says which container a pane belongs to
  # before you read the title. All four are DARK themes — a Pi theme sets no
  # page background, so a light one (catppuccin-latte, gruvbox-light, the two
  # solarized-lights) paints light-mode ink onto whatever the terminal already
  # is. tick-1 takes that trade knowingly; these do not.
  #
  # THE THROUGHPUT COST, stated rather than discovered: these four plus the
  # operations console's two are six Pi processes against one oMLX server, and
  # run.max_concurrent bounds each RUN, not the host. Six panes generating at
  # once is six concurrent requests.
  - {id: eng-1,  role: engineer, pane_mode: tui, theme: tokyo-night}
  - {id: eng-2,  role: engineer, pane_mode: tui, theme: gruvbox-dark}
  # The `tester` role existed with no worker to run it; the development
  # console is what it was waiting for.
  - {id: tst-1,  role: tester,   pane_mode: tui, theme: everforest-dark}
  # THIS SEAT WAS `rev-1` ON `role: reviewer`, AND THE SWAP IS A PRIVILEGE
  # WIDENING, NOT A RENAME. The comment that stood here said "reviewer carries
  # NO bash (§12.1)" — true of the seat that is gone, false of the one that
  # replaced it, and a comment that survives the line it describes is worse
  # than none. What changed, read off the two roles IN THIS FILE:
  #
  #   isolation   shared-ro -> unset, so `run.isolation` at :49 = worktree
  #   tools       write REMOVED, bash ADDED — not a substitution: the seat
  #               loses the write tool and gains a shell, which both writes
  #               and executes
  #   toolchain   base      -> python    (and every toolchain includes node)
  #
  # So this console goes from three bash seats to four. NOT an egress change
  # here: neither `reviewer` nor `tester` declares `egress_access` in this
  # file. In the operator's own `fleet.yaml` — TRACKED since 2026-09-12, so
  # this difference is diffable now rather than asserted from memory — the
  # `tester` role DOES carry `egress_access: true`, so the same swap there
  # widens egress as well, from one routed seat to two — a difference between
  # the two configs worth knowing before this example is used to reason about
  # that one.
  #
  # It is a deliberate trade: review moved to a separate `review` console,
  # which this example does not declare — its four seats (col-1, rev-arch-1,
  # rev-ctx-1, rev-lang-1) exist only in `fleet.yaml`, which has been TRACKED
  # since 2026-09-12 — so those seats can be read there rather than taken on
  # trust from this comment — and its three lenses are `shared-ro` and read
  # the INTEGRATED tree. This console gains a second seat that can run a
  # suite. The cost is that nothing here reviews in-loop any more — a defect
  # eng-1 writes is not read by a reviewer until the end of the phase, after
  # the host has merged it. Stated because it is a real gap, not because it
  # is fixed.
  - {id: tst-2,  role: tester,   pane_mode: tui, theme: nord}
  # One, not two. A second concurrent writer against the same ticket system is
  # a way to interleave two workers' edits on one object, and nothing in the
  # fleet serialises them.
  # pane_mode: tui so the operations console's pane runs Pi's own interface
  # rather than a rendered tail. Each attended pane runs its OWN `up`,
  # because --attach-here hands over the terminal of the process that runs
  # it and one process has one terminal — so two attended panes are two
  # runs, which `status --all` reports and `--recreate` tears down.
  - {id: tick-1, role: ticketing, pane_mode: tui, theme: catppuccin-latte}
  # ---- the `triage` console's four seats — TWO PAIRS ----
  #
  # NO KEYBOARD IN THIS FILE, AND NO THEME EITHER. BOTH resolve to
  # `pane_mode: rpc` from their roles — `triage` and `observer-k8s` both declare
  # it — so no override belongs here, and a theme would be decoration on a pane
  # nobody types at. Read the `triage` role's `pane_mode` note before relying on
  # that: the tracked `triage/console.yaml` describes `tui` seats instead, and
  # the two tracked files are an OPEN config decision, not one of them being
  # wrong.
  #
  # This console runs on a clock rather than on attention. `tui` allocates no
  # epoch, and without that fence a re-dispatched sweep runs twice, which is the
  # one thing a console nobody is watching cannot afford. The panes are VIEWS,
  # not terminals.
  #
  # THE CADENCE IS NOT SET HERE, and which number is right depends on which file
  # you are reading. The schema default is `cadence_s: 300` — a sweep every five
  # minutes, 288 a day. The tracked `triage/console.yaml` sets 1020, so the
  # SHIPPED console sweeps every seventeen minutes, about 85 a day.
  #
  # It was 900 — fifteen minutes, 96 a day — until 2026-09-13, when the cadence
  # was raised to buy each observer a 600s deadline. That bound is not a field
  # anywhere: it is `cadence_s - reserve_s - 300`, and the 300 is shared with the
  # review console, so the cadence is the only lever that reaches it without
  # retuning a console nobody asked about.
  #
  # ONE RUN, one run id, stable for the console's whole life:
  #   pifleet up --workers tri-1,obs-t1,obs-t2,obs-t3
  # FOUR SEATS SPEND FOUR of `run.max_concurrent`, which is 4 (the key itself is
  # at :93; find it by NAME if that number has drifted) — so this console now
  # fits EXACTLY, with nothing spare.
  #
  # **That is the size the key was raised for, not a size it has outgrown.** Its
  # own comment says so in as many words — *"The triage console is the first run
  # holding four seats, and three of them fan out at once"* — text written for
  # this shape, which outlived the shrink to one pair and is correct again. The
  # paragraph that used to sit here said two seats left SLACK; that was true of
  # the shrunken console and contradicted `max_concurrent`'s own note in this
  # same file. Corrected 2026-09-12 rather than deleted, because a reader who
  # remembers the slack should find out where it went.
  #
  # A SECOND ENVIRONMENT IS STILL NEITHER A WORKER LINE NOR A `max_concurrent`
  # DECISION, and the second pair did NOT lift that refusal — it went around it.
  # `soleEnvironment` (in `src/cli/commands/triage.ts`) still refuses a targets
  # file declaring other than exactly one environment, and still should: an
  # environment token is a path segment under `~/.pifleet/triage/` and the scope
  # every incident is reported against, so two tokens for one cluster would make
  # the console report health for a fleet. What the pairs divide is the SERVICE
  # LIST of the one environment, not the environments.
  - {id: tri-1,  role: triage}
  # OBSERVERS ON THE ROLE THAT ALREADY EXISTS, doing the job it was written
  # for, at a cadence — no new role, no widened grant, and that is the strongest
  # thing this design has going for it. That still holds at two pairs: the
  # second pair adds seats, not permissions.
  #
  # ONE OBSERVER PER COLLATOR is the design as of 2026-09-12, and this paragraph
  # said ONE SEAT PER ENVIRONMENT until then. The old reasoning — that the
  # fan-out is one observer wide because `soleEnvironment` admits one
  # environment — confused a limit on ENVIRONMENTS with a limit on SEATS. One
  # environment can be divided among several observers; what it cannot be is
  # reported as several environments.
  #
  # The pairing is not expressible in this file. `TRIAGE_CONSOLE_ROSTER`
  # (`src/run/dispatch-request.ts`) enumerates both observers as legal targets
  # and cannot say which collator owns which. What enforces it is that each
  # collator is SHOWN only its own seat — `renderSweepEnvelope` takes `seats`,
  # and a collator cannot dispatch to a child task id it was never given.
  #
  # The fan-out now genuinely runs in PARALLEL, which the old note said the
  # shape would buy "the day that refusal is lifted". It bought it without the
  # lift: `dispatchPartition` was always concurrent, and there are now two
  # slices for it to be concurrent across.
  #
  # THE `model:` OVERRIDE IS GONE, AND ITS OWN TEST IS WHAT REMOVED IT.
  # SRD-TRIAGE-CONSOLE §6.11 says these seats take the `observer` role's model
  # unchanged, with a worker-level override "only if §0.2 arm 1 or 2 is taken".
  # The override existed because IN THIS FILE `observer` named a different local
  # model from `triage`, so inheriting would have delivered something other than
  # what the console runs.
  #
  # [SUPERSEDED 2026-09-09] That premise is gone: every role in this file now
  # names `gemma-4-26b-a4b-it-bf16`, so inheritance delivers the decision
  # directly and the override only re-stated it. `config.test.ts` predicted this
  # exact move in its own words — "IF THIS FAILS BECAUSE THE EXAMPLE'S
  # `observer` ROLE BECAME [the triage model], the fix is to DELETE the three
  # overrides, not to loosen the test" — and that is what happened: the guard
  # went red the moment the roles converged, and the file yielded to it rather
  # than the other way round.
  - {id: obs-t1, role: observer-k8s}
  # ---- THE SECOND AND THIRD OBSERVERS ----
  #
  # Declared with no `model:`, no `pane_mode:` and no `theme:` for exactly the
  # reason `obs-t1` carries none: both resolve from their role, and this file's
  # `observer-k8s` role already names the model the console runs. A worker-level
  # override here would re-state a decision rather than make one.
  #
  # THIS WAS `tri-2` + `obs-t2`, A SECOND PAIR, FOR ONE DAY (2026-09-12). That
  # shape ran a real sweep — T-sweep-116 split the environment 5/4 across the two
  # collators with no overlap — but it wrote TWO collation documents the host had
  # to merge and echo-check. One collated report is what the operator wanted, so
  # on 2026-09-13 the second COLLATOR was withdrawn and a third OBSERVER took its
  # place. `tri-1` is now shown all three seats and divides the environment
  # between them itself (§6.5's ⌈N/3⌉).
  #
  # THREE OBSERVERS RATHER THAN TWO IS A DEADLINE DECISION. On T-sweep-116
  # `obs-t2` spent its whole child deadline on four services and wrote nothing, so
  # all four were recorded `unobserved`. Nine services across three seats is three
  # each, and `triage/console.yaml` raised the deadline to 600s in the same edit.
  #
  # PANE ORDER IS NOT SET HERE. `DEFAULT_TRIAGE_WORKERS` lists `tri-1` first and
  # the three observers after it, and `triagePanes` splits DOWN off pane 1 then
  # RIGHT along that row — collator full width on top, observers beneath. This
  # file only declares that the seats exist.
  - {id: obs-t2, role: observer-k8s}
  - {id: obs-t3, role: observer-k8s}
