# pifleet configuration — the SRD §6.2 worked example.
#
# Merge is `defaults ← roles ← per-worker overrides`, shallow, with three
# exceptions (SRD §6.1): arrays replace (but `pifleet-worker` is re-injected
# into skills post-merge), a `:thinking` model suffix outranks any `thinking:`
# key, and relative paths resolve against THIS FILE's directory.

version: 2
name: paisley-feature-fleet

backend:
  # kind: cmux               # cmux | tmux | headless — COMMENTED OUT ON PURPOSE
  #
  # An omitted `kind` means the CLI's own default applies, which is `headless`
  # (`up.ts`'s DEFAULT_BACKEND): a backend that needs no terminal multiplexer
  # and therefore runs on any host. Uncomment the line, or write `kind:
  # headless` explicitly, only once you have decided which of the three this
  # machine can actually present.
  #
  # WHY THIS LINE IS NOT SHIPPED LIVE, which is a compatibility fact and not a
  # preference. `backend.kind` used to be parsed and read by NOTHING — `up`
  # hardcoded its config term to null — so every operator who started from this
  # file has been running headless no matter what this line said. The field is
  # now binding, and a `fleet.yaml` derived from a shipped `kind: cmux` would
  # therefore change meaning UNDER AN OPERATOR WHO CHANGED NOTHING: on a host
  # with no cmux, `pifleet up` refuses with exit 3 and no fleet where it used
  # to give a working headless run. Shipping the default commented out is what
  # keeps a copy of this file behaving on the new build the way it behaved on
  # the old one.
  #
  # The domain is still documented above, because that is the value this line
  # always had. What it must not do is silently BIND one of the three.
  workspace: pifleet         # matched on custom_title; recorded by id in registry.json
  split: alternate           # alternate | columns | rows  (pifleet-side split sequence)
  focus_on_dispatch: false

docker:
  image_prefix: pifleet/pi-worker
  pi_version: "0.79.6"       # pinned; must match SRD §4.2's protocol contract
  network: pifleet-egress
  memory: 4g
  cpus: 2
  pids_limit: 512
  read_only_root: true

run:
  root: ~/.pifleet/runs
  repo: ~/repos/paisley
  isolation: worktree        # worktree | shared-ro | none
  branch_prefix: fleet
  max_concurrent: 2          # bounded by oMLX throughput, not pane count (§5.9)
  # The F39 RUNTIME detector (§5.9 detector 2). A worker completing this many
  # consecutive turns with ZERO tool calls is failed `no_tool_calls` rather than
  # settling "successfully" — the startup probe catches a model that cannot emit
  # native tool_calls, this catches one that could and then stopped under a long
  # context. 0 disables it, and so does `llm.require_native_tool_calls: false`,
  # which §5.9 says disables BOTH detectors.
  prose_turns_before_fail: 3
  budget:
    tokens_ceiling: 6000000  # THE ceiling — local models have no price table
    # Held up front per admission and reconciled at settle. NOTE the shape this
    # gives a run: admission refuses once spent + reserve would overrun, so the
    # last `per_task_reserve_tokens` of the ceiling is unreachable and a run
    # that uses its whole budget ends on that refusal (exit 5, "budget refused
    # admission"), not on a crossed ceiling.
    per_task_reserve_tokens: 400000
    per_task_timeout: 25m
    run_timeout: 2h
  timers:
    ui_request_timeout: 5s
    # A CEILING on the per-worker stall rungs, not the window that runs.
    # Both are narrowed against the shortest deadline_s in the task list
    # (ISC-297): with the 30m default deadline the kill rung fires at 15m,
    # not the 25m below. Left at 25m deliberately — the number is what an
    # operator may not exceed, and lowering it here would only tighten the
    # one case the derivation already handles.
    event_stall_warn: 3m
    event_stall_kill: 25m
    heartbeat_interval: 5s

llm:                         # ALWAYS self-hosted oMLX, never a provider — see §5.9
  provider: omlx
  # What a WORKER dials, from inside the egress bridge. The host must be
  # `omlx.pifleet.internal` — that is the relay's listen-side alias on that
  # bridge, so a base_url naming anything else is a listener no worker can
  # resolve. It does NOT say where the model server runs; relay_upstream does.
  #
  # Renamed from `host.docker.internal` by ISC-264: that name claimed the relay
  # was the Docker host, which stopped being true once relay_upstream could name
  # a LAN peer. The old spelling still resolves, and `up` still accepts it with a
  # deprecation warning — but this file is what a new fleet is copied FROM, so
  # shipping the old one here meant every fresh config started life emitting that
  # warning, which is exactly how a transition becomes permanent.
  #
  # Note the DIAL side below keeps `host.docker.internal` deliberately. The two
  # used to be one string and are now two different things: this line is a name
  # inside the bridge, that one is the real Docker host.
  base_url: http://omlx.pifleet.internal:8000/v1
  #
  # What the RELAY dials — host:port, explicit port required (§5.9).
  #
  # Unset (the default) means `host.docker.internal:<port from base_url>`: oMLX
  # on the Docker host, exactly as it behaved before this key existed.
  #
  # To use an oMLX on a trusted LAN peer, set it to that machine's ADDRESS. A
  # hostname is refused: the relay resolves through Docker's embedded DNS, which
  # forwards to the host resolver, and that resolver was measured NOT to answer
  # mDNS/.local names here — a name would give you a relay that starts cleanly
  # and then fails every connection.
  #
  # A value other than the Docker host ALSO requires a matching `egress.allow`
  # entry (see `egress:` below). That second edit is the security decision, and
  # it is deliberately not derivable from this one: the relay is the single hole
  # in a deny-all bridge carrying untrusted model output, and one YAML string
  # should not be enough to point it at an arbitrary machine on your LAN.
  #
  # relay_upstream: 192.168.86.49:8000
  #
  # …paired with this, at TOP LEVEL (not nested here):
  #
  #   egress:
  #     allow:
  #       - {host: 192.168.86.49, port: 8000}
  api_key_env: OMLX_API_KEY  # self-hosted server credential, injected by the supervisor
  model: Qwen3-Coder-30B-A3B-Instruct-4bit
  thinking: medium
  models_allowlist:          # checked against GET /v1/models at `up`
    - Qwen3-Coder-30B-A3B-Instruct-4bit
    - Qwen3.5-35B-A3B-8bit
    - GLM-4.5-Air-MLX-4bit
  require_native_tool_calls: true   # `up` probes each model — see §5.9

cloud:
  adc: true                  # inherit the launching Claude instance's Google identity
  adc_mode: token            # token (1h, default) | file (refresh token — opt-in)
  quota_project: gen-lang-client-0675968762
  impersonate_service_account: null    # strongly preferred where one exists
  kubeconfig: null           # path to a FILTERED kubeconfig; never the host default
  token_refresh: 45m

secrets:
  # The CEILING, not a grant. A worker draws against this list with its own
  # `secrets: [NAME]`, and a variable is delivered only when it is in BOTH — so
  # a role file copied in from another fleet can ASK for a variable without
  # being able to widen what this fleet permits.
  #
  # These two are what the `ticketing` role draws against. Listing a name here
  # permits it; it does not deliver it. A worker that never asks for
  # TICKET_API_TOKEN never receives it, and a worker that asks for a name absent
  # from this list is refused at launch rather than started without it.
  #
  # NEVER provider keys — see §12.4. That is enforced, not merely asked: names
  # the fleet assigns itself are reserved, so allowlisting a credential variable
  # cannot be used to route ADC into a `cloud_access: false` worker.
  env_allowlist:
    - TICKET_API_TOKEN       # the ticket system's write credential
    - TICKET_BASE_URL        # not secret; this is the only env delivery channel

# Extra holes in the deny-all bridge. Empty by default, and every entry here is
# a decision rather than a detail.
#
# READ THIS BEFORE ADDING ONE: `egress.allow` is FLEET-WIDE. There is one
# bridge and one policy on it, so the rule below does not open the ticket system
# "for the ticketing worker" — it opens it for EVERY worker in this file,
# including the ones running untrusted model output with a bash tool. That is a
# real cost and it is not recoverable by scoping something else; the per-worker
# `egress_access` key decides who gets a route to the proxy AT ALL, not which
# destinations they may reach through it.
#
# The narrowest thing available is therefore the rule itself: one exact host,
# one port. Prefer that to a `*.` wildcard every time.
egress:
  allow:
    # An OBVIOUS EXAMPLE VALUE, and it must stay one. `tickets.example.com` is
    # reserved for documentation and resolves nowhere, so a copy of this file
    # that is never edited fails closed instead of reaching a real host.
    #
    # Your real hostname belongs in `fleet.yaml`, which is gitignored. It does
    # not belong here: this file is committed to a public repository, and an
    # internal hostname is an infrastructure disclosure that no amount of
    # later editing takes back.
    #
    # A placeholder like `<TICKET_HOST>` is NOT an option — `egressRuleHost`
    # validates every rule at load time with the same predicate the matcher
    # uses, and refuses that string as "not a valid hostname or IP literal".
    # That refusal is correct and deliberate: a rule the matcher can never
    # match silently denies the destination it was written for.
    - {host: tickets.example.com, port: 443}

# Which changed files count as the EXAM rather than the answer (§8.2). A diff
# touching one caps the verdict: a worker that can rewrite the suite cannot be
# certified by it. Omit the key — as this example does — to get the harvester's
# built-in defaults (test trees, package.json, Makefile, bunfig.toml, CI
# definitions, lockfiles, …); set it only for a repo those globs miss.
#
# `patterns` REPLACES the defaults, it does not extend them, so a list here is
# the WHOLE surface. `patterns: []` is rejected rather than treated as "match
# nothing" — an empty list would switch the cap off and look like it said
# nothing.
#
# Because it replaces, a narrow list can quietly stop the cap firing on files
# the defaults would have caught: `patterns: [ci/**]` is the obvious thing to
# write if CI is what you had in mind, and it drops `test/**` with it. That is
# allowed — it may be exactly right for your repo — but the harvest records
# what the narrowing cost in `harness.defaults_missed` and raises it as a
# discrepancy, so it cannot happen without anyone noticing.
#
# This value is read when `pifleet up` CREATES a run and is stored in that
# run's `run.json`. Editing it later does not change how an existing run is
# graded, and `artifacts`/`report` never read this file from the current
# directory — pass `--config` to grade against something other than what the
# run recorded.
#
# harness:
#   patterns: [test/**, ci/**, package.json, Makefile, bunfig.toml]

defaults:
  pane_mode: rpc
  toolchain: base
  cloud_access: false        # ADC is NOT granted unless a role opts in
  skills: [pifleet-worker]
  exclude_tools: []
  no_context_files: true     # repo AGENTS.md/CLAUDE.md is untrusted input

# Every name in a `skills:` list is a BUNDLE NAME, copied at `up` from
# <repo>/skills/<name>/ into the host directory mounted read-only at /skills.
# A name with no directory there is a refusal, not a silently shorter bundle —
# so this example lists only `pifleet-worker`, which is the one bundle that
# exists. `sre`, `tdd` and `diagnose` were listed below before anything read
# these lists; they are not authored yet, and inventing their content to make
# the example parse would be worse than naming the gap.
roles:
  # ---- SRE / cloud-ops: the primary role set ----
  sre:                                    # diagnoses AND remediates
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    toolchain: base                       # gcloud/kubectl/helm are in every image
    tools: [read, write, edit, bash, grep, find, ls]
    skills: [pifleet-worker]
    cloud_access: true                    # ADC grant — §5.8; verbs gated by §5.10
    isolation: worktree                   # manifest/IaC edits land on a branch
    append_system_prompt_file: ./roles/sre.md
  investigator:                           # read-only diagnosis; never mutates
    model: Qwen3.5-35B-A3B-8bit
    thinking: high
    toolchain: base
    tools: [read, bash, grep, find, ls]   # bash for kubectl/gcloud READ verbs
    skills: [pifleet-worker]
    cloud_access: true
    isolation: none
    append_system_prompt_file: ./roles/investigator.md
  verifier:                               # confirms a remediation actually worked
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    toolchain: base
    tools: [read, bash, grep, find, ls]
    skills: [pifleet-worker]
    cloud_access: true
    isolation: none
    append_system_prompt_file: ./roles/verifier.md

  # ---- code roles: available, secondary ----
  engineer:
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    toolchain: node
    tools: [read, write, edit, bash, grep, find, ls]
    skills: [pifleet-worker]
    append_system_prompt_file: ./roles/engineer.md
  reviewer:
    model: Qwen3.5-35B-A3B-8bit
    thinking: high
    toolchain: base
    tools: [read, grep, find, ls]        # NO bash — see §12.1
    skills: [pifleet-worker]
    append_system_prompt_file: ./roles/reviewer.md
    isolation: shared-ro
  tester:
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    toolchain: node
    tools: [read, bash, grep, find, ls]
    skills: [pifleet-worker]
    append_system_prompt_file: ./roles/tester.md

  # ---- ticketing: holds a write credential for a system OUTSIDE the fleet ----
  ticketing:
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    # `base` is deliberate and sufficient. The worker talks to the ticket API as
    # plain REST with `curl` and parses with `jq`, both of which are in every
    # image (`docker/Dockerfile:25`). There is NO vendor CLI and there is not
    # going to be one: baking one would put a vendor's name into the image hash
    # of a public repository and pin the fleet to that CLI's release cadence.
    toolchain: base
    # `write` for the outbox artifact, `bash` for curl/jq. Note what this
    # combination actually is — a shell and a live write credential for a system
    # of record — and see `roles/ticketing.md` on why scope discipline, not the
    # container boundary, is the control that binds here.
    tools: [read, write, edit, bash, grep, find, ls]
    skills: [pifleet-worker, ticket-ops]
    # NO Google identity. This role has no reason to hold one, and `egress`
    # below is a separate decision from `cloud_access` precisely so that
    # "reach one external host" does not have to be bought with ADC.
    cloud_access: false
    # Nothing it does lands in the repo, so it gets no worktree: its whole
    # output is the artifact in its outbox.
    isolation: none
    append_system_prompt_file: ./roles/ticketing.md
    # A REQUEST drawn against `secrets.env_allowlist`, never a grant. A name the
    # fleet allowlist does not carry is refused at launch, loudly, rather than
    # quietly omitted — a credential that fails to arrive otherwise surfaces as
    # a timeout deep inside an HTTP call.
    secrets: [TICKET_API_TOKEN, TICKET_BASE_URL]
    # Sets HTTPS_PROXY so this worker has a ROUTE to the bridge proxy. It grants
    # no destination by itself — `egress.allow` above decides those, fleet-wide —
    # and it grants no Google identity. That separation is the whole point of the
    # key: reaching one external host does not have to be bought with ADC.
    egress_access: true

workers:
  # 6 panes, 2 generating at a time (§9.3) — panes stay warm and visible,
  # admission control does the queuing against the single oMLX server.
  - {id: sre-1,  role: sre}
  - {id: sre-2,  role: sre}
  - {id: inv-1,  role: investigator}
  - {id: ver-1,  role: verifier}
  - {id: eng-1,  role: engineer}
  - {id: rev-1,  role: reviewer}
  # One, not two. A second concurrent writer against the same ticket system is
  # a way to interleave two workers' edits on one object, and nothing in the
  # fleet serialises them.
  - {id: tick-1, role: ticketing}
