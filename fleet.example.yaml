# pifleet configuration — the SRD §6.2 worked example.
#
# Merge is `defaults ← roles ← per-worker overrides`, shallow, with three
# exceptions (SRD §6.1): arrays replace (but `pifleet-worker` is re-injected
# into skills post-merge), a `:thinking` model suffix outranks any `thinking:`
# key, and relative paths resolve against THIS FILE's directory.

version: 2
name: paisley-feature-fleet

backend:
  # kind: cmux               # cmux | tmux | headless — COMMENTED OUT ON PURPOSE
  #
  # An omitted `kind` means the CLI's own default applies, which is `headless`
  # (`up.ts`'s DEFAULT_BACKEND): a backend that needs no terminal multiplexer
  # and therefore runs on any host. Uncomment the line, or write `kind:
  # headless` explicitly, only once you have decided which of the three this
  # machine can actually present.
  #
  # WHY THIS LINE IS NOT SHIPPED LIVE, which is a compatibility fact and not a
  # preference. `backend.kind` used to be parsed and read by NOTHING — `up`
  # hardcoded its config term to null — so every operator who started from this
  # file has been running headless no matter what this line said. The field is
  # now binding, and a `fleet.yaml` derived from a shipped `kind: cmux` would
  # therefore change meaning UNDER AN OPERATOR WHO CHANGED NOTHING: on a host
  # with no cmux, `pifleet up` refuses with exit 3 and no fleet where it used
  # to give a working headless run. Shipping the default commented out is what
  # keeps a copy of this file behaving on the new build the way it behaved on
  # the old one.
  #
  # The domain is still documented above, because that is the value this line
  # always had. What it must not do is silently BIND one of the three.
  workspace: pifleet         # matched on custom_title; recorded by id in registry.json
  split: alternate           # alternate | columns | rows  (pifleet-side split sequence)
  focus_on_dispatch: false

docker:
  image_prefix: pifleet/pi-worker
  pi_version: "0.79.6"       # pinned; must match SRD §4.2's protocol contract
  network: pifleet-egress
  memory: 4g
  cpus: 2
  pids_limit: 512
  read_only_root: true

run:
  root: ~/.pifleet/runs
  repo: ~/repos/paisley
  isolation: worktree        # worktree | shared-ro | none
  branch_prefix: fleet
  max_concurrent: 2          # bounded by oMLX throughput, not pane count (§5.9)
  # The F39 RUNTIME detector (§5.9 detector 2). A worker completing this many
  # consecutive turns with ZERO tool calls is failed `no_tool_calls` rather than
  # settling "successfully" — the startup probe catches a model that cannot emit
  # native tool_calls, this catches one that could and then stopped under a long
  # context. 0 disables it, and so does `llm.require_native_tool_calls: false`,
  # which §5.9 says disables BOTH detectors.
  prose_turns_before_fail: 3
  budget:
    tokens_ceiling: 6000000  # THE ceiling — local models have no price table
    # Held up front per admission and reconciled at settle. NOTE the shape this
    # gives a run: admission refuses once spent + reserve would overrun, so the
    # last `per_task_reserve_tokens` of the ceiling is unreachable and a run
    # that uses its whole budget ends on that refusal (exit 5, "budget refused
    # admission"), not on a crossed ceiling.
    per_task_reserve_tokens: 400000
    per_task_timeout: 25m
    run_timeout: 2h
  timers:
    ui_request_timeout: 5s
    # A CEILING on the per-worker stall rungs, not the window that runs.
    # Both are narrowed against the shortest deadline_s in the task list
    # (ISC-297): with the 30m default deadline the kill rung fires at 15m,
    # not the 25m below. Left at 25m deliberately — the number is what an
    # operator may not exceed, and lowering it here would only tighten the
    # one case the derivation already handles.
    event_stall_warn: 3m
    event_stall_kill: 25m
    heartbeat_interval: 5s

llm:                         # ALWAYS self-hosted oMLX, never a provider — see §5.9
  provider: omlx
  # What a WORKER dials, from inside the egress bridge. The host must be
  # `omlx.pifleet.internal` — that is the relay's listen-side alias on that
  # bridge, so a base_url naming anything else is a listener no worker can
  # resolve. It does NOT say where the model server runs; relay_upstream does.
  #
  # Renamed from `host.docker.internal` by ISC-264: that name claimed the relay
  # was the Docker host, which stopped being true once relay_upstream could name
  # a LAN peer. The old spelling still resolves, and `up` still accepts it with a
  # deprecation warning — but this file is what a new fleet is copied FROM, so
  # shipping the old one here meant every fresh config started life emitting that
  # warning, which is exactly how a transition becomes permanent.
  #
  # Note the DIAL side below keeps `host.docker.internal` deliberately. The two
  # used to be one string and are now two different things: this line is a name
  # inside the bridge, that one is the real Docker host.
  base_url: http://omlx.pifleet.internal:8000/v1
  #
  # What the RELAY dials — host:port, explicit port required (§5.9).
  #
  # Unset (the default) means `host.docker.internal:<port from base_url>`: oMLX
  # on the Docker host, exactly as it behaved before this key existed.
  #
  # To use an oMLX on a trusted LAN peer, set it to that machine's ADDRESS. A
  # hostname is refused: the relay resolves through Docker's embedded DNS, which
  # forwards to the host resolver, and that resolver was measured NOT to answer
  # mDNS/.local names here — a name would give you a relay that starts cleanly
  # and then fails every connection.
  #
  # A value other than the Docker host ALSO requires a matching `egress.allow`
  # entry (see `egress:` below). That second edit is the security decision, and
  # it is deliberately not derivable from this one: the relay is the single hole
  # in a deny-all bridge carrying untrusted model output, and one YAML string
  # should not be enough to point it at an arbitrary machine on your LAN.
  #
  # relay_upstream: 192.168.86.49:8000
  #
  # …paired with this, at TOP LEVEL (not nested here):
  #
  #   egress:
  #     allow:
  #       - {host: 192.168.86.49, port: 8000}
  api_key_env: OMLX_API_KEY  # self-hosted server credential, injected by the supervisor
  model: Qwen3-Coder-30B-A3B-Instruct-4bit
  thinking: medium
  models_allowlist:          # checked against GET /v1/models at `up`
    - Qwen3-Coder-30B-A3B-Instruct-4bit
    - Qwen3.5-35B-A3B-8bit
    - GLM-4.5-Air-MLX-4bit
  require_native_tool_calls: true   # `up` probes each model — see §5.9

cloud:
  adc: true                  # inherit the launching Claude instance's Google identity
  adc_mode: token            # token (1h, default) | file (refresh token — opt-in)
  # An OBVIOUS EXAMPLE VALUE, on the same rule `egress.allow` states below:
  # a copy of this file that is never edited must fail closed rather than
  # bill or scope against someone else's project. Your real project id
  # belongs in `fleet.yaml`, which is gitignored.
  #
  # It must also belong to the ADC identity the fleet inherits — the two move
  # together, and a quota project from a different account is refused at the
  # first API call rather than at launch.
  quota_project: example-project-000000
  impersonate_service_account: null    # strongly preferred where one exists
  # A FILTERED kubeconfig; never the host default.
  #
  # THREE THINGS HAVE TO BE TRUE FOR kubectl TO WORK FROM A WORKER, and the
  # first two are not obvious enough to leave undocumented — each fails in a way
  # that reads as one of the others.
  #
  # 1. THE EXEC PLUGIN CANNOT BE THE VENDOR'S DEFAULT. A managed-Kubernetes
  #    kubeconfig authenticates through an exec plugin that shells out to the
  #    cloud CLI to mint a token — and that call is a CREDENTIAL-PRINTING verb,
  #    which `docker/verbgate` classifies as MUTATING on purpose. So the plugin
  #    exits non-zero and kubectl reports a plugin failure, which looks like a
  #    broken image and is actually the gate working. Point the kubeconfig's
  #    `user.exec` at the token the supervisor ALREADY injects instead:
  #
  #      command: /bin/sh
  #      args: ["-c", "printf '{\"apiVersion\":\"client.authentication.k8s.io/v1\",
  #             \"kind\":\"ExecCredential\",\"status\":{\"token\":\"%s\"}}'
  #             \"$(cat \"$CLOUDSDK_AUTH_ACCESS_TOKEN_FILE\")\""]
  #
  #    No new verb, no second credential path, and nothing to widen: that token
  #    is in the container already because `cloud_access: true` put it there.
  #    Note the copy is taken at `up` time, so editing this file needs a relaunch.
  #
  # 2. THE CONTROL PLANE MUST BE IN `egress.allow`. The bridge is deny-all and
  #    kubectl dials the master through the CONNECT proxy, so an unlisted master
  #    comes back `Forbidden` — the PROXY's 403, not the cluster's, and
  #    indistinguishable from an RBAC denial unless you know to look. List the
  #    ADDRESS, because the address is what the CONNECT names.
  #
  # 3. THE ADC IDENTITY MUST BE ONE THE CLUSTER KNOWS. The fleet inherits the
  #    HOST's application-default credential — which is not necessarily the
  #    account `gcloud auth list` shows as active. When it is the wrong one the
  #    error finally names it, and that error is the good outcome: it means the
  #    other two are already right.
  kubeconfig: null
  token_refresh: 45m

secrets:
  # The CEILING, not a grant. A worker draws against this list with its own
  # `secrets: [NAME]`, and a variable is delivered only when it is in BOTH — so
  # a role file copied in from another fleet can ASK for a variable without
  # being able to widen what this fleet permits.
  #
  # These two are what the `ticketing` role draws against. Listing a name here
  # permits it; it does not deliver it. A worker that never asks for
  # TICKET_API_TOKEN never receives it, and a worker that asks for a name absent
  # from this list is refused at launch rather than started without it.
  #
  # HOW A GRANTED NAME IS DELIVERED: as a FILE, never as its value. The value
  # is written to a 0444 file under the worker's run directory and mounted
  # read-only at /secrets, and the worker's environment gets `<NAME>_FILE`
  # holding that path. So `echo $TICKET_API_TOKEN` inside a worker prints an
  # empty line — the value is not an environment variable, which is what stops
  # `env`, `set` and a stray expansion sweeping it into a transcript. A worker
  # can still read the file deliberately; this narrows the accident, not the
  # capability.
  #
  # NEVER provider keys — see §12.4. That is enforced, not merely asked: names
  # the fleet assigns itself are reserved, so allowlisting a credential variable
  # cannot be used to route ADC into a `cloud_access: false` worker.
  env_allowlist:
    - TICKET_API_TOKEN       # the ticket system's write credential
    # NOT a secret, and it is here only because `secrets:` is the one per-worker
    # delivery channel that exists. It rides the same file path as the
    # credential — `TICKET_BASE_URL_FILE` names a file the worker `cat`s.
    #
    # `credential: false` was NOT cosmetic. The harvester sweeps every granted
    # VALUE through `findCredentialLeaks`, and a ticket worker's artifacts
    # legitimately contain the endpoint they were pointed at — so every
    # `ticket-ops.json` was refused as carrying a credential and every verdict
    # clamped. A detector that fires on every honest run carries as little
    # information as one that never fires, and additionally teaches an operator
    # to disbelieve it when it catches the real thing.
    #
    # It says ONE thing: do not use this value as a needle. Delivery is
    # unchanged — still granted, still a 0444 file, still a `<NAME>_FILE`
    # pointer, still subject to every reserved-name and allowlist check. It
    # buys no privilege; it forfeits a check. The default is `true`, and a bare
    # string above means `true`.
    - name: TICKET_BASE_URL
      credential: false
    # The ticket CLI's two SCOPING values — which workspace, which project.
    # Not credentials either, and here for the same reason `TICKET_BASE_URL` is:
    # `secrets:` is the only per-worker delivery channel there is.
    #
    # They exist because the image now carries a ticket CLI (§5.3), and a query
    # that names no project is not a narrower query — it is a WORKSPACE-WIDE
    # one. Measured 2026-09-01: an iteration summary asked without a project
    # returned 49 projects and roughly 180 people, and read as a plausible
    # answer to the question that was asked. An unscoped query does not fail; it
    # succeeds at something else, which is the failure mode worth spending a
    # delivery slot on.
    #
    # `credential: false` for the same reason as the base URL, and it matters
    # MORE here: a ticket artifact legitimately names the project it queried, so
    # sweeping the project name as a needle would refuse every honest run.
    - name: TICKET_WORKSPACE
      credential: false
    - name: TICKET_PROJECT
      credential: false
    #
    # `observer`'s own three pairs, added for the same delivery reason and
    # carrying the SAME trap one order of magnitude wider — three base URLs
    # instead of one. THE FAILURE THIS RECORDS: before the `credential: false`
    # erratum above existed, every `TICKET_BASE_URL` was granted as a bare
    # string, so it swept as a credential — and a ticket worker's artifacts
    # legitimately NAME the endpoint they queried. Every `ticket-ops.json`
    # that did its job honestly was refused as leaking a credential, every
    # refusal was recorded as a discrepancy nothing caused, and every verdict
    # clamped on evidence that was never a leak. `observer`'s reports are
    # WORSE hit if this is not learned here: a build URL or a dashboard link
    # is close to the single most useful line in a deploy report, and this
    # role carries three base URLs rather than one. So the tokens are bare
    # strings (swept, as a credential must be) and the base URLs say up front
    # that they are not needles.
    - CI_CD_TOKEN
    - CI_BUILD_TOKEN
    - GRAFANA_TOKEN
    - name: CI_CD_BASE_URL
      credential: false
    - name: CI_BUILD_BASE_URL
      credential: false
    - name: GRAFANA_BASE_URL
      credential: false

# Extra holes in the deny-all bridge. Empty by default, and every entry here is
# a decision rather than a detail.
#
# READ THIS BEFORE ADDING ONE: `egress.allow` is FLEET-WIDE. There is one
# bridge and one policy on it, so the rule below does not open the ticket system
# "for the ticketing worker" — it opens it for EVERY worker in this file,
# including the ones running untrusted model output with a bash tool. That is a
# real cost and it is not recoverable by scoping something else; the per-worker
# `egress_access` key decides who gets a route to the proxy AT ALL, not which
# destinations they may reach through it.
#
# The narrowest thing available is therefore the rule itself: one exact host,
# one port. Prefer that to a `*.` wildcard every time.
egress:
  allow:
    # An OBVIOUS EXAMPLE VALUE, and it must stay one. `tickets.example.com` is
    # reserved for documentation and resolves nowhere, so a copy of this file
    # that is never edited fails closed instead of reaching a real host.
    #
    # Your real hostname belongs in `fleet.yaml`, which is gitignored. It does
    # not belong here: this file is committed to a public repository, and an
    # internal hostname is an infrastructure disclosure that no amount of
    # later editing takes back.
    #
    # A placeholder like `<TICKET_HOST>` is NOT an option — `egressRuleHost`
    # validates every rule at load time with the same predicate the matcher
    # uses, and refuses that string as "not a valid hostname or IP literal".
    # That refusal is correct and deliberate: a rule the matcher can never
    # match silently denies the destination it was written for.
    - {host: tickets.example.com, port: 443}
    #
    # `observer`'s destination classes (§6.4) — one exact host, one port,
    # exactly like the rule above; a host with any port is a tunnel, not an
    # allowance. FOUR new rules, not five: the fifth class in §6.4's table is
    # Google's own API endpoints (container/logging/monitoring/auth), and
    # `egress.google_hosts` already grants `*.googleapis.com` plus the two
    # auth hosts by default (below) — a fifth entry here would be the same
    # destination twice, not a narrower one.
    - {host: ci-cd.example.com, port: 443}        # the CD pipeline API — §5.1
    - {host: ci-build.example.com, port: 443}     # image-build server, D4 — build-failure logs
    - {host: k8s-control.example.com, port: 443}  # a control-plane endpoint — kubectl, helm
    - {host: grafana.example.com, port: 443}      # dashboard + datasource checks

# Which changed files count as the EXAM rather than the answer (§6.5, §8.2a). A
# diff touching one caps the verdict at `unknown`: a worker that can rewrite the
# suite cannot be certified by it. Omit the key — as this example does — to get
# the harvester's 91 built-in globs (test trees, package.json, Makefile,
# bunfig.toml, CI definitions, lockfiles, …); set it only for a repo those miss.
#
# `patterns` EXTENDS the defaults. `replace: true` makes it the WHOLE surface
# instead. The default changed on 2026-08-25 (ISC-243) and this comment block
# described the OLD behaviour until 2026-08-30 — replacement used to be the only
# option, which made the obvious first edit, `patterns: [ci/**]`, silently drop
# `test/**` along with the other 90 defaults and switch the cap off for every
# diff that did not touch `ci/`. The over-cap replacement answers is a LOUD
# failure (a run capped to `unknown`); the under-cap it caused was a SILENT one
# (a red suite certified `success`).
#
# `patterns: []` is rejected rather than treated as "match nothing" — under
# `replace: true` an empty list would switch the cap off and look like it said
# nothing. To mean "no opinion", omit the key.
#
# A narrowed surface — which now requires `replace: true` — can quietly stop the
# cap firing on files the defaults would have caught. That is allowed; it may be
# exactly right for your repo. The harvest records what the narrowing cost in
# `harness.defaults_missed` and raises it as a discrepancy, so it cannot happen
# without anyone noticing.
#
# This value is read when `pifleet up` CREATES a run and is stored in that
# run's `run.json`. Editing it later does not change how an existing run is
# graded, and `artifacts`/`report` never read this file from the current
# directory — pass `--config` to grade against something other than what the
# run recorded.
#
# harness:
#   patterns: [ci/**, scripts/verify.sh]   # EXTENDS the 91 defaults
#   replace: false                         # true = these globs are the WHOLE surface

defaults:
  pane_mode: rpc
  toolchain: base
  cloud_access: false        # ADC is NOT granted unless a role opts in
  skills: [pifleet-worker]
  exclude_tools: []
  no_context_files: true     # repo AGENTS.md/CLAUDE.md is untrusted input

# Every name in a `skills:` list is a BUNDLE NAME, copied at `up` from
# <repo>/skills/<name>/ into the host directory mounted read-only at /skills.
# A name with no directory there is a refusal, not a silently shorter bundle —
# so this example lists only `pifleet-worker`, which is the one bundle that
# exists. `sre`, `tdd` and `diagnose` were listed below before anything read
# these lists; they are not authored yet, and inventing their content to make
# the example parse would be worse than naming the gap.
roles:
  # ---- SRE / cloud-ops: the primary role set ----
  sre:                                    # diagnoses AND remediates
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    toolchain: base                       # gcloud/kubectl/helm are in every image
    tools: [read, write, edit, bash, grep, find, ls]
    skills: [pifleet-worker]
    cloud_access: true                    # ADC grant — §5.8; verbs gated by §5.10
    isolation: worktree                   # manifest/IaC edits land on a branch
    append_system_prompt_file: ./roles/sre.md
  observer:                               # read-only diagnostic role — replaces
                                           # `investigator` in this same change (D2);
                                           # deploy watches AND ad-hoc service inquiries,
                                           # one skill bundle, `mode` picks the shape
    model: Qwen3.5-35B-A3B-8bit
    thinking: high                        # reconciling four disagreeing channels is the job
    toolchain: base                       # gcloud, kubectl, helm, curl, jq already in the image
    tools: [read, write, bash, grep, find, ls]   # write is for the outbox artifact only
    skills: [pifleet-worker, observer-ops]
    cloud_access: true                    # ADC, read verbs only — §5.10 refuses every mutation
    egress_access: true                   # a ROUTE to the proxy; destinations are egress.allow
    secrets:                              # two CI dialects, one dashboard — §6.4/§6.5
      - CI_CD_TOKEN
      - CI_CD_BASE_URL
      - CI_BUILD_TOKEN
      - CI_BUILD_BASE_URL
      - GRAFANA_TOKEN
      - GRAFANA_BASE_URL
    isolation: none                       # no repository; the outbox artifact is the whole output
    pane_mode: rpc                        # tui allocates no epoch — a re-dispatched watch
                                           # pass would run twice; see the schema-level warning
                                           # this config would otherwise trip (SRD §6.2, §7.5)
    append_system_prompt_file: ./roles/observer.md
  verifier:                               # confirms a remediation actually worked
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    toolchain: base
    tools: [read, bash, grep, find, ls]
    skills: [pifleet-worker]
    cloud_access: true
    isolation: none
    append_system_prompt_file: ./roles/verifier.md

  # ---- code roles: available, secondary ----
  engineer:
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    toolchain: node
    tools: [read, write, edit, bash, grep, find, ls]
    skills: [pifleet-worker]
    append_system_prompt_file: ./roles/engineer.md
  reviewer:
    model: Qwen3.5-35B-A3B-8bit
    thinking: high
    toolchain: base
    tools: [read, grep, find, ls]        # NO bash — see §12.1
    skills: [pifleet-worker]
    append_system_prompt_file: ./roles/reviewer.md
    isolation: shared-ro
  tester:
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    toolchain: node
    tools: [read, bash, grep, find, ls]
    skills: [pifleet-worker]
    append_system_prompt_file: ./roles/tester.md

  # ---- ticketing: holds a write credential for a system OUTSIDE the fleet ----
  ticketing:
    model: Qwen3-Coder-30B-A3B-Instruct-4bit
    # `base` is deliberate and sufficient. The worker talks to the ticket API as
    # plain REST with `curl` and parses with `jq`, both of which are in every
    # image (`docker/Dockerfile:25`). There is NO vendor CLI and there is not
    # going to be one: baking one would put a vendor's name into the image hash
    # of a public repository and pin the fleet to that CLI's release cadence.
    toolchain: base
    # `write` for the outbox artifact, `bash` for curl/jq. Note what this
    # combination actually is — a shell and a live write credential for a system
    # of record — and see `roles/ticketing.md` on why scope discipline, not the
    # container boundary, is the control that binds here.
    tools: [read, write, edit, bash, grep, find, ls]
    skills: [pifleet-worker, ticket-ops]
    # NO Google identity. This role has no reason to hold one, and `egress`
    # below is a separate decision from `cloud_access` precisely so that
    # "reach one external host" does not have to be bought with ADC.
    cloud_access: false
    # Nothing it does lands in the repo, so it gets no worktree: its whole
    # output is the artifact in its outbox.
    isolation: none
    append_system_prompt_file: ./roles/ticketing.md
    # A REQUEST drawn against `secrets.env_allowlist`, never a grant. A name the
    # fleet allowlist does not carry is refused at launch, loudly, rather than
    # quietly omitted — a credential that fails to arrive otherwise surfaces as
    # a timeout deep inside an HTTP call. So is a name that is set nowhere in
    # the operator's environment, and so is a file that cannot be written.
    #
    # This worker therefore receives TICKET_API_TOKEN_FILE, TICKET_BASE_URL_FILE,
    # TICKET_WORKSPACE_FILE and TICKET_PROJECT_FILE, each naming a path under
    # /secrets. It receives none of the VALUES in its environment.
    # `skills/ticket-ops/SKILL.md` documents the `.env` form that turns the
    # first of those files into the CLI's configuration without the value
    # passing through a shell variable — the same construction the `curl
    # --config` block used before the image carried a CLI, for the same reason.
    #
    # All four are requested TOGETHER because three of them are useless alone: a
    # credential with no endpoint cannot dial, and an endpoint with no project
    # answers a workspace-wide question instead of the one asked.
    secrets: [TICKET_API_TOKEN, TICKET_BASE_URL, TICKET_WORKSPACE, TICKET_PROJECT]
    # Sets HTTPS_PROXY so this worker has a ROUTE to the bridge proxy. It grants
    # no destination by itself — `egress.allow` above decides those, fleet-wide —
    # and it grants no Google identity. That separation is the whole point of the
    # key: reaching one external host does not have to be bought with ADC.
    egress_access: true

workers:
  # 8 panes, 2 generating at a time (§9.3) — panes stay warm and visible,
  # admission control does the queuing against the single oMLX server.
  - {id: sre-1,  role: sre}
  - {id: sre-2,  role: sre}
  # obs-1 overrides the role's `pane_mode: rpc` because it is the OPERATIONS
  # CONSOLE's worker: `scripts/operations` resolves pane 1 by reading this
  # worker's resolved pane_mode, and only `tui` makes that pane Pi's own
  # interface rather than a rendered tail of its log.
  #
  # The override is on the WORKER and must stay there. Moving it up to the
  # role would put every observer on tui, and tui allocates no epoch: with
  # no `already_completed` fence a re-dispatched pass runs the same task
  # twice, which an observer watch — built on repeated dispatch of
  # near-identical tasks (§7.5) — is the least able role to afford.
  # obs-1 is the one a human watches; obs-2 takes the dispatched passes.
  # `up` permits exactly one tui worker in a fleet, and this is it.
  # THEMES: the two attended panes sit side by side in one window, so they are
  # given different palettes — an operator glancing at the console should not
  # have to read a title bar to know which agent they are typing at. Pi ships
  # only `dark` and `light`, and `light` is not a usable second choice: a Pi
  # theme sets no page background, so it paints light-mode ink onto a dark
  # terminal. Both names below come from the bundle baked into the image
  # (src/config/themes.ts); `catppuccin` alone is NOT a name, the bundle
  # distinguishes -mocha from -latte.
  #
  # -latte is one of the bundle's four LIGHT themes and is an operator's
  # deliberate choice here, not an oversight: it tunes its ink for a light
  # background, and a Pi theme sets no background of its own, so it only reads
  # well in a pane whose terminal is light. Chosen anyway.
  - {id: obs-1,  role: observer, pane_mode: tui, theme: catppuccin-mocha}
  - {id: obs-2,  role: observer}
  # Two, not one: observer is read-only, so a watch on one target can proceed
  # while an inquiry about another is answered (§6.2).
  - {id: ver-1,  role: verifier}
  # ---- the `development` console's four seats ----
  #
  # All four are pane_mode: tui, because that console is FOUR KEYBOARDS. Each
  # attended pane runs its own `up` (--attach-here hands over the terminal of
  # the process that runs it, and one process has one terminal), so this is
  # four runs — `status --all` reports them together, `--recreate` tears them
  # down, and `dispatch` refuses all four in favour of typing into the pane.
  #
  # A DISTINCT THEME EACH, and with four panes that is no longer decoration:
  # two engineers running the same role differ in nothing else on screen, so
  # the palette is the only thing that says which container a pane belongs to
  # before you read the title. All four are DARK themes — a Pi theme sets no
  # page background, so a light one (catppuccin-latte, gruvbox-light, the two
  # solarized-lights) paints light-mode ink onto whatever the terminal already
  # is. tick-1 takes that trade knowingly; these do not.
  #
  # THE THROUGHPUT COST, stated rather than discovered: these four plus the
  # operations console's two are six Pi processes against one oMLX server, and
  # run.max_concurrent bounds each RUN, not the host. Six panes generating at
  # once is six concurrent requests.
  - {id: eng-1,  role: engineer, pane_mode: tui, theme: tokyo-night}
  - {id: eng-2,  role: engineer, pane_mode: tui, theme: gruvbox-dark}
  # The `tester` role existed with no worker to run it; the development
  # console is what it was waiting for.
  - {id: tst-1,  role: tester,   pane_mode: tui, theme: everforest-dark}
  # reviewer carries NO bash (§12.1) and that is unchanged here: a tui pane is
  # a person's keyboard on Pi's own interface, not a widening of the agent's
  # tool grant. `pifleet shell` still reaches the container, because that is
  # the FLEET exec'ing in, not a tool the reviewer may call.
  - {id: rev-1,  role: reviewer,  pane_mode: tui, theme: nord}
  # One, not two. A second concurrent writer against the same ticket system is
  # a way to interleave two workers' edits on one object, and nothing in the
  # fleet serialises them.
  # pane_mode: tui so the operations console's pane runs Pi's own interface
  # rather than a rendered tail. Each attended pane runs its OWN `up`,
  # because --attach-here hands over the terminal of the process that runs
  # it and one process has one terminal — so two attended panes are two
  # runs, which `status --all` reports and `--recreate` tears down.
  - {id: tick-1, role: ticketing, pane_mode: tui, theme: catppuccin-latte}
